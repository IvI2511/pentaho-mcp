# Development environment (shared example; no secrets).
# Pass it to Pan/Kitchen or define it in Spoon (Edit > Set Environment Variables). Your real values
# and passwords go in env/local.properties, which .gitignore keeps out of the repository.
# Absolute path of the datasets/ folder of your copy of the project (a relative one would be resolved against PDI's folder)
DIR_DATOS=/path/to/your/copy/datasets
DIR_SALIDA=/path/to/your/copy/salida
DB_HOST=localhost
DB_PORT=5432
DB_NAME=dev
DB_USER=etl
# DB_PASSWORD goes in env/local.properties, never here
