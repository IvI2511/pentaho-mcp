# harden_etl: why, how_to, warnings, skipped and not_applied reasons and notes (language argument; default en).
# RobustecerAnalisis.java, RobustecerAplicar.java. Recipe titles for the «Harden…» dialog of the IDC menu. UTF-8.
reason_no_error_handling_table=Table output cannot send rows to an error hop on this database (SQLite, for example): use Insert/Update (idempotent_load), which can
reason_no_error_handling=the step does not support error handling
fields_unknown=fields unknown: %s
fields_unknown_none=fields unknown: no fields reach the step
why_rejects_load=A database error on one row (text too long, value out of range, a constraint) stops the whole load.
why_rejects_convert=One row that cannot be converted stops the whole run.
warn_batch=Table output with batch updates: with error handling Kettle may reject the whole batch; set use_batch=N if single rows must be rejected.
warn_transactional=The transformation is transactional (unique connections): on some databases a failed row aborts the transaction.
why_reject_reason=Its rejected rows carry no reason: nobody can tell why they were rejected.
warn_add_fields=Add %s to the fields of '%s' by hand.
why_required=A line with %s empty (or cut short) reaches the load: it is loaded with a null key or stops it. It goes to the rejects file with the list of missing fields instead.
warn_required_detected=Required fields detected from the keys used downstream: correct them with required_fields={"%s": [...]} if needed.
not_a_field=%s (not a field of the input)
howto_required_identifiers=The reason is built with a User Defined Java Expression, which needs field names that are Java identifiers; these are not: %s. Rename them in the input (or use a Filter rows with IS NOT NULL and a Modified Java Script Value for the reason).
howto_required_by_name=Insert the Filter rows by hand: '%s' sends rows by name.
why_input_parameter=The input file is fixed: to try the load with a broken file (or tomorrow's file) the transformation has to be edited. With a parameter it is run with another file without touching it.
why_strict=Lenient conversions let badly written values in without an error (31/02 becomes 3 March, '12abc' may be read as 12): the row is loaded wrong. Strict, it is rejected with Kettle's message.
warn_strict_no_errors=Without error handling a strict conversion stops the run: %s
skip_dedupe_counter=the key %s comes from the counter '%s': every row gets a new one, so a dedupe on it removes nothing. Pass keys={"%s": ["<business key>"]} to dedupe on the business key, and make the key stable (stable_surrogate_keys)
why_dedupe=Two rows with the same %s reach the load: the second overwrites the first (or breaks the key). The first one wins and the repeated ones are dropped (declared).
howto_dedupe=Insert a Unique rows (HashSet) by %s right before '%s' (it gets rows from several hops or by name).
skip_wait_deadlock=would deadlock: '%s' gets its rows through '%s' (fine when the lookup finds the existing keys of the rows being loaded, as in stable_surrogate_keys)
why_wait='%s' reads %s while %s is still writing it (in Kettle every step starts at once): rows can miss keys that are being loaded.
howto_wait=Insert a Block until steps finish (waiting for %s) right before '%s'.
warn_wait_shared='%s' and the load it waits for get rows from the same source: a Blocking step (all rows, spilling to disk) goes before the wait so the source never stalls.
warn_eat_row=Set eat_row_on_failure=N on '%s' by hand.
warn_inner_join=If the source SQL joins with an INNER JOIN, the orphans disappear before this filter: make it a LEFT JOIN (by hand).
why_split=A value with fewer or more parts than expected leaves nulls or shifts the columns.
howto_split=Replace the Field splitter by a Regex evaluation with one capture group per field (allowcapturegroups=Y) and a result field (<field>_ok); a Filter rows on it sends the rows that do not match to the rejects with 'unexpected format of <field>'.
why_stable_keys='%s' is a counter that starts at 1 on every run: re-running (or a new row in the middle) changes the keys, and the facts already loaded point to another member.
howto_stable_keys=Database lookup of the existing key by the natural key -> Join rows with a Table input 'SELECT COALESCE(MAX(pk),0) AS max_pk FROM <dim>' -> Sequence 1..n -> Calculator pk_new = max_pk + n, pk = NVL(existing, pk_new) (remove the temporary fields) -> the load (Insert/Update by the natural key). Or use Dimension lookup/update with a technical key (pattern 04).
why_orphans_eat=A row whose key is not found disappears without a trace (eat_row_on_failure=Y).
why_orphans_null=A row whose key is not found reaches '%s' with a null key.
howto_orphans=After the last lookup: Filter rows '<fact> complete?' (IS NOT NULL on the looked-up keys) -> false: a User Defined Java Expression with motivo = "the <natural key> X is not in <table>" -> the rejects tail. Set eat_row_on_failure=N. If the source SQL has an INNER JOIN, make it a LEFT JOIN so orphans reach the filter. Or default 0 = an 'unknown' member that exists in the dimension.
why_idempotent=Re-running the load inserts every row again (duplicates, or a primary key error).
howto_idempotent=Replace it by an Insert/Update with the same name, position and hops: keys = the natural key (fields from the input, not from a sequence or a lookup); update every other column except the surrogate key (update=N). For a staging table, truncate=Y instead.
why_aggregate=Two rows with the same %s overwrite each other in the Insert/Update (the last one wins).
howto_aggregate=Memory group by %s right before it, SUM of the measures (ask the person: maybe MAX or AVG), declared with the attribute pentaho-live-robust/drops=aggregate.
skip_step_exists=no longer applies: there is already a step '%s' (call harden_etl again)
skip_no_step=no longer applies: there is no step '%s'
skip_no_hop=no longer applies: there is no hop '%s' -> '%s'
skip_conflict=conflicts with %s (both move the hop '%s' -> '%s'): call harden_etl again after this one
skip_hop_exists=no longer applies: there is already a hop '%s' -> '%s'
skip_param_exists=no longer applies: the parameter %s already exists
apply_failed=failed: %s (the changes made so far are one Ctrl+Z)
note_parameter=The parameter %s is not undone with Ctrl+Z (Spoon does not undo parameters): remove it in the transformation settings if needed.
recipe_rejects_on_error=Bad rows to a rejects file
recipe_reject_reason=Reason on every reject
recipe_required_fields=Required fields
recipe_strict_conversion=Strict conversions
recipe_safe_split=Safe field split
recipe_dedupe_before_load=Remove duplicates before loading
recipe_stable_surrogate_keys=Stable surrogate keys
recipe_orphans_to_rejects=Orphan rows to rejects
recipe_idempotent_load=Re-runnable load
recipe_aggregate_to_grain=Aggregate to the fact grain
recipe_wait_for_loads=Wait for the tables being loaded
recipe_input_file_parameter=Input file as a parameter
recipe_default_optional=Defaults for optional fields
recipe_job_guard=Job guards
diff_clean=+ %s (Replace in string: one line, no blanks at the edges)
diff_write=+ %s (Text file output) %s [%d fields, created even when empty]
diff_add_hop=+ hop %s -> %s
diff_add_error_hop=+ error hop %s -> %s
diff_remove_hop=- hop %s -> %s
diff_error_handling=~ %s: error handling -> %s (%s, %s)
diff_error_reason=~ %s: error rows get %s
diff_error_reason_fields=~ %s: error rows get %s and %s
diff_also_writes=~ %s: also writes %s
diff_filter=+ %s (Filter rows: %s)
diff_reason_missing=+ %s (User Defined Java Expression: %s = the missing fields)
diff_dummy=+ %s (Dummy: sends the complete rows where '%s' sent them)
diff_retarget=~ %s: %s -> %s
diff_parameter=+ parameter %s (default %s)
diff_file=~ %s: file %s -> %s
diff_strict=~ %s: strict conversion (not lenient) of %s
diff_unique=+ %s (Unique rows (HashSet) by %s; declared drops=duplicates)
diff_blocking=+ %s (Blocking step, all rows, spills to disk: the shared source never waits)
diff_block_until=+ %s (Block until steps finish: %s)
diff_reason_orphan=+ %s (User Defined Java Expression: %s = which key is not in %s)
diff_eat_row=~ %s: eat_row_on_failure=N (rows not found reach the filter)
why_filter_false=The rows that do not meet the condition of this filter vanish without a trace before the load. They go to the rejects file with the condition they failed; if dropping them is deliberate, silence silent_filter_drop on the filter instead.
diff_reason_filter=+ %s (User Defined Java Expression: %s = it does not meet the condition of '%s')
