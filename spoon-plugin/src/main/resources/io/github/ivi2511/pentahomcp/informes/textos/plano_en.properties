# ---- review (plan_review): .msg, .fix and .ask (the question for the user)
rev.vacia=The review finds nothing to fix.
rev.resumen=%d errors, %d warnings and %d suggestions.
rev.pregunta=Question: %s
rev.no_goal.msg=The plan has no goal.
rev.no_goal.fix=Write in one sentence what the ETL must achieve and for whom.
rev.no_goal.ask=What is this ETL for: which report, KPI or system does it feed?
rev.no_grain.msg=The grain is missing: nobody knows what one row of the target represents.
rev.no_grain.fix=Define the grain (e.g. 'one row per valid ticket line'): the key, the duplicates and the aggregations follow from it.
rev.no_grain.ask=What exactly does one row of the fact table represent?
rev.no_sources.msg=The plan has no sources.
rev.no_sources.fix=Add each source with its format, volume and frequency.
rev.no_targets.msg=The plan has no targets.
rev.no_targets.fix=Add each output table or file with its key and its load type.
rev.no_stages.msg=The plan has no stages: plan_build has nothing to build.
rev.no_stages.fix=Split the work in stages (extract → clean → look up keys → load).
rev.load_strategy_missing.msg=It does not say whether the load is full or incremental.
rev.load_strategy_missing.fix=Set load: full or incremental (and for incremental, incremental_by).
rev.load_strategy_missing.ask=Does the whole history arrive every time, or only what is new since the last load?
rev.incremental_without_watermark.msg=The load is incremental but it does not say how new rows are recognised.
rev.incremental_without_watermark.fix=Set incremental_by: the date or sequence field that marks how far the last load went.
rev.incremental_without_watermark.ask=Which field tells which rows are new (creation date, increasing id...)?
rev.source_without_format.msg=Source '%s' has no format.
rev.source_without_format.fix=Set format: csv, excel, json, table...
rev.source_without_volume.msg=Source '%s' has no volume or frequency.
rev.source_without_volume.fix=Set volume and frequency: they decide whether you need an incremental load, in-memory sorting or partitioning.
rev.source_without_volume.ask=How many rows does '%s' bring and how often does it arrive?
rev.source_without_rejects.msg=Source '%s' has no rejects plan: one bad row would stop the load or get lost without a trace.
rev.source_without_rejects.fix=Set rejects (the rejects file with the reason) or add a reject stage after the stage that reads it.
rev.source_without_rejects.ask=What do we do with the rows of '%s' that fail validation: set them aside in a file with the reason, or stop the load?
rev.source_not_read.msg=No stage reads source '%s'.
rev.source_not_read.fix=Put it in the reads of the stage that extracts it, or remove it from the plan.
rev.target_not_written.msg=No stage writes target '%s'.
rev.target_not_written.fix=Put it in the writes of the stage that loads it, or remove it from the plan.
rev.non_idempotent_load.msg=The load of '%s' (%s) is not idempotent: running it twice duplicates rows.
rev.non_idempotent_load.fix=Use truncate_insert, upsert with a key or scd1/scd2, or delete the period you reload first.
rev.non_idempotent_load.ask=If the load fails halfway and is run again, what must happen to the rows of '%s' that were already written?
rev.upsert_without_key.msg='%s' is loaded with %s but has no key.
rev.upsert_without_key.fix=Set key: the fields that identify a row (the business key).
rev.dimension_without_history.msg=Dimension '%s' does not say whether it keeps history.
rev.dimension_without_history.fix=Set load: scd1 (overwrite), scd2 (keep history) or truncate_insert.
rev.dimension_without_history.ask=If a value of '%s' changes (say, the category of a product), do we need to keep what it was before, or is the current value enough?
rev.lookup_without_key.msg=The lookup of '%s' has no key.
rev.lookup_without_key.fix=Set key: the fields it looks up by.
rev.lookup_without_on_missing.msg='%s' does not say what to do when the key is not found (the orphans).
rev.lookup_without_on_missing.fix=Set on_missing: reject, default, unknown_member or fail.
rev.lookup_without_on_missing.ask=In '%s', what do we do with a row whose customer, product or store does not exist: reject it, assign it to an 'unknown' member, or stop the load?
rev.orphans_rejected_nowhere.msg='%s' rejects the orphans, but no reject stage comes after it.
rev.orphans_rejected_nowhere.fix=Add a reject stage with after: this stage (the rejects file or table with the reason).
rev.dedupe_without_key.msg='%s' removes duplicates without saying by which fields.
rev.dedupe_without_key.fix=Set key on the stage (or on the source it reads).
rev.dedupe_without_key.ask=When are two rows the same: which fields must match?
rev.stage_without_input.msg=Stage '%s' gets no rows: it has no after, reads or lookup.
rev.stage_without_input.fix=Say which stage it comes after (after) or which source it reads (reads).
rev.stage_dead_end.msg=The rows of '%s' go nowhere: no stage follows it and it writes no target.
rev.stage_dead_end.fix=Connect it to the next stage or say which target it writes.
rev.rule_unused.msg=No stage applies rule %s ('%s').
rev.rule_unused.fix=Put it in the rules of the stage that implements it.
rev.no_orchestration.msg=The plan has %d transformations and does not say in which order they run.
rev.no_orchestration.fix=Add orchestration with name (the job), order and on_failure.
rev.no_orchestration.ask=In which order are they loaded (dimensions first, then facts) and what happens if one fails?
rev.orchestration_without_failure_path.msg=The orchestration does not say what to do when a transformation fails.
rev.orchestration_without_failure_path.fix=Set on_failure: abort, continue or notify.
rev.orchestration_without_failure_path.ask=If a transformation fails, do we abort the whole load, go on with the next one, or notify someone?
rev.risk_without_mitigation.msg=Risk '%s' has no mitigation.
rev.risk_without_mitigation.fix=Say which stage or rule controls it.
rev.decision_without_why.msg=Decision '%s' does not say why.
rev.decision_without_why.fix=Write down the reason: in a few months nobody will remember.

