# harden_etl: por qué, cómo hacerlo, avisos, motivos de lo descartado y de lo no aplicado y notas (argumento language).
# RobustecerAnalisis.java, RobustecerAplicar.java. Títulos de las recetas del diálogo «Robustecer…» del menú IDC. UTF-8.
reason_no_error_handling_table=Un Table output no puede mandar filas a un hop de error en esta base de datos (SQLite, por ejemplo): usa un Insert/Update (idempotent_load), que sí puede
reason_no_error_handling=el step no admite manejo de errores
fields_unknown=campos desconocidos: %s
fields_unknown_none=campos desconocidos: no llega ningún campo al step
why_rejects_load=Un error de la base de datos en una fila (texto demasiado largo, valor fuera de rango, una restricción) para toda la carga.
why_rejects_convert=Una fila que no se puede convertir para toda la ejecución.
warn_batch=Table output con actualizaciones por lotes: con manejo de errores Kettle puede rechazar el lote entero; pon use_batch=N si hay que rechazar filas sueltas.
warn_transactional=La transformación es transaccional (conexiones únicas): en algunas bases de datos una fila que falla aborta la transacción.
why_reject_reason=Sus filas rechazadas no llevan motivo: nadie puede saber por qué se rechazaron.
warn_add_fields=Añade a mano %s a los campos de «%s».
why_required=Una línea con %s vacío (o cortada) llega a la carga: se carga con una clave nula o la para. En su lugar va al archivo de rechazos con la lista de campos que faltan.
warn_required_detected=Campos obligatorios deducidos de las claves que se usan más adelante: corrígelos con required_fields={"%s": [...]} si hace falta.
not_a_field=%s (no es un campo de la entrada)
howto_required_identifiers=El motivo se arma con una User Defined Java Expression, que necesita nombres de campo que sean identificadores de Java; estos no lo son: %s. Renómbralos en la entrada (o usa un Filter rows con IS NOT NULL y un Modified Java Script Value para el motivo).
howto_required_by_name=Inserta el Filter rows a mano: «%s» manda las filas por nombre.
why_input_parameter=El archivo de entrada está fijo: para probar la carga con un archivo roto (o con el de mañana) hay que editar la transformación. Con un parámetro se ejecuta con otro archivo sin tocarla.
why_strict=Las conversiones laxas dejan pasar valores mal escritos sin error (31/02 pasa a ser 3 de marzo, «12abc» puede leerse como 12): la fila se carga mal. En modo estricto se rechaza con el mensaje de Kettle.
warn_strict_no_errors=Sin manejo de errores, una conversión estricta para la ejecución: %s
skip_dedupe_counter=la clave %s sale del contador «%s»: cada fila recibe una nueva, así que quitar repetidos por ella no quita nada. Pasa keys={"%s": ["<clave de negocio>"]} para quitar repetidos por la clave de negocio, y haz estable la clave (stable_surrogate_keys)
why_dedupe=Dos filas con el mismo %s llegan a la carga: la segunda pisa a la primera (o rompe la clave). Gana la primera y las repetidas se descartan (declarado).
howto_dedupe=Inserta un Unique rows (HashSet) por %s justo antes de «%s» (recibe filas de varios hops o por nombre).
skip_wait_deadlock=se bloquearía: «%s» recibe sus filas a través de «%s» (está bien cuando la búsqueda encuentra las claves existentes de las filas que se cargan, como en stable_surrogate_keys)
why_wait=«%s» lee %s mientras %s todavía la está escribiendo (en Kettle todos los steps arrancan a la vez): a algunas filas les pueden faltar claves que se están cargando.
howto_wait=Inserta un Block until steps finish (que espere a %s) justo antes de «%s».
warn_wait_shared=«%s» y la carga a la que espera reciben filas de la misma fuente: delante de la espera va un Blocking step (todas las filas, volcando a disco) para que la fuente nunca se quede parada.
warn_eat_row=Pon eat_row_on_failure=N en «%s» a mano.
warn_inner_join=Si el SQL de origen une con un INNER JOIN, las huérfanas desaparecen antes de este filtro: cámbialo a LEFT JOIN (a mano).
why_split=Un valor con menos o más partes de las esperadas deja nulos o desplaza las columnas.
howto_split=Cambia el Field splitter por un Regex evaluation con un grupo de captura por campo (allowcapturegroups=Y) y un campo de resultado (<campo>_ok); un Filter rows sobre él manda a rechazos las filas que no encajan con «formato inesperado de <campo>».
why_stable_keys=«%s» es un contador que empieza en 1 en cada ejecución: volver a ejecutar (o una fila nueva en medio) cambia las claves, y los hechos ya cargados apuntan a otro miembro.
howto_stable_keys=Database lookup de la clave existente por la clave natural -> Join rows con un Table input 'SELECT COALESCE(MAX(pk),0) AS max_pk FROM <dim>' -> Sequence 1..n -> Calculator pk_new = max_pk + n, pk = NVL(existente, pk_new) (quita los campos temporales) -> la carga (Insert/Update por la clave natural). O usa Dimension lookup/update con una clave técnica (patrón 04).
why_orphans_eat=Una fila cuya clave no se encuentra desaparece sin dejar rastro (eat_row_on_failure=Y).
why_orphans_null=Una fila cuya clave no se encuentra llega a «%s» con una clave nula.
howto_orphans=Después de la última búsqueda: Filter rows «¿<hecho> completo?» (IS NOT NULL en las claves buscadas) -> falso: una User Defined Java Expression con motivo = "la <clave natural> X no está en <tabla>" -> la cola de rechazos. Pon eat_row_on_failure=N. Si el SQL de origen tiene un INNER JOIN, cámbialo a LEFT JOIN para que las huérfanas lleguen al filtro. O un valor por defecto 0 = un miembro «desconocido» que exista en la dimensión.
why_idempotent=Volver a ejecutar la carga inserta otra vez todas las filas (duplicados, o un error de clave primaria).
howto_idempotent=Cámbialo por un Insert/Update con el mismo nombre, posición y hops: claves = la clave natural (campos de la entrada, no de una secuencia ni de una búsqueda); actualiza todas las demás columnas salvo la clave subrogada (update=N). Para una tabla de staging, mejor truncate=Y.
why_aggregate=Dos filas con el mismo %s se pisan en el Insert/Update (gana la última).
howto_aggregate=Memory group by por %s justo antes, SUM de las medidas (pregúntaselo a la persona: quizá MAX o AVG), declarado con el atributo pentaho-live-robust/drops=aggregate.
skip_step_exists=ya no se aplica: ya hay un step «%s» (vuelve a llamar a harden_etl)
skip_no_step=ya no se aplica: no hay ningún step «%s»
skip_no_hop=ya no se aplica: no hay ningún hop «%s» -> «%s»
skip_conflict=choca con %s (las dos mueven el hop «%s» -> «%s»): vuelve a llamar a harden_etl después de esta
skip_hop_exists=ya no se aplica: ya hay un hop «%s» -> «%s»
skip_param_exists=ya no se aplica: el parámetro %s ya existe
apply_failed=falló: %s (los cambios hechos hasta aquí se deshacen con un Ctrl+Z)
note_parameter=El parámetro %s no se deshace con Ctrl+Z (Spoon no deshace parámetros): quítalo en los ajustes de la transformación si hace falta.
recipe_rejects_on_error=Filas malas a un archivo de rechazos
recipe_reject_reason=Motivo en cada rechazo
recipe_required_fields=Campos obligatorios
recipe_strict_conversion=Conversiones estrictas
recipe_safe_split=Separación de campos segura
recipe_dedupe_before_load=Quitar repetidos antes de cargar
recipe_stable_surrogate_keys=Claves subrogadas estables
recipe_orphans_to_rejects=Filas huérfanas a rechazos
recipe_idempotent_load=Carga que se puede repetir
recipe_aggregate_to_grain=Agregar al grano del hecho
recipe_wait_for_loads=Esperar a las tablas que se cargan
recipe_input_file_parameter=Archivo de entrada como parámetro
recipe_default_optional=Valores por defecto de los campos opcionales
recipe_job_guard=Protecciones del job
diff_clean=+ %s (Replace in string: una sola línea, sin espacios en los bordes)
diff_write=+ %s (Text file output) %s [%d campos; se crea aunque quede vacío]
diff_add_hop=+ hop %s -> %s
diff_add_error_hop=+ hop de error %s -> %s
diff_remove_hop=- hop %s -> %s
diff_error_handling=~ %s: manejo de errores -> %s (%s, %s)
diff_error_reason=~ %s: las filas de error llevan %s
diff_error_reason_fields=~ %s: las filas de error llevan %s y %s
diff_also_writes=~ %s: escribe también %s
diff_filter=+ %s (Filter rows: %s)
diff_reason_missing=+ %s (User Defined Java Expression: %s = los campos que faltan)
diff_dummy=+ %s (Dummy: manda las filas completas adonde las mandaba «%s»)
diff_retarget=~ %s: %s -> %s
diff_parameter=+ parámetro %s (por defecto %s)
diff_file=~ %s: archivo %s -> %s
diff_strict=~ %s: conversión estricta (sin modo permisivo) de %s
diff_unique=+ %s (Unique rows (HashSet) por %s; descarte declarado de repetidos)
diff_blocking=+ %s (Blocking step: todas las filas, vuelca a disco; la fuente compartida nunca espera)
diff_block_until=+ %s (Block until steps finish: %s)
diff_reason_orphan=+ %s (User Defined Java Expression: %s = qué clave no está en %s)
diff_eat_row=~ %s: eat_row_on_failure=N (las filas no encontradas llegan al filtro)
why_filter_false=Las filas que no cumplen la condición de este filtro desaparecen sin rastro antes de la carga. Pasan al archivo de rechazos con la condición que no cumplen; si descartarlas es a propósito, silencia silent_filter_drop en el filtro en lugar de esto.
diff_reason_filter=+ %s (User Defined Java Expression: %s = no cumple la condición de «%s»)
