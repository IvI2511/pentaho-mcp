# Image export texts (RenderImagenes). Owner: WP10. Read as UTF-8 (Rotulos).
# Formats with String.format(locale, ...): %s, %d; a literal % is %%.
# lienzo, diagrama, grafico and imagen go into file names (no accents or spaces).
progreso=Images: %s
lienzo=canvas
diagrama=diagram
grafico=chart
imagen=image
aviso_sin_dibujo=%d diagram(s) or chart(s) were not exported: there was no browser to draw them or their image failed.
aviso_solo_svg=%d chart(s) are only in SVG: the PNG could not be generated.
aviso_vacia=The report has no diagrams, charts or images: no file was written.
