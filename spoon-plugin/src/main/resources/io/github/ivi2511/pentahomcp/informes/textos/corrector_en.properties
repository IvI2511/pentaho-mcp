# Exercise grader (docs/corrector-diseno.md): "corrector" area of Rotulos. Read as UTF-8.
# Patterns use String.format with the language locale: %s text, %d integer, %,d integer with thousands, %.2f
# decimal, %% a percent sign. Each work package adds its own block of keys; do not touch another one's.

