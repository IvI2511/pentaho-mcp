# hints for the student (one sentence each; no values from hidden cases)
pista.load_failed=Your file could not be opened: save it again from Spoon as a .ktr (no DOCTYPE and no hand edits to the XML).
pista.blocked_step=Not allowed in this exercise: %s. Solve it with other steps.
pista.blocked_step.dangerous=Not allowed in this exercise: %s runs system commands, code or connections.
pista.blocked_step.unknown=%s uses a step type that is not installed or not known: use the standard PDI steps.
pista.blocked_step.generico=Your transformation uses a step that is not allowed in this exercise.
pista.read_outside_pack=Your transformation reads files that are not the ones in the statement (or takes the path from a field or a URL): read only the exercise data (%s).
pista.read_outside_pack.generico=Your transformation reads files that are not the ones in the statement (or takes the path from a field or a URL): read only the exercise data.
pista.unexpected_output=The output takes its file name from a field: write to a file with a fixed name.
pista.foreign_connection=You use a connection to another database: this exercise only works with the database that comes with it.
pista.forbidden_sql=Your SQL uses ATTACH DATABASE, VACUUM INTO or load_extension, which are not allowed: work only on the exercise database.
pista.rewrite_failed=Your transformation could not be prepared for grading: tell your teacher.
pista.D1=Two steps have the same name (ignoring case): Kettle merges them into one and the transformation hangs or loses rows. Give them different names.
pista.D2=There is a circular hop: the rows would go round forever. Remove the hop that goes back.
pista.timeout=It did not finish in %d s: look for a hop that goes back or a Generate rows without a limit.
pista.crashed=Grading was interrupted: try your transformation in Spoon and check the log.
pista.output_too_big=It wrote more than %d MB: a Generate rows without a limit, or a hop that goes back?
pista.too_many_rows=It produced more than %,d rows: check that you are not multiplying rows (a join without a key, a Generate rows).
pista.init_failed=A step could not start: run the transformation in Spoon and look at the first error in the log.
pista.finished_with_errors=It finished with errors: run the transformation in Spoon and see which step shows the error.
pista.no_output_step.file=There is no Text file output to take your result from: the exercise expects the output in a text file.
pista.no_output_step.step=The output step "%s" was not found: use that name for the step that leaves the result.
pista.no_output_step.query=Where you write the result was not found: it has to end up in the exercise database, with a Table output.
pista.missing_column=Column "%s" is missing: check the field list of the output step.
pista.extra_column=Your output has column "%s", which the statement does not ask for.
pista.extra_column.penalize=Column "%s" is extra: the statement does not ask for it and in this exercise it costs points.
pista.rename=Column "%s" is not there, but "%s" has the same values: did you rename it?
pista.column_order=The columns come out in a different order: put them in the order of the statement.
pista.D5=Your output repeats keys: Group by only groups consecutive rows. Put a Sort rows by the same keys before the Group by (or use Memory group by).
pista.duplicate_keys=Your output repeats keys (%s): each one should appear only once.
pista.missing_rows=Rows that should be there are missing: a filter too many, or a join that loses them?
pista.extra_rows=There are rows that should not be there: a missing filter?
pista.D3=Some numbers come out multiplied by 100: declare the decimal symbol "." when reading the file.
pista.D4=The amounts come out as if the price had been rounded: in the Calculator put the field with decimals in "Field A".
pista.D6=Merge join matches are lost or extra: sort both inputs by the join key, in the same order.
pista.values=Check how you compute "%s": it does not match in some rows.
pista.comma_decimal=Your numbers come out with a decimal comma: they are accepted this time, but declare "." as the decimal symbol in the output step.
pista.comma_decimal.strict=Your numbers come out with a decimal comma and this exercise asks for a point: declare "." as the decimal symbol in the output step.
pista.encoding=Some accented letters come out broken (Ã©, �): declare the UTF-8 encoding in the output step.

