# ---------------------------------------------------------------- 0.6.2 · messages that are translated (CorrectorTextos)
# Every grader error and detail has a key here: «detail» in the JSON is the English text of the same key, the UI
# shows it in its language. Arguments are always text (%s or %1$s): names of steps, connections and files are data.

