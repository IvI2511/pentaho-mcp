# Mensagens, motivos e notas da ferramenta MCP stress_test (Pentaho Live), argumento language=pt. As chaves e os
# códigos (verdict, status, ids das verificações) não mudam. EstresTools.java, EstresSandbox.java,
# robustez/Balance.java, robustez/Variantes.java. UTF-8.

# --- argumentos e execução (EstresTools)
unknown_variant=variante desconhecida '%s'; válidas: all, %s
not_transformation=stress_test funciona com transformações (.ktr), não com jobs
cancelled=O teste de estresse foi cancelado
timeout=O teste de estresse não terminou em %d s e foi interrompido
note_not_sandbox=Não é um sandbox de segurança: o código JavaScript/Java da própria transformação é executado na JVM filha.
not_run_dbs=a transformação usa bancos de dados que não são arquivos SQLite/H2 (%s): stress_test nunca se conecta a eles. Use export_variants e teste os arquivos quebrados manualmente, ou teste uma cópia que carregue em SQLite
not_run_blocked=alguns steps não podem ser executados no sandbox: %s
not_run_no_inputs=nenhuma entrada de arquivo que stress_test possa sujar (CSV input, Text file input, Excel input, JSON input lendo um arquivo existente)
not_run_no_pdi=não foi possível encontrar a pasta data-integration do PDI para iniciar a JVM do teste
not_run_memory=não há memória livre suficiente para iniciar a JVM do teste (precisa de cerca de 1 GB)
child_stopped=a JVM do teste foi interrompida (tempo esgotado)
child_exit=a JVM do teste terminou com o código %d: %s
run_not_finished=a execução não terminou (a JVM do teste foi interrompida ou falhou): %s
no_log=(sem log)
rerun_no_db=nenhum banco de dados de arquivo SQLite/H2 é carregado: não há nada para executar de novo
environment_reason=problema do ambiente, não uma falha de robustez: %s
next=harden_etl recipes=%s (veja o plano com dry_run=true) e depois execute stress_test de novo
missing_db=%s (conexão %s)
export_exists=%s: já existe
cannot_read=não foi possível lê-lo: %s

# --- análise estática (EstresSandbox)
blocked_missing=%s (%s): o plugin dele não está instalado
blocked_external=%s (%s): sai da máquina, executa outros processos ou outras transformações
blocked_writes_out=%s (%s): escreve ou envia dados para um lugar que stress_test não consegue redirecionar para o sandbox
blocked_sql=%s (%s): SQL sem um banco de dados de arquivo
blocked_filename_field=%s (%s): o nome do arquivo vem de um campo
db_used_by=%s (%s) usada por '%s'
input_not_selected=não está em 'inputs'
input_from_previous=pega os nomes dos arquivos de um step anterior
input_no_filename=sem nome de arquivo
input_missing_file=o arquivo não existe (%s)
input_fixed_width=arquivos de largura fixa ainda não são suportados

# --- resumo por variante (Balance.Informe.resumen)
summary_env_bad_row=abortada: uma linha ruim parou a carga (e há um problema do ambiente: %s)
summary_env=não avaliada (problema do ambiente): %s
summary_aborted=abortada após ler %d linhas (%d carregadas, %d rejeitadas antes da parada)
summary_balance=%d lidas = %d carregadas + %d rejeitadas + %d descartadas (declaradas) + %d perdidas
summary_fanout=%d lidas; %d chegaram às cargas, %d rejeitadas, %d descartadas (declaradas), %d perdidas (as linhas se dividem entre várias cargas ou são combinadas: veja aggregates)

# --- verificações (Balance.evaluar)
detail_error=erro: %s
no_abort_env_bad_row=uma linha ruim parou a carga (além do problema do ambiente: %s)
step_failed=o step '%s' (%s) falhou com %d erro(s)
step_failed_msg=o step '%s' (%s) falhou com %d erro(s): %s
env_problem=problema do ambiente: %s
env_problem_aborted=a execução abortou; problema do ambiente: %s
no_abort_timeout=a execução não terminou a tempo (timeout)
no_abort_aborted=a transformação abortou com %d erro(s): uma linha ruim parou a carga
no_abort_aborted_msg=a transformação abortou com %d erro(s): uma linha ruim parou a carga: %s
input_swallowed='%s' produziu %d linhas a partir de %d linhas de dados: a entrada engoliu %d (um delimitador aberto ou uma linha cortada unida à seguinte)
not_eval_info_shared=%s: a fonte info dele manda linhas para vários steps
not_eval_info_split=%s: não foi possível separar as linhas principais das de info
loss_partial=a execução abortou: as contagens de linhas são parciais
loss=%d linha(s) desapareceram sem um hop de erro, um ramo falso ou uma declaração
loss_step=o step '%s' (%s) perdeu %d linha(s)
loss_step_filter=o step '%s' (%s) perdeu %d linha(s): um filtro sem ramo falso descarta as linhas que não atendem à condição; mande-as para um arquivo de rejeitos com um motivo, ou declare o descarte
no_rejects_file=a transformação não tem nenhum arquivo de rejeitos
reject_no_column='%s' escreve %d linha(s) rejeitada(s) sem uma coluna de motivo (motivo/reason)
reject_empty_reason='%s': %d de %d linha(s) rejeitada(s) têm o motivo vazio
bad_rows_aborted=a execução abortou
bad_rows_none=a variante não tem linhas que devam ser rejeitadas
bad_rows_not_rejected=%d linha(s) quebrada(s) não foram rejeitadas (%d esperadas, %d rejeitadas): chegaram às saídas ou se perderam
idem_second_aborted=a segunda execução sobre o mesmo banco de dados abortou
idem_second_aborted_msg=a segunda execução sobre o mesmo banco de dados abortou: %s
idem_no_table=nenhuma tabela de banco de dados para comparar
idem_duplicates=tabela %s: %d linhas após a 1ª execução, %d após a 2ª (executar de novo duplica linhas)
idem_keys_changed=tabela %s: as mesmas linhas, mas as chaves mudaram (chaves substitutas instáveis)
idem_not_idempotent=executar a carga de novo não é idempotente

# --- problemas do ambiente (Balance.problemaDeEntorno)
env_db_files=o arquivo de banco de dados %s não existe: execute antes o job que o cria, ou aponte o teste para uma cópia preparada
env_db_files_table=o arquivo de banco de dados %s não existe (portanto a tabela %s também não): execute antes o job que o cria, ou aponte o teste para uma cópia preparada
env_db=o banco de dados %s não existe: execute antes o job que o cria, ou aponte o teste para uma cópia preparada
env_db_unnamed=o arquivo de banco de dados não existe: execute antes o job que o cria, ou aponte o teste para uma cópia preparada
env_table=o banco de dados ou a tabela %s não existe: execute antes o job que o cria, ou aponte o teste para uma cópia preparada
env_table_unnamed=o banco de dados ou a tabela que ele lê ou carrega não existe: execute antes o job que o cria, ou aponte o teste para uma cópia preparada
