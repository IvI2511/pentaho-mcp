# Section "Technical quality" (quality, SecCalidad): the linter in the report. Owner: calidad. Read as UTF-8.
# Patterns use String.format with the report locale: %s text, %d integer, %,d integer with thousands, %.1f
# decimal, %% a percent sign. Plurals: <key>.1 for one, <key>.n for the rest. Rule names and texts come from
# lint_en.properties (the same as lint_etl).

# indicators
ind.puntaje=Technical quality
ind.puntaje.valor=%d/100
ind.puntaje.detalle=Grade %s
ind.errores=Errors
ind.advertencias=Warnings
ind.sugerencias=Suggestions
ind.silenciados=Silenced
ind.silenciados.detalle=not counted
ind.robustez=Robustness

# tables
tabla.hallazgos=Findings
tabla.puntos=Where the missing points come from
tabla.no_evaluado=What could not be checked
tabla.robustez=Robustness findings
tabla.puntos_robustez=Where the missing robustness points come from
col.severidad=Severity
col.regla=Rule
col.donde=Where
col.que=What happens
col.arreglo=How to fix it
col.veces=Findings
col.puntos=Points
col.motivo=Reason
sev.error=Error
sev.warning=Warning
sev.info=Suggestion
puntos=−%d
donde.hop=Hop %s
donde.conexion=Connection %s
donde.slave=Slave server %s
donde.doc=Document
donde.doc.objeto=Document: %s
env=(Depends on this machine.)
propuesta=Proposed: “%s”.
pie.mas.1=%,d more finding in the report data (JSON).
pie.mas.n=%,d more findings in the report data (JSON).
pie.mas_no_evaluado.1=%,d more in the report data (JSON).
pie.mas_no_evaluado.n=%,d more in the report data (JSON).

# notes
nota.validacion.1=%,d finding that is already in “Validation” is not repeated here; it still costs points.
nota.validacion.n=%,d findings that are already in “Validation” are not repeated here; they still cost points.
nota.sin_profundo=Row order and the decimal symbol were judged without reading data: the deep check confirms or rules them out.
nota.formula=Technical quality = 100 − points. Each error costs %d, each warning %d and each suggestion %d; a rule costs at most %d, %d or %d depending on its worst severity, all suggestions together at most %d and, with any error, the maximum is %d. Grades: A 90-100, B 75-89, C 50-74, D below 50. It measures technical good practices: it is not a mark.
nota.tope_info=The suggestions added up to %d points: they cost %d.
nota.compuerta=There is at least one error: the score is %d at most.
nota.no_evaluado=They do not cost points.
nota.robustez=Rows that would stop the load or get lost without a trace. They have a robustness score of their own and do not change the technical quality score.
nota.formula_robustez=Robustness = 100 − points, with the same formula as technical quality, counting these rules only.
ne.deep_budget=deep check not done: the deep mode ran out of time (%,d s)

# no findings
sin_hallazgos=No findings: no rule found anything to improve.
sin_hallazgos.calidad=No technical quality findings.
todos_en_validacion=All the findings are already in “Validation”.

# warnings
aviso.error=%s: %s
aviso.mas.1=And %,d more error (in the table).
aviso.mas.n=And %,d more errors (in the table).

# deep check
profundo.hecho=Deep check: %,d reads of the sources in %.1f s, with read-only steps only. Raised to error: %,d; lowered to suggestion: %,d; unchanged: %,d; not evaluated: %,d.
profundo.no=Deep check: %s.
profundo.sin_motivo=it did not run

# summary
resumen=Score %d/100 (%s): %s.
resumen.limpio=Score %d/100 (%s): no findings.
resumen.limpio.calidad=Score %d/100 (%s): no technical quality findings.
resumen.robustez=Robustness %d/100 (%s): %s.
resumen.robustez.limpio=Robustness %d/100 (%s): no findings.
resumen.sin_errores=No errors.
resumen.peor=What costs the most: “%s” (%s).
n.error.1=%,d error
n.error.n=%,d errors
n.adv.1=%,d warning
n.adv.n=%,d warnings
n.sug.1=%,d suggestion
n.sug.n=%,d suggestions
n.punto.1=%,d point
n.punto.n=%,d points
y=and

# states
motivo.timeout=The quality check did not finish in %,d s.
motivo.parcial=Some rules were not checked: the report was cancelled or ran out of time. The score only counts what was checked.

# 0.7 · project profile (.pentaho-live/lint.yaml, E5)
perfil.con=Project profile: %s (%s): its conventions and its minimum score count in this check.
perfil.minimo.ok=Minimum %d: met.
perfil.minimo.ko=Minimum %d: NOT met.
perfil.error=A project profile was found but could not be read (%s): checked with the default rules.
