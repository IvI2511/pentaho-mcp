# Mensajes, motivos y notas de la herramienta MCP stress_test (Pentaho Live), argumento language=es. Las claves y
# los códigos (verdict, status, ids de las comprobaciones) no cambian. EstresTools.java, EstresSandbox.java,
# robustez/Balance.java, robustez/Variantes.java. UTF-8.

# --- argumentos y corrida (EstresTools)
unknown_variant=variante desconocida '%s'; válidas: all, %s
not_transformation=stress_test funciona con transformaciones (.ktr), no con jobs
cancelled=Se canceló la prueba de estrés
timeout=La prueba de estrés no terminó en %d s y se detuvo
note_not_sandbox=No es un sandbox de seguridad: el código JavaScript/Java propio de la transformación se ejecuta en la JVM hija.
not_run_dbs=la transformación usa bases de datos que no son archivos SQLite/H2 (%s): stress_test nunca se conecta a ellas. Usa export_variants y prueba a mano los archivos rotos, o prueba una copia que cargue en SQLite
not_run_blocked=algunos steps no pueden ejecutarse en el sandbox: %s
not_run_no_inputs=no hay ninguna entrada de archivo que stress_test pueda ensuciar (CSV input, Text file input, Excel input, JSON input que lea un archivo existente)
not_run_no_pdi=no se encuentra la carpeta data-integration de PDI para arrancar la JVM de la prueba
not_run_memory=no hay memoria libre suficiente para arrancar la JVM de la prueba (necesita alrededor de 1 GB)
child_stopped=se detuvo la JVM de la prueba (se agotó el tiempo)
child_exit=la JVM de la prueba terminó con el código %d: %s
run_not_finished=la corrida no terminó (la JVM de la prueba se detuvo o falló): %s
no_log=(sin log)
rerun_no_db=no se carga ninguna base de datos de archivo SQLite/H2: no hay nada que volver a ejecutar
environment_reason=problema del entorno, no un fallo de robustez: %s
next=harden_etl recipes=%s (mira el plan con dry_run=true) y después vuelve a ejecutar stress_test
missing_db=%s (conexión %s)
export_exists=%s: ya existe
cannot_read=no se puede leer: %s

# --- análisis estático (EstresSandbox)
blocked_missing=%s (%s): su plugin no está instalado
blocked_external=%s (%s): sale de la máquina, ejecuta otros procesos u otras transformaciones
blocked_writes_out=%s (%s): escribe o envía datos a un sitio que stress_test no puede redirigir al sandbox
blocked_sql=%s (%s): SQL sin una base de datos de archivo
blocked_filename_field=%s (%s): el nombre de su archivo viene de un campo
db_used_by=%s (%s) usada por '%s'
input_not_selected=no está en 'inputs'
input_from_previous=toma los nombres de sus archivos de un step anterior
input_no_filename=sin nombre de archivo
input_missing_file=el archivo no existe (%s)
input_fixed_width=los archivos de ancho fijo todavía no se admiten

# --- resumen por variante (Balance.Informe.resumen)
summary_env_bad_row=abortada: una fila mala detuvo la carga (y hay un problema del entorno: %s)
summary_env=sin evaluar (problema del entorno): %s
summary_aborted=abortada tras leer %d filas (%d cargadas, %d rechazadas antes de la parada)
summary_balance=%d leídas = %d cargadas + %d rechazadas + %d descartadas (declaradas) + %d perdidas
summary_fanout=%d leídas; %d llegaron a las cargas, %d rechazadas, %d descartadas (declaradas), %d perdidas (las filas se reparten entre varias cargas o se combinan: mira aggregates)

# --- comprobaciones (Balance.evaluar)
detail_error=error: %s
no_abort_env_bad_row=una fila mala detuvo la carga (además del problema del entorno: %s)
step_failed=el step '%s' (%s) falló con %d error(es)
step_failed_msg=el step '%s' (%s) falló con %d error(es): %s
env_problem=problema del entorno: %s
env_problem_aborted=la corrida abortó; problema del entorno: %s
no_abort_timeout=la corrida no terminó a tiempo (timeout)
no_abort_aborted=la transformación abortó con %d error(es): una fila mala detuvo la carga
no_abort_aborted_msg=la transformación abortó con %d error(es): una fila mala detuvo la carga: %s
input_swallowed='%s' produjo %d filas de %d líneas de datos: la entrada se tragó %d (un encierro sin cerrar o una línea cortada unida a la siguiente)
not_eval_info_shared=%s: su fuente info manda filas a varios steps
not_eval_info_split=%s: no se pudieron separar sus filas principales de las de info
loss_partial=la corrida abortó: las cuentas de filas son parciales
loss=%d fila(s) desaparecieron sin un hop de error, una rama falsa o una declaración
loss_step=el step '%s' (%s) perdió %d fila(s)
loss_step_filter=el step '%s' (%s) perdió %d fila(s): un filtro sin rama falsa descarta las filas que no cumplen; mándalas a un archivo de rechazos con un motivo, o declara el descarte
no_rejects_file=la transformación no tiene ningún archivo de rechazos
reject_no_column='%s' escribe %d fila(s) rechazada(s) sin una columna de motivo (motivo/reason)
reject_empty_reason='%s': %d de %d fila(s) rechazada(s) tienen el motivo vacío
bad_rows_aborted=la corrida abortó
bad_rows_none=la variante no tiene filas que deban rechazarse
bad_rows_not_rejected=%d fila(s) rota(s) no se rechazaron (%d esperadas, %d rechazadas): llegaron a las salidas o se perdieron
idem_second_aborted=la segunda corrida sobre la misma base de datos abortó
idem_second_aborted_msg=la segunda corrida sobre la misma base de datos abortó: %s
idem_no_table=no hay ninguna tabla de base de datos que comparar
idem_duplicates=tabla %s: %d filas tras la 1.ª corrida, %d tras la 2.ª (volver a ejecutar duplica filas)
idem_keys_changed=tabla %s: las mismas filas, pero cambiaron las claves (claves subrogadas inestables)
idem_not_idempotent=volver a ejecutar la carga no es idempotente

# --- problemas del entorno (Balance.problemaDeEntorno)
env_db_files=el archivo de base de datos %s no existe: ejecuta antes el job que lo crea, o apunta la prueba a una copia preparada
env_db_files_table=el archivo de base de datos %s no existe (así que tampoco la tabla %s): ejecuta antes el job que lo crea, o apunta la prueba a una copia preparada
env_db=la base de datos %s no existe: ejecuta antes el job que la crea, o apunta la prueba a una copia preparada
env_db_unnamed=el archivo de base de datos no existe: ejecuta antes el job que lo crea, o apunta la prueba a una copia preparada
env_table=la base de datos o la tabla %s no existe: ejecuta antes el job que la crea, o apunta la prueba a una copia preparada
env_table_unnamed=la base de datos o la tabla que lee o carga no existe: ejecuta antes el job que la crea, o apunta la prueba a una copia preparada
