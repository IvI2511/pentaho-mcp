# Ambiente de desenvolvimento (exemplo compartilhado; sem segredos).
# Passe-o ao Pan/Kitchen ou defina-o no Spoon (Editar > Configurar ambiente). Os seus valores reais
# e as senhas vão em env/local.properties, que o .gitignore deixa fora do repositório.
# Caminho absoluto da pasta datasets/ da sua cópia do projeto (um relativo seria resolvido contra a pasta do PDI)
DIR_DATOS=/caminho/para/sua/copia/datasets
DIR_SALIDA=/caminho/para/sua/copia/salida
DB_HOST=localhost
DB_PORT=5432
DB_NAME=dev
DB_USER=etl
# DB_PASSWORD vai em env/local.properties, nunca aqui
