# ---- revisión (plan_review): .msg, .fix y .ask (la pregunta para el usuario)
rev.vacia=La revisión no encuentra nada que corregir.
rev.resumen=%d errores, %d avisos y %d sugerencias.
rev.pregunta=Pregunta: %s
rev.no_goal.msg=El plano no tiene objetivo.
rev.no_goal.fix=Escribe en una frase qué tiene que conseguir el ETL y para quién.
rev.no_goal.ask=¿Para qué es este ETL: qué informe, indicador o sistema se alimenta con él?
rev.no_grain.msg=Falta el grano: no se sabe qué representa una fila del destino.
rev.no_grain.fix=Define el grano (por ejemplo, «una fila por línea de ticket válida»): de él salen la clave, los duplicados y las agregaciones.
rev.no_grain.ask=¿Qué representa exactamente una fila de la tabla de hechos?
rev.no_sources.msg=El plano no tiene fuentes.
rev.no_sources.fix=Añade cada fuente con su formato, volumen y frecuencia.
rev.no_targets.msg=El plano no tiene destinos.
rev.no_targets.fix=Añade cada tabla o archivo de salida con su clave y su tipo de carga.
rev.no_stages.msg=El plano no tiene etapas: plan_build no tiene nada que construir.
rev.no_stages.fix=Parte el trabajo en etapas (extraer → limpiar → buscar claves → cargar).
rev.load_strategy_missing.msg=No dice si la carga es completa o incremental.
rev.load_strategy_missing.fix=Pon load: full o incremental (y en incremental, incremental_by).
rev.load_strategy_missing.ask=¿Cada vez llega todo el histórico o solo lo nuevo desde la última carga?
rev.incremental_without_watermark.msg=La carga es incremental pero no dice cómo se sabe qué es nuevo.
rev.incremental_without_watermark.fix=Pon incremental_by: el campo de fecha o de secuencia que marca hasta dónde se cargó.
rev.incremental_without_watermark.ask=¿Qué campo dice qué filas son nuevas (fecha de alta, id creciente…)?
rev.source_without_format.msg=La fuente «%s» no dice su formato.
rev.source_without_format.fix=Pon format: csv, excel, json, table…
rev.source_without_volume.msg=La fuente «%s» no dice su volumen o su frecuencia.
rev.source_without_volume.fix=Pon volume y frequency: deciden si hace falta carga incremental, ordenar en memoria o particionar.
rev.source_without_volume.ask=¿Cuántas filas trae «%s» y cada cuánto llega?
rev.source_without_rejects.msg=La fuente «%s» no tiene plan de rechazos: una fila mala pararía la carga o se perdería sin rastro.
rev.source_without_rejects.fix=Pon rejects (el archivo de rechazos con su motivo) o una etapa de tipo reject después de la que la lee.
rev.source_without_rejects.ask=¿Qué hacemos con las filas de «%s» que no pasan la validación: se apartan a un archivo con el motivo o se para la carga?
rev.source_not_read.msg=Ninguna etapa lee la fuente «%s».
rev.source_not_read.fix=Ponla en reads de la etapa que la extrae, o quítala del plano.
rev.target_not_written.msg=Ninguna etapa escribe el destino «%s».
rev.target_not_written.fix=Ponlo en writes de la etapa que lo carga, o quítalo del plano.
rev.non_idempotent_load.msg=La carga de «%s» (%s) no es idempotente: si se repite, duplica filas.
rev.non_idempotent_load.fix=Usa truncate_insert, upsert con clave o scd1/scd2, o borra antes el periodo que se vuelve a cargar.
rev.non_idempotent_load.ask=Si la carga falla a medias y se relanza, ¿qué debe pasar con las filas de «%s» que ya se escribieron?
rev.upsert_without_key.msg=«%s» se carga con %s pero no tiene clave.
rev.upsert_without_key.fix=Pon key: los campos que identifican una fila (la clave de negocio).
rev.dimension_without_history.msg=La dimensión «%s» no dice si guarda historia.
rev.dimension_without_history.fix=Pon load: scd1 (sobrescribe), scd2 (guarda historia) o truncate_insert.
rev.dimension_without_history.ask=Si cambia un dato de «%s» (por ejemplo, la categoría de un producto), ¿hay que guardar cómo era antes o basta con el valor actual?
rev.lookup_without_key.msg=La búsqueda de «%s» no tiene clave.
rev.lookup_without_key.fix=Pon key: los campos por los que se busca.
rev.lookup_without_on_missing.msg=«%s» no dice qué hacer si no encuentra la clave (los huérfanos).
rev.lookup_without_on_missing.fix=Pon on_missing: reject, default, unknown_member o fail.
rev.lookup_without_on_missing.ask=En «%s», ¿qué hacemos con una fila cuyo cliente, producto o tienda no existe: se rechaza, se asigna a un miembro «desconocido» o se para la carga?
rev.orphans_rejected_nowhere.msg=«%s» rechaza los huérfanos, pero ninguna etapa de rechazos viene después.
rev.orphans_rejected_nowhere.fix=Añade una etapa de tipo reject con after: esta etapa (el archivo o la tabla de rechazos con su motivo).
rev.dedupe_without_key.msg=«%s» quita duplicados sin decir por qué campos.
rev.dedupe_without_key.fix=Pon key en la etapa (o en la fuente que lee).
rev.dedupe_without_key.ask=¿Cuándo dos filas son la misma: qué campos tienen que coincidir?
rev.stage_without_input.msg=La etapa «%s» no recibe filas: no tiene after, reads ni lookup.
rev.stage_without_input.fix=Di de qué etapa viene (after) o qué fuente lee (reads).
rev.stage_dead_end.msg=Las filas de «%s» no van a ningún sitio: no la sigue ninguna etapa y no escribe ningún destino.
rev.stage_dead_end.fix=Conéctala a la etapa siguiente o di qué destino escribe.
rev.rule_unused.msg=Ninguna etapa aplica la regla %s («%s»).
rev.rule_unused.fix=Ponla en rules de la etapa que la cumple.
rev.no_orchestration.msg=El plano tiene %d transformaciones y no dice en qué orden corren.
rev.no_orchestration.fix=Añade orchestration con name (el job), order y on_failure.
rev.no_orchestration.ask=¿En qué orden se cargan (primero las dimensiones, después los hechos) y qué pasa si una falla?
rev.orchestration_without_failure_path.msg=La orquestación no dice qué hacer si una transformación falla.
rev.orchestration_without_failure_path.fix=Pon on_failure: abort, continue o notify.
rev.orchestration_without_failure_path.ask=Si una transformación falla, ¿se aborta toda la carga, se sigue con la siguiente o se avisa a alguien?
rev.risk_without_mitigation.msg=El riesgo «%s» no tiene mitigación.
rev.risk_without_mitigation.fix=Di qué etapa o regla lo controla.
rev.decision_without_why.msg=La decisión «%s» no explica por qué.
rev.decision_without_why.fix=Anota el motivo: dentro de unos meses nadie se acordará.

