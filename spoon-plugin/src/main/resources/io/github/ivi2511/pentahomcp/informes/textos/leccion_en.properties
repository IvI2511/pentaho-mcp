finish=Finish
finish_tooltip=Ends the lesson; the notes stay on the canvas
finish_confirm_title=Finish the lesson
finish_confirm=The lesson ends here and cannot be resumed. The notes stay on the canvas (lesson_notes hide or remove cleans them up). Finish?
font_smaller=A-
font_larger=A+
font_tooltip=Text size of this tab (for a projector)
state_ready=ready
state_waiting_next=waiting for Next
state_playing=playing…
state_paused=paused
state_out_of_sync=out of sync
state_done=done
state_stopped=stopped
reason_panel_hidden=results panel hidden
reason_document_closed=document closed
reason_user_undo=Ctrl+Z in Spoon
reason_user_redo=redo in Spoon
reason_error=error
