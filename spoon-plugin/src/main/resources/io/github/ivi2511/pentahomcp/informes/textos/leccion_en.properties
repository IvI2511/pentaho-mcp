# Lesson tab of the class mode (Pentaho Live): results panel of a transformation.
# LeccionPanel.java (modo clase, WP4). UTF-8.
tab=Lesson
header=%s · %s · step %d of %d
level_beginner=beginner
level_intermediate=intermediate
steps=Steps
now=Now
rows=Rows
rows_of=Rows of «%s» (%d)
no_rows=(no preview rows for this step)
intro_label=Introduction
outro_label=To finish
upcoming=Next: %d · %s
next=Next ▶
next_tooltip=Plays the next step of the lesson (each step is one Ctrl+Z in Spoon)
next_manual=Manual pace: the lesson advances with lesson_next from the chat
back=◀ Back
