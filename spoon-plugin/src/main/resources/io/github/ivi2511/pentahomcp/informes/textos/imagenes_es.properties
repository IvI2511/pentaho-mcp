# Textos de la exportación de imágenes (RenderImagenes). Dueño: WP10. Se lee en UTF-8 (Rotulos).
# Formatos con String.format(locale, ...): %s, %d; un % literal va como %%.
# lienzo, diagrama, grafico e imagen van en los nombres de archivo (sin acentos ni espacios).
progreso=Imágenes: %s
lienzo=lienzo
diagrama=diagrama
grafico=grafico
imagen=imagen
aviso_sin_dibujo=%d diagrama(s) o gráfico(s) no se exportaron: no había navegador para dibujarlos o falló su imagen.
aviso_solo_svg=%d gráfico(s) van solo en SVG: no se pudo generar el PNG.
aviso_vacia=El informe no tiene diagramas, gráficos ni imágenes: no se escribió ningún archivo.
