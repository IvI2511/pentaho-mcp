# Corretor de exercícios (docs/corrector-diseno.md): área “corrector” de Rotulos. Lido em UTF-8.
# Os padrões usam String.format com o locale do idioma: %s texto, %d inteiro, %,d inteiro com milhares, %.2f
# decimal, %% um sinal de porcentagem. Cada pacote de trabalho acrescenta seu bloco de chaves; não mexer nas de outro.

