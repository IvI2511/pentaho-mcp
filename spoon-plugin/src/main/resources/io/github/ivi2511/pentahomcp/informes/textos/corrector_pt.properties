pista.forbidden_sql.server=Seu SQL faz algo que não é permitido neste exercício (outra base, arquivos do servidor, usuários ou permissões): trabalhe só com as tabelas do exercício.
pista.no_output_step.tables=Seu resultado não foi encontrado na base do exercício: carregue as tabelas com Table output, Insert/Update ou um Dimension lookup.
aviso.missing_table=Não foi possível ler uma tabela do resultado na base de teste.

# validar um pack (formato 2)
pack.format_too_old=Este pack usa bases de teste ou a captura «tables», que precisam do formato %2$s (diz %1$s).
pack.unsafe_test_database=Não é possível usar uma base de teste.
pack.unknown_test_db=«%s» não é uma conexão de test_databases.
pack.password_in_pack=Uma base de teste traz a senha: ela nunca vai no pack. Remova-a e use password_variable (uma variável do Kettle do computador que corrige).
pack.no_tables=A captura «tables» não tem tabelas em output.tables.
pack.duplicate_table=A tabela «%s» está repetida.
pack.missing_expected_table=%s não tem %s.
pack.bad_value.range=%s não é válido: tem que estar entre %s e %s.
pack.bad_value.ignored_key=«%s» é uma coluna chave e também está em ignore_columns.
pack.ignored_field.tables=output.tables só é usado com a captura «tables» (este pack usa «%s»): é ignorado.

