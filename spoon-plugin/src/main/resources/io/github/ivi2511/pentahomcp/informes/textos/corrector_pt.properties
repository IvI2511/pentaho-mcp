ui.as_resumen_ninguna=nenhuma
ui.as_resumen_casos=Casos
ui.as_resumen_visible=Visível: a sua solução dá %s linhas
ui.as_resumen_oculto=Oculto: o aluno não vê os seus valores
ui.as_resumen_dos_veces=Cada entrega é executada duas vezes
ui.as_resumen_base=Base de teste
ui.as_resumen_base_valor=«%s» → %s (%s) · scripts: %s
ui.as_resumen_sin_scripts=nenhum
ui.as_resumen_nota=Nota
ui.as_resumen_nota_valor=%s pontos, sobre %s: %s
ui.as_resumen_alumnos=Os alunos recebem
ui.as_resumen_alumnos_valor=%s: o enunciado e os dados do caso visível, sem a sua solução nem o caso oculto
ui.as_resumen_sin_copia=Nada (não se prepara a cópia para alunos)
ui.as_resumen_guardar=Ao salvar, a sua solução é executada de novo (também com o outro formato de números) para verificar que tira a nota máxima.
ui.as_guardado_corto=Pronto. Clique em «Usar este pacote» para corrigir com ele.
ui.as_revisa=Revise o que está marcado a vermelho.
ui.as_fallo_corto=Não foi possível: o motivo está no quadro vermelho.

