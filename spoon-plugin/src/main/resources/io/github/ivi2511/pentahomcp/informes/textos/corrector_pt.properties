ui.as_cabecera=Criar um pacote de correção
ui.as_paso5=Revisar e salvar
ui.as_paso_bloqueado=Primeiro é preciso executar a sua solução: clique em «Seguinte» em «Dados de teste».
ui.as_izq_ayuda=Pode voltar a um passo já feito clicando nele. Nada é salvo até clicar em «Salvar pacote».
ui.as_intro1=Um pacote é o que o corretor usa para pontuar as entregas: a sua solução, os dados com que é executada e o que se compara. Quase tudo já vem preenchido: revise e clique em «Seguinte».
ui.as_intro2=Com que dados são executadas a sua solução e a de cada aluno. «Seguinte» executa a sua solução num processo à parte para ver o que produz (leva alguns segundos).
ui.as_intro3=Isto é o que a sua solução produziu com os dados do caso visível. O corretor compara o resultado de cada aluno com isto: marque que colunas identificam cada linha e quais não comparar.
ui.as_intro4=A nota é a soma dos pontos de cada critério, levada à escala. As regras de desenho verificam como a transformação está feita e são opcionais.
ui.as_intro5=Revise o resumo e clique em «Salvar pacote».
ui.as_solucion=Solução
ui.as_solucion_info=%s · %s passos · %s
ui.as_solucion_info_bd=%s · %s passos · %s\nUsa base de dados: %s
ui.as_titulo_ayuda=Os seus alunos veem-no no relatório. Exemplo: «Exercício 2 · Carga do data warehouse».
ui.as_captura_ayuda=O corretor executa a entrega de cada aluno e compara este resultado com o da sua solução. Se a sua solução carrega tabelas numa base de dados, o normal é comparar essas tabelas.
ui.as_destino_ayuda=Uma pasta nova (ou vazia) ou um arquivo .zip. Exemplo: C:\\Aulas\\pacote-exercicio-2
ui.as_destino_lleno=Essa pasta já tem arquivos e não é um pacote: escolha uma pasta nova ou vazia, ou um .zip.
ui.as_destino_pack=Já existe um pacote aí: ao salvar será substituído.
ui.as_idioma_ayuda=O idioma das devolutivas aos alunos e do enunciado.
ui.as_copia_ayuda=Um .zip com o enunciado e os dados do caso visível, sem a sua solução nem o caso oculto, para distribuir.
ui.as_visible_archivos=Caso visível: os arquivos que a sua solução lê são copiados para o pacote ao executá-la. O aluno vê os seus valores na devolutiva.
ui.as_oculto_ayuda=Opcional. Outra pasta com arquivos de entrada com os mesmos nomes mas outros dados: corrige-se igual, mas o aluno não vê os seus valores (assim não pode ajustar a solução aos dados). Exemplo: C:\\Aulas\\exercicio-2\\oculto
ui.as_base_por_que=A sua solução lê e escreve numa base de dados. Para corrigir sem tocar nas suas bases, cada entrega é executada numa cópia descartável (a base de teste) que é apagada e criada de novo com os seus scripts antes de cada execução.
ui.as_base_clave_ayuda=A desse usuário nesse servidor. Fica em memória até fechar o Spoon: nunca é salva no pacote nem em nenhum arquivo. Deixe-a vazia se não tiver.
ui.as_base_nombre_ayuda=É apagada e criada de novo em cada execução: nunca uma com dados que queira conservar. Tem de terminar em _correccion ou _test. Exemplo: gym_dw_correccion
ui.as_base_probar=Testar conexão
ui.as_base_probando=Testando: crio e apago a base de teste…
ui.as_base_probado_ok=✓ Conexão correta: foi possível criar e apagar «%s».
ui.as_base_probado_mal=Não foi possível: %s
ui.as_base_scripts_ayuda=Arquivos .sql que criam as tabelas e carregam os dados iniciais, separados por «;»; correm nesta ordem na base de teste vazia. Exemplo: criar_gym.sql; dados_gym.sql
ui.as_base_detectados=Encontrados junto à sua solução e já preenchidos: %s
ui.as_base_sin_detectados=Não encontrei scripts .sql junto à sua solução. Escolha os seus com «…» ou gere um a partir da sua base.
ui.as_base_sin_scripts=Sem scripts a base de teste fica vazia: a sua solução não encontrará as tabelas.
ui.as_base_generar=Gerar o script a partir da base atual…
ui.as_base_generar_ayuda=Lê a sua base «%s» sem a modificar (só consultas) e escreve um script com as tabelas e os dados para revisar. As tabelas que a sua solução carrega ficam vazias. Usa a senha de cima.
ui.as_base_generando=Lendo «%s» (só leitura)…
ui.as_base_generado=Script gerado: %s (%s tabelas, %s linhas). Já está em «Scripts»: abra-o e revise-o antes de salvar.
ui.as_base_generado_vacias=Sem dados (a sua solução carrega-as): %s.
ui.as_base_generado_cortadas=Só as primeiras %s linhas de: %s.
ui.as_base_generar_mal=Não foi possível gerar o script: %s
ui.as_guardar_script=Onde salvar o script gerado
ui.as_base_oculto_ayuda=Opcional: scripts com outros dados para um caso que o aluno não vê; correm depois dos de cima. Exemplo: dados_oculto.sql
ui.as_dos_veces_ayuda=Deteta uma carga que duplica linhas ao repeti-la: entre as duas execuções a base de teste não é recriada, por isso um Insert/Update deixa as mesmas tabelas e um Table output duplica-as.
ui.as_puerto_mal=A porta tem de ser um número: %s
ui.as_entradas_bd=Dados de entrada: os scripts da base de teste.
ui.as_salida_ayuda=O passo cujo resultado se compara. «(o detetado)» é o último passo da sua solução. Se o mudar, clique em «Executar de novo».
ui.as_reanalizar_pendiente=Mudou o passo: clique em «Executar de novo» para ver o resultado.
ui.as_tabla_vista_ayuda=Escolha uma tabela para ver o que a sua solução carregou e marcar as colunas.
ui.as_tabla_comparar=Comparar esta tabela
ui.as_tabla_ninguna=Escolha pelo menos uma tabela para comparar.
ui.as_columnas_titulo=Colunas
ui.as_claves_ayuda=«Identifica a linha»: as colunas que distinguem uma linha de outra (como id_cliente); o corretor emparelha as linhas do aluno com as suas por elas (sem nenhuma, comparam-se em ordem). «Não comparar»: as que mudam em cada execução, como ids autonuméricos ou datas de carga.
ui.as_col_columna=Coluna
ui.as_col_tipo=Tipo
ui.as_col_clave=Identifica a linha
ui.as_col_ignorar=Não comparar
ui.as_resultado_titulo=Resultado da execução
ui.as_desc.runs=A entrega é executada até ao fim sem erros.
ui.as_desc.columns=Tem as mesmas colunas que a sua solução.
ui.as_desc.row_count=Produz a mesma quantidade de linhas.
ui.as_desc.values=Os valores coincidem com os da sua solução (com tolerância nos números).
ui.as_reglas_titulo=Regras de desenho (opcionais)
ui.as_escala_ayuda=A nota máxima. Exemplo: 10
ui.as_escala_mal=Escreva um número maior que 0.
ui.as_puntos_mal=Escreva um número (0 ou mais).
