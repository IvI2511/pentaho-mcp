# dicas para o aluno (uma frase cada; sem valores dos casos ocultos)
pista.load_failed=Não foi possível abrir seu arquivo: salve-o de novo pelo Spoon como .ktr (sem DOCTYPE nem mudanças à mão no XML).
pista.blocked_step=Não é permitido neste exercício: %s. Resolva com outros steps.
pista.blocked_step.dangerous=Não é permitido neste exercício: %s executa comandos, código ou conexões do sistema.
pista.blocked_step.unknown=%s usa um tipo de step que não está instalado ou não é conhecido: use os steps padrão do PDI.
pista.blocked_step.generico=Sua transformação usa um step que não é permitido neste exercício.
pista.read_outside_pack=Sua transformação lê arquivos que não são os do enunciado (ou pega o caminho de um campo ou de uma URL): leia só os dados do exercício (%s).
pista.read_outside_pack.generico=Sua transformação lê arquivos que não são os do enunciado (ou pega o caminho de um campo ou de uma URL): leia só os dados do exercício.
pista.unexpected_output=A saída pega o nome do arquivo de um campo: escreva em um arquivo com nome fixo.
pista.foreign_connection=Você usa uma conexão com outro banco de dados: este exercício trabalha só com o banco que vem com ele.
pista.forbidden_sql=Seu SQL usa ATTACH DATABASE, VACUUM INTO ou load_extension, que não são permitidos: trabalhe só sobre o banco do exercício.
pista.rewrite_failed=Não foi possível preparar sua transformação para corrigi-la: avise o professor.
pista.D1=Dois steps têm o mesmo nome (sem diferenciar maiúsculas): o Kettle os junta em um só e a transformação trava ou perde linhas. Dê nomes diferentes a eles.
pista.D2=Há um hop circular: as linhas dariam voltas para sempre. Tire o hop que volta para trás.
pista.timeout=Não terminou em %d s: procure um hop que volte para trás ou um Generate rows sem limite.
pista.crashed=A correção foi interrompida: teste sua transformação no Spoon e veja o log.
pista.output_too_big=Escreveu mais de %d MB: um Generate rows sem limite ou um hop que volta para trás?
pista.too_many_rows=Gerou mais de %,d linhas: verifique se não está multiplicando linhas (um cruzamento sem chave, um Generate rows).
pista.init_failed=Algum step não conseguiu começar: execute a transformação no Spoon e veja o primeiro erro do log.
pista.finished_with_errors=Terminou com erros: execute a transformação no Spoon e veja qual step marca o erro.
pista.no_output_step.file=Não há um Text file output de onde pegar seu resultado: o exercício espera a saída em um arquivo de texto.
pista.no_output_step.step=O step de saída “%s” não foi encontrado: use esse nome no step que deixa o resultado.
pista.no_output_step.query=Não foi encontrado onde você escreve o resultado: ele tem que ficar no banco do exercício, com um Table output.
pista.missing_column=Falta a coluna “%s”: revise a lista de campos do step de saída.
pista.extra_column=Sua saída tem a coluna “%s”, que o enunciado não pede.
pista.extra_column.penalize=Sobra a coluna “%s”: o enunciado não a pede e neste exercício ela tira pontos.
pista.rename=A coluna “%s” não está, mas “%s” tem os mesmos valores: você a renomeou?
pista.column_order=As colunas saem em outra ordem: coloque-as na ordem do enunciado.
pista.D5=Sua saída repete chaves: o Group by agrupa só linhas consecutivas. Coloque um Sort rows pelas mesmas chaves antes do Group by (ou use Memory group by).
pista.duplicate_keys=Sua saída repete chaves (%s): cada uma deveria sair uma só vez.
pista.missing_rows=Faltam linhas que deveriam estar: um filtro a mais ou um cruzamento que as perde?
pista.extra_rows=Sobram linhas que não deveriam estar: falta um filtro?
pista.D3=Alguns números saem multiplicados por 100: declare o símbolo decimal “.” ao ler o arquivo.
pista.D4=Os valores saem como se o preço tivesse sido arredondado: no Calculator coloque o campo com decimais em “Campo A”.
pista.D6=Cruzamentos do Merge join se perdem ou sobram: ordene as duas entradas pela chave do join, na mesma ordem.
pista.values=Revise como você calcula “%s”: não coincide em algumas linhas.
pista.comma_decimal=Seus números saem com vírgula decimal: desta vez são aceitos, mas declare “.” como símbolo decimal no step de saída.
pista.comma_decimal.strict=Seus números saem com vírgula decimal e este exercício pede ponto: declare “.” como símbolo decimal no step de saída.
pista.encoding=Algumas letras acentuadas saem quebradas (Ã©, �): declare o encoding UTF-8 no step de saída.

