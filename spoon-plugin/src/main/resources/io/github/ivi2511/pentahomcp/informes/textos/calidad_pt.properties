nota.formula=Qualidade técnica = 100 − pontos. Cada erro desconta %d, cada aviso %d e cada sugestão %d; uma regra desconta no máximo %d, %d ou %d conforme sua pior severidade, as sugestões juntas no máximo %d e, com algum erro, o máximo é %d. Faixas: A 90-100, B 75-89, C 50-74, D abaixo de 50. Mede boas práticas técnicas: não é uma nota.
