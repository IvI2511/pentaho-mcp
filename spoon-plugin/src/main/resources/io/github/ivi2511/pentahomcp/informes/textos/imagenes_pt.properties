# Textos da exportação de imagens (RenderImagenes). Dono: WP10. Lido em UTF-8 (Rotulos).
# Formatos com String.format(locale, ...): %s, %d; um % literal vai como %%.
# lienzo, diagrama, grafico e imagen vão nos nomes de arquivo (sem acentos nem espaços).
progreso=Imagens: %s
lienzo=tela
diagrama=diagrama
grafico=grafico
imagen=imagem
aviso_sin_dibujo=%d diagrama(s) ou gráfico(s) não foram exportados: não havia navegador para desenhá-los ou a imagem falhou.
aviso_solo_svg=%d gráfico(s) vão só em SVG: não foi possível gerar o PNG.
aviso_vacia=O relatório não tem diagramas, gráficos nem imagens: nenhum arquivo foi escrito.
