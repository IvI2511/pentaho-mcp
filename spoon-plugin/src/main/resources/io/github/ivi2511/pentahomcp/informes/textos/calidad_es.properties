# Sección «Calidad técnica» (quality, SecCalidad): el linter en el informe. Dueño: calidad. Se lee en UTF-8.
# Los patrones usan String.format con el locale del informe: %s texto, %d entero, %,d entero con miles, %.1f
# decimal, %% un porciento. Plurales: <clave>.1 para uno, <clave>.n para el resto. Los nombres y textos de las
# reglas salen de lint_es.properties (los mismos que lint_etl).

