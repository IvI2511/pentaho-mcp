# notas
nota.validacion.1=%,d hallazgo que ya está en «Validación» no se repite aquí; sí resta puntos.
nota.validacion.n=%,d hallazgos que ya están en «Validación» no se repiten aquí; sí restan puntos.
nota.sin_profundo=El orden de las filas y el símbolo decimal se juzgaron sin leer datos: la revisión profunda los confirma o los descarta.
nota.formula=Calidad técnica = 100 − puntos. Cada error resta %d, cada advertencia %d y cada sugerencia %d; una regla resta como mucho %d, %d o %d según su peor severidad, las sugerencias juntas como mucho %d y, con algún error, el máximo es %d. Bandas: A 90-100, B 75-89, C 50-74, D menos de 50. Mide buenas prácticas técnicas: no es una nota.
nota.tope_info=Las sugerencias sumaban %d puntos: restan %d.
nota.compuerta=Hay al menos un error: el puntaje queda en %d como mucho.
nota.no_evaluado=No restan puntos.
nota.robustez=Filas que pararían la carga o se perderían sin dejar rastro. Tienen su propio puntaje de robustez y no cambian el de calidad técnica.
nota.formula_robustez=Robustez = 100 − puntos, con la misma fórmula que la calidad técnica, contando solo estas reglas.
ne.deep_budget=revisión profunda no hecha: el modo profundo se quedó sin tiempo (%,d s)

# sin hallazgos
sin_hallazgos=Sin hallazgos: ninguna regla encontró algo que mejorar.
