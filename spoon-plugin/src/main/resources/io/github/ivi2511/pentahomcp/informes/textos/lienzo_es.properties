# Boton Ordenar lienzo (Pentaho Live): barra del lienzo de transformaciones y jobs y su menu contextual.
# OrdenarLienzo.java. UTF-8.
arrange_action=Ordenar lienzo (Pentaho Live)
arrange_tooltip=Ordena el lienzo de izquierda a derecha siguiendo los saltos (cada nivel en una columna, el flujo principal en carriles rectos, sin saltos por encima de otros pasos). Las notas se mueven junto a sus pasos para que ninguna quede tapada. Se deshace con Ctrl+Z.
