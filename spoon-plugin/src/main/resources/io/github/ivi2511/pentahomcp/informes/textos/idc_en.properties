howto_cycle=1. Find the hop that closes the circle (the one reported starts at '%s').%n2. Right click it > Delete hop (or disable it).%n3. If you really need to send rows back, use a step that does it properly (an Append or a mapping), not a circular hop.
howto_duplicate_step_name=1. Close the transformation without saving if Spoon opened it with one step less.%n2. Open the .ktr in a text editor and find the two <step> with <name>%s</name>.%n3. Rename one of them (and its <from>/<to> in <order>), save and open it again in Spoon.
howto_missing_plugin=1. See the type of step '%s' in the message.%n2. Install that plugin into PDI's plugins folder (or from the Marketplace) and restart Spoon.%n3. If you will not use it, replace it with an equivalent step you do have.
howto_broken_hop=1. The hop '%s' points to a step that does not exist.%n2. Right click it and delete it.%n3. Draw the hop again between steps that do exist.
howto_kettle_check=1. Read Kettle's message (it is Spoon's verification: Action > Verify).%n2. If it is about a connection, test it (right click the connection > Test).%n3. Fix step '%s' as it says.
howto_job_without_start=1. Drag a START entry from General onto the job canvas.%n2. Draw a hop from START to the first entry that must run.%n3. Save and validate the job.
howto_unreachable_entry=1. Entry '%s' cannot be reached from START.%n2. Connect it with a hop from the entry that goes before, or enable the disabled hop that leads to it.%n3. If it is not needed, delete it.
howto_job_entry_without_failure_hop=1. From entry '%s', draw a hop to an Abort job entry (or one that warns, such as Mail).%n2. Click the hop until it turns red (it is followed when the entry fails).%n3. Save the job.
howto_variable_in_constant=1. An Add constants step does not substitute variables: the field of '%s' gets the text ${...} as it is.%n2. Remove that field from Add constants.%n3. Add a Get variables step right after it, with a field of the same name and type whose variable is the ${...}.%n4. Run a preview to check the value.
howto_missing_input_file=1. Step '%s' reads a file that does not exist at that path.%n2. Copy the file there, or open the step and fix the path (better with ${Internal.Entry.Current.Directory}/...).%n3. Press 'Show filename(s)' in the step to check it.
howto_select_star=1. Open the Table input '%s'.%n2. Change SELECT * into the list of the columns you use (you can press 'Get SQL select statement' and pick the columns).%n3. Preview to check that the same columns come out.
howto_fragile_split=1. Replace the Field splitter of '%s' with a Regex evaluation with one capture group per field (Create fields for capture groups = Yes) and a result field.%n2. Add a Filter rows on the result field: the rows that do not match go to the rejects with 'unexpected format'.%n3. Test with dirty data to check it.
howto_counter_as_surrogate_key=1. Before '%s', look up the key that already exists (Database lookup by the natural key).%n2. For the new ones: Join rows with a Table input 'SELECT COALESCE(MAX(pk),0) AS max_pk FROM <dimension>', a sequence 1..n and a Calculator pk = max_pk + n.%n3. Or use Dimension lookup/update, which does it by itself.
howto_insert_only_load=1. Replace '%s' with an Insert / update with the same name and hops.%n2. Keys: the natural key (fields of the input); update the other columns except the surrogate key.%n3. For a staging table, checking Truncate table is enough.
howto_fact_not_grouped=1. Right before '%s', insert a Memory group by the keys of the fact.%n2. Sum the measures (or MAX/AVG, depending on what they mean).%n3. Run it and check that rows no longer overwrite each other in the load.
howto_inner_join_in_source=1. Open the query of '%s' and change the INNER JOIN (JOIN) into a LEFT JOIN.%n2. After the query, a Filter rows with the joined key IS NOT NULL.%n3. The false branch goes to the rejects with a reason ('key X is not in table Y').
howto_rejects_dead_end=1. The reject branch of '%s' ends without writing anything.%n2. Add at its end a rejects Text file output with the reason field.%n3. Or, if dropping those rows is what you want, silence this rule on the step with the reason.
d_score_after_unsaved=Score: %d → %d (approximate: with unsaved changes, passwords and repeated names are judged in memory until you save)

