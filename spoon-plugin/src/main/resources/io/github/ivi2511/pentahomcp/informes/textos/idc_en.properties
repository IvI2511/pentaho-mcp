q_title=Quality · %s
q_deep=Deep check (reads data)
q_deep_tip=Reads up to 5000 rows of the sources to confirm order and decimals. It only runs the steps known to be read-only (a Table input only with a plain SELECT or WITH and no SQL run on connect); otherwise the finding stays not evaluated. It writes no log tables. Takes 60 s at most.
q_robust=Include robustness
q_robust_tip=Adds the robustness rules (rows that would stop the load or vanish without a trace, rejects without a reason…) with their own score. The main score does not change.
