r_stress=Test with dirty data…
r_stress_tip=Generates broken variants of the input files (empty fields, bad dates and numbers, duplicates, empty file…) and runs a COPY of the transformation in a separate JVM: it checks that it does not abort, that no row is lost and that every reject has a reason. The original files are not touched.
