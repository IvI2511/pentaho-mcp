d_prompt_lint=Tengo abierta en Spoon la transformación «%1$s». La revisión de calidad de Pentaho Live (lint_etl) da este hallazgo que no se arregla solo:%n%n- Regla: %2$s (%3$s)%n- Dónde: %4$s%n- Qué pasa: %5$s%n- Cómo arreglarlo según la regla: %6$s%n- Key: %7$s%n%nArréglalo con las herramientas de Pentaho Live (lint_etl, apply_lint_fixes, harden_etl, los de edición de steps): primero dime qué vas a cambiar y espera a que te lo confirme; después aplícalo, valídalo y vuelve a revisar con lint_etl.
d_prompt_harden=Tengo abierta en Spoon la transformación «%1$s». Robustecer (harden_etl) propone esta receta, que no se aplica sola:%n%n- Receta: %2$s (%3$s)%n- Step: %4$s%n- Por qué: %5$s%n- Cómo hacerlo: %6$s%n- Key: %7$s%n%nHazlo con las herramientas de Pentaho Live: primero dime qué vas a cambiar y espera a que te lo confirme; después aplícalo, valídalo y vuelve a revisar con lint_etl robustness=true.
