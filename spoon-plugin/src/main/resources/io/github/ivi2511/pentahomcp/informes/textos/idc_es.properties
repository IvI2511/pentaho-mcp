howto_cycle=1. Busca el hop que cierra el círculo (el hop señalado empieza en «%s»).%n2. Haz clic derecho sobre él > Borrar hop (o desactívalo).%n3. Si de verdad necesitas volver a pasar filas, usa un step que lo haga bien (un Append o un mapping), no un hop circular.
howto_duplicate_step_name=1. Cierra la transformación sin guardar si Spoon la abrió con un step de menos.%n2. Abre el .ktr en un editor de texto y busca los dos <step> con <name>%s</name>.%n3. Cambia el nombre de uno (y sus <from>/<to> en <order>), guarda y vuelve a abrirlo en Spoon.
howto_missing_plugin=1. Mira el tipo del step «%s» en el mensaje.%n2. Instala ese plugin en la carpeta plugins de PDI (o desde el Marketplace) y reinicia Spoon.%n3. Si no lo vas a usar, reemplázalo por un step equivalente que sí tengas.
howto_broken_hop=1. El hop «%s» apunta a un step que no existe.%n2. Ábrelo con clic derecho y bórralo.%n3. Dibuja el hop otra vez entre los steps que sí existen.
howto_kettle_check=1. Lee el mensaje de Kettle (es la verificación de Spoon: Acción > Verificar).%n2. Si es de una conexión, pruébala (clic derecho en la conexión > Probar).%n3. Corrige el step «%s» según lo que diga.
howto_job_without_start=1. Arrastra una entrada START desde General al lienzo del job.%n2. Dibuja un hop desde START hasta la primera entrada que deba correr.%n3. Guarda y valida el job.
howto_unreachable_entry=1. La entrada «%s» no se alcanza desde START.%n2. Conéctala con un hop desde la entrada que va antes, o habilita el hop deshabilitado que lleva a ella.%n3. Si sobra, bórrala.
howto_job_entry_without_failure_hop=1. Desde la entrada «%s», dibuja un hop hasta una entrada Abort job (o una que avise, como Mail).%n2. Haz clic en el hop hasta que quede rojo (se sigue cuando la entrada falla).%n3. Guarda el job.
howto_variable_in_constant=1. Un step Add constants no sustituye variables: el campo de «%s» lleva el texto ${...} tal cual.%n2. Quita ese campo de Add constants.%n3. Añade un step Get variables justo después, con un campo del mismo nombre y tipo cuya variable sea la ${...}.%n4. Ejecuta con la vista previa para comprobar el valor.
howto_missing_input_file=1. El step «%s» lee un archivo que no existe en esa ruta.%n2. Copia el archivo ahí, o abre el step y corrige la ruta (mejor con ${Internal.Entry.Current.Directory}/...).%n3. Pulsa «Mostrar nombres de archivo» en el step para comprobarlo.
howto_select_star=1. Abre el Table input «%s».%n2. Cambia SELECT * por la lista de columnas que usas (puedes pulsar «Obtener sentencia SQL» y elegir las columnas).%n3. Vista previa para comprobar que salen las mismas columnas.
howto_fragile_split=1. Reemplaza el Field splitter de «%s» por un Regex evaluation con un grupo de captura por campo (Crear campos para grupos de captura = Sí) y un campo de resultado.%n2. Pon un Filter rows sobre el campo de resultado: las filas que no encajan, a los rechazos con «formato inesperado».%n3. Prueba con datos sucios para comprobarlo.
howto_counter_as_surrogate_key=1. Delante de «%s», busca la clave que ya existe (Database lookup por la clave natural).%n2. Para las nuevas: Join rows con un Table input «SELECT COALESCE(MAX(pk),0) AS max_pk FROM <dimensión>», una secuencia 1..n y un Calculator pk = max_pk + n.%n3. O usa Dimension lookup/update, que lo hace solo.
howto_insert_only_load=1. Cambia «%s» por un Insert / update con el mismo nombre y hops.%n2. Claves: la clave natural (campos de la entrada); actualiza las demás columnas salvo la clave subrogada.%n3. Si es una tabla de staging, basta con marcar Truncar tabla.
howto_fact_not_grouped=1. Justo antes de «%s», inserta un Memory group by por las claves del hecho.%n2. Suma las medidas (o MAX/AVG, según lo que signifiquen).%n3. Ejecuta y comprueba que ya no se pisan filas en la carga.
howto_inner_join_in_source=1. Abre la consulta de «%s» y cambia el INNER JOIN (JOIN) por LEFT JOIN.%n2. Después de la consulta, un Filter rows con la clave unida IS NOT NULL.%n3. La rama falsa, a los rechazos con un motivo («la clave X no está en la tabla Y»).
howto_rejects_dead_end=1. La rama de rechazo de «%s» termina sin escribir nada.%n2. Añade al final un Text file output de rechazos con el campo motivo.%n3. O, si descartar esas filas es lo que quieres, silencia esta regla en el step con el motivo.
d_score_after_unsaved=Puntuación: %d → %d (aproximada: con cambios sin guardar, las contraseñas y los nombres repetidos se juzgan en memoria hasta que guardes)
