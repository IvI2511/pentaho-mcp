# Seção «Guia da lição» (lesson, SecLeccion): o guia do modo aula para distribuir. Dono: clase. Lido em UTF-8. Os
# padrões usam String.format com o locale do relatório: %s texto, %d inteiro. Plurais: <chave>.1 para um, <chave>.n
# para o resto. As etiquetas O quê, Por quê, Atenção!, Dica e Pergunta? são as das notas.

