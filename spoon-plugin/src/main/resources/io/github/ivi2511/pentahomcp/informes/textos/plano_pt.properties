# ---- revisão (plan_review): .msg, .fix e .ask (a pergunta para o usuário)
rev.vacia=A revisão não encontra nada para corrigir.
rev.resumen=%d erros, %d avisos e %d sugestões.
rev.pregunta=Pergunta: %s
rev.no_goal.msg=O plano não tem objetivo.
rev.no_goal.fix=Escreva em uma frase o que o ETL precisa conseguir e para quem.
rev.no_goal.ask=Para que serve este ETL: qual relatório, indicador ou sistema ele alimenta?
rev.no_grain.msg=Falta o grão: não se sabe o que representa uma linha do destino.
rev.no_grain.fix=Defina o grão (por exemplo, «uma linha por item de cupom válido»): dele saem a chave, os duplicados e as agregações.
rev.no_grain.ask=O que representa exatamente uma linha da tabela fato?
rev.no_sources.msg=O plano não tem fontes.
rev.no_sources.fix=Adicione cada fonte com formato, volume e frequência.
rev.no_targets.msg=O plano não tem destinos.
rev.no_targets.fix=Adicione cada tabela ou arquivo de saída com sua chave e seu tipo de carga.
rev.no_stages.msg=O plano não tem etapas: plan_build não tem o que construir.
rev.no_stages.fix=Divida o trabalho em etapas (extrair → limpar → buscar chaves → carregar).
rev.load_strategy_missing.msg=Não diz se a carga é completa ou incremental.
rev.load_strategy_missing.fix=Defina load: full ou incremental (e, se for incremental, incremental_by).
rev.load_strategy_missing.ask=Chega todo o histórico a cada vez ou só o que é novo desde a última carga?
rev.incremental_without_watermark.msg=A carga é incremental, mas não diz como se sabe o que é novo.
rev.incremental_without_watermark.fix=Defina incremental_by: o campo de data ou de sequência que marca até onde foi carregado.
rev.incremental_without_watermark.ask=Qual campo diz quais linhas são novas (data de criação, id crescente…)?
rev.source_without_format.msg=A fonte «%s» não diz seu formato.
rev.source_without_format.fix=Defina format: csv, excel, json, table…
rev.source_without_volume.msg=A fonte «%s» não diz seu volume ou sua frequência.
rev.source_without_volume.fix=Defina volume e frequency: eles decidem se é preciso carga incremental, ordenar em memória ou particionar.
rev.source_without_volume.ask=Quantas linhas «%s» traz e com que frequência chega?
rev.source_without_rejects.msg=A fonte «%s» não tem plano de rejeições: uma linha ruim pararia a carga ou se perderia sem rastro.
rev.source_without_rejects.fix=Defina rejects (o arquivo de rejeições com o motivo) ou uma etapa do tipo reject depois da que a lê.
rev.source_without_rejects.ask=O que fazemos com as linhas de «%s» que não passam na validação: separar em um arquivo com o motivo ou parar a carga?
rev.source_not_read.msg=Nenhuma etapa lê a fonte «%s».
rev.source_not_read.fix=Coloque-a em reads da etapa que a extrai, ou tire-a do plano.
rev.target_not_written.msg=Nenhuma etapa escreve o destino «%s».
rev.target_not_written.fix=Coloque-o em writes da etapa que o carrega, ou tire-o do plano.
rev.non_idempotent_load.msg=A carga de «%s» (%s) não é idempotente: se repetida, duplica linhas.
rev.non_idempotent_load.fix=Use truncate_insert, upsert com chave ou scd1/scd2, ou apague antes o período que é recarregado.
rev.non_idempotent_load.ask=Se a carga falhar no meio e for executada de novo, o que deve acontecer com as linhas de «%s» que já foram escritas?
rev.upsert_without_key.msg=«%s» é carregado com %s, mas não tem chave.
rev.upsert_without_key.fix=Defina key: os campos que identificam uma linha (a chave de negócio).
rev.dimension_without_history.msg=A dimensão «%s» não diz se guarda histórico.
rev.dimension_without_history.fix=Defina load: scd1 (sobrescreve), scd2 (guarda histórico) ou truncate_insert.
rev.dimension_without_history.ask=Se um dado de «%s» mudar (por exemplo, a categoria de um produto), é preciso guardar como era antes ou basta o valor atual?
rev.lookup_without_key.msg=A busca de «%s» não tem chave.
rev.lookup_without_key.fix=Defina key: os campos pelos quais se busca.
rev.lookup_without_on_missing.msg=«%s» não diz o que fazer se a chave não for encontrada (os órfãos).
rev.lookup_without_on_missing.fix=Defina on_missing: reject, default, unknown_member ou fail.
rev.lookup_without_on_missing.ask=Em «%s», o que fazemos com uma linha cujo cliente, produto ou loja não existe: rejeitar, atribuir a um membro «desconhecido» ou parar a carga?
rev.orphans_rejected_nowhere.msg=«%s» rejeita os órfãos, mas nenhuma etapa de rejeições vem depois.
rev.orphans_rejected_nowhere.fix=Adicione uma etapa do tipo reject com after: esta etapa (o arquivo ou a tabela de rejeições com o motivo).
rev.dedupe_without_key.msg=«%s» remove duplicados sem dizer por quais campos.
rev.dedupe_without_key.fix=Defina key na etapa (ou na fonte que ela lê).
rev.dedupe_without_key.ask=Quando duas linhas são a mesma: quais campos precisam coincidir?
rev.stage_without_input.msg=A etapa «%s» não recebe linhas: não tem after, reads nem lookup.
rev.stage_without_input.fix=Diga de qual etapa ela vem (after) ou qual fonte lê (reads).
rev.stage_dead_end.msg=As linhas de «%s» não vão a lugar nenhum: nenhuma etapa vem depois e ela não escreve nenhum destino.
rev.stage_dead_end.fix=Conecte-a à próxima etapa ou diga qual destino ela escreve.
rev.rule_unused.msg=Nenhuma etapa aplica a regra %s («%s»).
rev.rule_unused.fix=Coloque-a em rules da etapa que a cumpre.
rev.no_orchestration.msg=O plano tem %d transformações e não diz em que ordem rodam.
rev.no_orchestration.fix=Adicione orchestration com name (o job), order e on_failure.
rev.no_orchestration.ask=Em que ordem elas são carregadas (primeiro as dimensões, depois os fatos) e o que acontece se uma falhar?
rev.orchestration_without_failure_path.msg=A orquestração não diz o que fazer se uma transformação falhar.
rev.orchestration_without_failure_path.fix=Defina on_failure: abort, continue ou notify.
rev.orchestration_without_failure_path.ask=Se uma transformação falhar, abortamos toda a carga, seguimos com a próxima ou avisamos alguém?
rev.risk_without_mitigation.msg=O risco «%s» não tem mitigação.
rev.risk_without_mitigation.fix=Diga qual etapa ou regra o controla.
rev.decision_without_why.msg=A decisão «%s» não explica o porquê.
rev.decision_without_why.fix=Anote o motivo: daqui a alguns meses ninguém vai lembrar.

