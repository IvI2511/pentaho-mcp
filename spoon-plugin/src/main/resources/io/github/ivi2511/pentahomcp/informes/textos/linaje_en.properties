# ---- what it is for (first paragraph of the section; **bold** as in paragraphs)
para_que=**What it is for:** it shows where each field the transformation writes comes from and what happens to it on the way. Use it to see what breaks if you change a source column (impact analysis), to find the step where a value starts coming out wrong, and to document the process (audits and compliance).

