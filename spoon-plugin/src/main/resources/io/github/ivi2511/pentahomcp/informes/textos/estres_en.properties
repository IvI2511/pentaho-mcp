# Messages, reasons and notes of the MCP tool stress_test (Pentaho Live), argument language=en. Keys and codes
# (verdict, status, check ids) do not change. EstresTools.java, EstresSandbox.java, robustez/Balance.java,
# robustez/Variantes.java. UTF-8.

# --- arguments and run (EstresTools)
unknown_variant=unknown variant '%s'; valid: all, %s
not_transformation=stress_test works on transformations (.ktr), not on jobs
cancelled=The stress test was cancelled
timeout=The stress test did not finish in %d s and was stopped
note_not_sandbox=Not a security sandbox: the transformation's own JavaScript/Java code runs in the child JVM.
not_run_dbs=the transformation uses databases that are not SQLite/H2 files (%s): stress_test never connects to them. Use export_variants and run the broken files by hand, or test a copy that loads into SQLite
not_run_blocked=some steps cannot run in the sandbox: %s
not_run_no_inputs=no file input that stress_test can dirty (CSV input, Text file input, Excel input, JSON input reading an existing file)
not_run_no_pdi=cannot find PDI's data-integration folder to start the test JVM
not_run_memory=not enough free memory to start the test JVM (needs about 1 GB)
child_stopped=the test JVM was stopped (time budget exceeded)
child_exit=the test JVM ended with code %d: %s
run_not_finished=the run did not finish (the test JVM was stopped or crashed): %s
no_log=(no log)
rerun_no_db=no SQLite/H2 file database is loaded: nothing to re-run
environment_reason=environment problem, not a robustness failure: %s
next=harden_etl recipes=%s (see the plan with dry_run=true), then run stress_test again
missing_db=%s (connection %s)
export_exists=%s: already exists
cannot_read=cannot read it: %s

# --- static analysis (EstresSandbox)
blocked_missing=%s (%s): its plugin is not installed
blocked_external=%s (%s): it leaves the machine, runs other processes or other transformations
blocked_writes_out=%s (%s): it writes or sends data somewhere stress_test cannot redirect to the sandbox
blocked_sql=%s (%s): SQL without a file database
blocked_filename_field=%s (%s): its file name comes from a field
db_used_by=%s (%s) used by '%s'
input_not_selected=not in 'inputs'
input_from_previous=it takes its file names from a previous step
input_no_filename=no file name
input_missing_file=the file does not exist (%s)
input_fixed_width=fixed-width files are not supported yet

# --- per-variant summary (Balance.Informe.resumen)
summary_env_bad_row=aborted: a bad row stopped the load (and there is an environment problem: %s)
summary_env=not evaluated (environment problem): %s
summary_aborted=aborted after %d rows read (%d loaded, %d rejected before the stop)
summary_balance=%d read = %d loaded + %d rejected + %d dropped (declared) + %d lost
summary_fanout=%d read; %d reached the loads, %d rejected, %d dropped (declared), %d lost (rows fan out to several loads or are merged: see aggregates)

# --- checks (Balance.evaluar)
detail_error=error: %s
no_abort_env_bad_row=a bad row stopped the load (besides the environment problem: %s)
step_failed=step '%s' (%s) failed with %d error(s)
step_failed_msg=step '%s' (%s) failed with %d error(s): %s
env_problem=environment problem: %s
env_problem_aborted=the run aborted; environment problem: %s
no_abort_timeout=the run did not finish in time (timeout)
no_abort_aborted=the transformation aborted with %d error(s): a bad row stopped the load
no_abort_aborted_msg=the transformation aborted with %d error(s): a bad row stopped the load: %s
input_swallowed='%s' produced %d rows from %d data lines: the input swallowed %d (open enclosure or a cut line joined to the next one)
not_eval_info_shared=%s: its info source sends rows to several steps
not_eval_info_split=%s: could not separate its main and info rows
loss_partial=the run aborted: the row counts are partial
loss=%d row(s) disappeared without an error hop, a false branch or a declaration
loss_step=step '%s' (%s) lost %d row(s)
loss_step_filter=step '%s' (%s) lost %d row(s): a filter without a false branch drops the rows that do not match; send them to a rejects file with a reason, or declare the drop
no_rejects_file=no rejects file in the transformation
reject_no_column='%s' writes %d rejected row(s) without a reason column (motivo/reason)
reject_empty_reason='%s': %d of %d rejected row(s) have an empty reason
bad_rows_aborted=the run aborted
bad_rows_none=the variant has no rows that must be rejected
bad_rows_not_rejected=%d broken row(s) were not rejected (%d expected, %d rejected): they reached the outputs or were lost
idem_second_aborted=the second run on the same database aborted
idem_second_aborted_msg=the second run on the same database aborted: %s
idem_no_table=no database table to compare
idem_duplicates=table %s: %d rows after the 1st run, %d after the 2nd (re-running duplicates rows)
idem_keys_changed=table %s: same rows but the keys changed (unstable surrogate keys)
idem_not_idempotent=re-running the load is not idempotent

# --- environment problems (Balance.problemaDeEntorno)
env_db_files=the database file %s does not exist: run the job that creates it first, or point the test at a prepared copy
env_db_files_table=the database file %s does not exist (so neither does the table %s): run the job that creates it first, or point the test at a prepared copy
env_db=the database %s does not exist: run the job that creates it first, or point the test at a prepared copy
env_db_unnamed=the database file does not exist: run the job that creates it first, or point the test at a prepared copy
env_table=the database or table %s does not exist: run the job that creates it first, or point the test at a prepared copy
env_table_unnamed=the database or table it reads or loads does not exist: run the job that creates it first, or point the test at a prepared copy
