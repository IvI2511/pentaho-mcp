# ---------------------------------------------------------------- robustez (desligadas por padrão; robustness=true)
# docs/robustez-diseno.md §3. Pontuação própria; evidence.recipe = a receita do harden_etl que corrige o achado.

no_rejects_on_load.title=Carga no banco sem rejeitos
no_rejects_on_load.why=Um texto maior que a coluna, um valor fora do intervalo ou uma restrição violada param a carga inteira: as linhas boas que vêm depois também não são carregadas.
no_rejects_on_load.fix=harden_etl recipes=[{recipe}] steps=[{step}]: tratamento de erros para um arquivo de rejeitos com motivo e campos_error (à mão: 09-robustez.md, R01).
no_rejects_on_load.msg=O step '{step}' carrega a tabela {table} sem tratamento de erros: uma linha ruim para a carga inteira.
no_rejects_on_load.msg.sqlite=O step '{step}' carrega a tabela {table} com Table output no SQLite, que não tem tratamento de erros: uma linha ruim para a carga. Use Insert / update (esse tem).
no_rejects_on_conversion.title=Conversão de tipos sem rejeitos
no_rejects_on_conversion.why=Uma data ou um número mal escritos ('31/02/2021', 'mil') fazem a conversão falhar e a transformação para, em vez de mandar essa linha para um arquivo de rejeitos com a mensagem do Kettle.
no_rejects_on_conversion.fix=harden_etl recipes=[{recipe}] steps=[{step}]: converter sem modo leniente e com um hop de erro para os rejeitos (à mão: 09-robustez.md, R01 e R04).
no_rejects_on_conversion.msg=O step '{step}' converte {fields} sem tratamento de erros: um valor mal escrito para a transformação.
no_rejects_on_conversion.msg.input=O step '{step}' lê {fields} com um tipo e não tem tratamento de erros: um valor mal escrito para a transformação. Leia como String e converta num Select values com hop de erro.
rejects_without_reason.title=Rejeitos sem motivo
rejects_without_reason.why=Um arquivo de rejeitos que não diz por que cada linha foi rejeitada não pode ser corrigido nem recarregado: ninguém sabe o que consertar.
rejects_without_reason.fix=harden_etl recipes=[reject_reason] steps=[{step}]: a descrição do erro vai para 'motivo' e os campos para 'campos_error'; no ramo falso de um filtro, um User Defined Java Expression monta o motivo.
rejects_without_reason.msg=O tratamento de erros de '{step}' manda as linhas para '{target}' sem a descrição do erro: os rejeitos não dizem por quê.
rejects_without_reason.msg.filter=As linhas que não passam em '{step}' são gravadas por '{target}' sem nenhuma coluna de motivo (motivo, reason, error...).
rejects_dead_end.title=Rejeitos que não vão a lugar nenhum
rejects_dead_end.why=As linhas enviadas a um hop de erro ou ao ramo falso de um filtro que termina num Dummy (ou num step que não grava nada) se perdem sem rastro, justamente o que os rejeitos deviam evitar.
rejects_dead_end.fix=Termine o ramo num arquivo de rejeitos (Text file output com motivo), ou declare o descarte proposital com suppress_lint (09-robustez.md, arquivos de rejeitos).
rejects_dead_end.msg=As linhas rejeitadas por '{step}' terminam em '{target}', que não grava nada: se perdem sem rastro.
silent_filter_drop.title=Filtro que descarta linhas em silêncio
silent_filter_drop.why=Um Filter rows sem ramo falso (ou um Switch / case sem destino padrão) joga fora as linhas que não atendem e nada as conta: a carga parece completa.
silent_filter_drop.fix=Mande o ramo falso para os rejeitos com um motivo (harden_etl recipes=[reject_reason]) ou, se descartá-las é a intenção, silencie esta regra no step com o motivo: isso declara o descarte.
silent_filter_drop.msg=O filtro '{step}' não tem ramo falso: as linhas que não atendem somem sem rastro antes da carga.
silent_filter_drop.msg.switch=O Switch / case '{step}' não tem destino padrão: as linhas com um valor inesperado somem sem rastro.
lookup_drops_rows.title=Busca que descarta linhas
lookup_drops_rows.why=Um Database lookup com 'Não passar a linha se a busca falhar', ou um Merge join INNER antes de uma carga, removem os órfãos (uma venda de um cliente desconhecido) sem deixar rastro.
lookup_drops_rows.fix=harden_etl recipes=[orphans_to_rejects] steps=[{step}]: deixe a linha passar, verifique a chave com um filtro e rejeite os órfãos com o motivo (ou use o membro Desconhecido).
lookup_drops_rows.msg=O Database lookup '{step}' descarta a linha quando não encontra a chave: os órfãos somem sem rastro.
lookup_drops_rows.msg.merge_join=O Merge join '{step}' é INNER e alimenta uma carga: as linhas sem par somem sem rastro.
unchecked_lookup.title=Resultado de busca não verificado
unchecked_lookup.why=Uma busca sem valor padrão devolve nulo quando não encontra a chave, e o nulo segue até a carga: uma linha com a chave vazia, ou um erro de banco que para tudo.
unchecked_lookup.fix=harden_etl recipes=[orphans_to_rejects] steps=[{step}]: um Filter rows '{field} IS NOT NULL' depois das buscas, com o ramo falso para os rejeitos com o motivo (ou um valor padrão para o membro Desconhecido).
unchecked_lookup.msg='{step}' devolve {field} sem valor padrão e chega a '{load}' sem nenhuma verificação de nulos: uma chave não encontrada vira uma chave vazia.
inner_join_in_source.title=INNER JOIN na consulta de origem
inner_join_in_source.why=Um JOIN interno no Table input remove as linhas sem par antes que o ETL as veja: esses órfãos nem são carregados nem rejeitados, simplesmente não aparecem.
inner_join_in_source.fix=Escreva a consulta com LEFT JOIN e rejeite, com o motivo, as linhas cuja chave unida seja nula (09-robustez.md, R08).
inner_join_in_source.msg=A consulta de '{step}' usa um JOIN interno e alimenta uma carga: as linhas sem par se perdem antes que o ETL as veja.
no_required_check.title=Sem verificação dos campos obrigatórios
no_required_check.why=Uma linha cortada ou uma chave vazia no arquivo chegam a uma carga ou a uma busca por chave: são carregadas com a chave nula, não encontram nada ou param a carga.
no_required_check.fix=harden_etl recipes=[required_fields] steps=[{step}]: um Filter rows 'IS NOT NULL' nos obrigatórios logo depois da entrada, com o ramo falso para os rejeitos com 'Faltan campos obligatorios: ...'.
no_required_check.msg=As linhas de '{step}' chegam a '{target}' (chaves: {keys}) sem nenhuma verificação de que os campos obrigatórios estão lá.
lenient_conversion.title=Conversão leniente
lenient_conversion.why=No modo leniente, '31/02/2021' vira 3 de março e '12abc' pode ser lido como 12: a linha é carregada errada e nada falha.
lenient_conversion.fix=harden_etl recipes=[strict_conversion] steps=[{step}]: sem modo leniente e com hop de erro, para que os valores mal escritos vão para os rejeitos com a mensagem do Kettle.
lenient_conversion.msg=O Select values '{step}' converte {fields} no modo leniente: os valores mal escritos são carregados errados sem nenhum erro.
fragile_split.title=Field splitter sobre dados de arquivo
fragile_split.why=Um valor com menos ou mais partes que as declaradas (um endereço sem CEP) deixa campos vazios ou deslocados sem nenhum erro.
fragile_split.fix=Use um Regex evaluation com um grupo de captura por campo e um campo de resultado, e rejeite com o motivo as linhas que não casam (09-robustez.md, R05).
fragile_split.msg=O Field splitter '{step}' divide {field}, que vem de um arquivo, sem nenhuma verificação: um valor inesperado deixa campos vazios ou deslocados.
no_dedupe_before_load.title=Sem deduplicar antes da carga
no_dedupe_before_load.why=A mesma chave duas vezes no arquivo (ou em duas fontes) é carregada duas vezes, ou a segunda sobrescreve a primeira num Insert / update.
no_dedupe_before_load.fix=harden_etl recipes=[dedupe_before_load] steps=[{step}]: um Unique rows (HashSet) pela chave natural antes da carga, declarado como descarte (ou com os repetidos para os rejeitos).
no_dedupe_before_load.msg='{step}' carrega linhas que vêm de um arquivo ou de várias fontes sem remover antes os repetidos de {keys}.
no_dedupe_before_load.msg.nokeys='{step}' carrega linhas que vêm de um arquivo ou de várias fontes sem remover antes os repetidos.
counter_as_surrogate_key.title=Contador como chave substituta
counter_as_surrogate_key.why=Um Add sequence com contador recomeça em 1 a cada execução: se a ordem muda ou aparece uma linha nova, as chaves mudam e os fatos já carregados apontam para outro membro.
counter_as_surrogate_key.fix=harden_etl recipes=[stable_surrogate_keys] steps=[{step}]: busque a chave que já existe e numere as novas a partir de max(chave) + n (ou use Dimension lookup / update).
counter_as_surrogate_key.msg='{step}' numera {field} com um contador e '{load}' o carrega: as chaves mudam de uma execução para outra.
insert_only_load.title=Carga que só insere
insert_only_load.why=Um Table output que não esvazia a tabela insere de novo as mesmas linhas a cada execução: duplicados, ou um erro de chave primária que para a carga.
insert_only_load.fix=harden_etl recipes=[idempotent_load] steps=[{step}]: Insert / update pela chave natural (ou esvaziar a tabela, se for de staging).
insert_only_load.msg=O Table output '{step}' insere em {table} sem esvaziá-la: executar de novo duplica as linhas.
fact_not_grouped.title=Carga de fatos não agrupada pelas chaves
fact_not_grouped.why=Duas linhas com as mesmas chaves (duas linhas da mesma venda) se sobrescrevem num Insert / update ou colidem com a chave primária: valores se perdem.
fact_not_grouped.fix=harden_etl recipes=[aggregate_to_grain] steps=[{step}]: um Memory group by {keys} com SUM das medidas antes da carga.
fact_not_grouped.msg='{step}' carrega por {keys} sem agrupar antes por essas chaves: as linhas com as mesmas chaves se sobrescrevem.
lookup_before_load_finishes.title=Busca antes de a carga terminar
lookup_before_load_finishes.why=Todos os steps de uma transformação começam ao mesmo tempo: uma busca numa tabela que a mesma transformação carrega pode rodar antes de as linhas estarem lá, e então não encontra as chaves.
lookup_before_load_finishes.fix=harden_etl recipes=[wait_for_loads] steps=[{step}]: um Block until steps finish ('{writer}') antes da busca; ou carregue a tabela numa transformação anterior do job.
lookup_before_load_finishes.msg='{step}' lê {table}, que '{writer}' carrega nesta mesma transformação, sem esperar que termine.
fixed_input_file.title=Arquivo de entrada sem parâmetro
fixed_input_file.why=Com o nome do arquivo escrito dentro do step não dá para rodar o ETL com outro arquivo (um quebrado, para testar) sem editá-lo.
fixed_input_file.fix=harden_etl recipes=[input_file_parameter] steps=[{step}]: um parâmetro com o nome do arquivo (padrão = o atual), usado no caminho.
fixed_input_file.msg=A entrada '{step}' lê sempre {file}: não há um parâmetro para testá-la com outro arquivo.
