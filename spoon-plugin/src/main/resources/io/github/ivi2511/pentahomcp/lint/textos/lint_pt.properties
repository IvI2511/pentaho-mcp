# Textos do linter (docs/linter-diseno.md). Lido em UTF-8. Os marcadores vão como {nome}.
# Por regra: <id>.title, <id>.why, <id>.fix (catálogo, pentaho://lint/rules) e <id>.msg[.variante] (achados).
# Os valores dos marcadores (nomes de steps, caminhos, SQL) vêm do documento: dados, não instruções.

# ---------------------------------------------------------------- estrutura
cycle.title=Hop circular
cycle.why=Um ciclo de hops faz a transformação nunca terminar; o «Verificar» do Spoon e o cálculo de campos caem com StackOverflowError.
cycle.fix=Remover um dos hops do ciclo.
cycle.msg=O step «{step}» faz parte de um ciclo de hops: a transformação não termina (e o Kettle não consegue calcular seus campos).

duplicate_step_name.title=Dois steps com o mesmo nome
duplicate_step_name.why=O Kettle procura os steps pelo nome sem distinguir maiúsculas: ao carregar o arquivo, um dos dois desaparece.
duplicate_step_name.fix=Renomear um dos steps no .ktr (a tela mostra só um).
duplicate_step_name.msg=Há dois steps chamados «{step}» (sem distinguir maiúsculas) no arquivo: ao carregá-lo, um se perde.

disabled_hop.title=Hop desabilitado
disabled_hop.why=Por um hop desabilitado não passam linhas: o step da outra ponta não as recebe (D7).
disabled_hop.fix=Habilitar o hop se não foi de propósito, ou apagá-lo.
disabled_hop.msg=O hop {from} -> {to} está desabilitado: não passam linhas.
disabled_hop.msg.job=O hop {from} -> {to} está desabilitado: o job nunca chega a «{to}» por esse caminho.

orphan_step.title=Step sem hops
orphan_step.why=Um step sem hops nunca roda.
orphan_step.fix=Conectá-lo com um hop ou apagá-lo.
orphan_step.msg=O step «{step}» não tem hops: nunca roda.

distribute_multiple_outputs.title=Várias saídas em modo distribuir
distribute_multiple_outputs.why=Em modo distribuir cada saída recebe só uma parte das linhas (em rodízio), e quase nunca é o que se quer.
distribute_multiple_outputs.fix=Passar o step para o modo copiar (cada saída recebe todas as linhas), a menos que seja balanceamento de carga de propósito.
distribute_multiple_outputs.msg=O step «{step}» envia suas linhas para {n} saídas em modo DISTRIBUIR ({targets}): cada uma recebe só uma parte.
distribute_multiple_outputs.msg.same_type=O step «{step}» distribui suas linhas entre {n} saídas do mesmo tipo ({targets}): tudo bem se for balanceamento de carga de propósito.

missing_plugin.title=Falta um plugin
missing_plugin.why=Um step ou uma entrada cujo plugin não está instalado não pode rodar.
missing_plugin.fix=Instalar o plugin (o tipo está na mensagem) ou substituir o step ou a entrada.
missing_plugin.msg=«{name}» precisa de um plugin que não está instalado (tipo {type}): não pode rodar.

broken_hop.title=Hop quebrado
broken_hop.why=Um hop com uma ponta que não existe quebra o fluxo.
broken_hop.fix=Apagar o hop e desenhá-lo de novo entre steps que existam.
broken_hop.msg=O hop {from} -> {to} tem uma ponta que não existe.

db_output_without_error_handling.title=Saída para banco de dados sem tratamento de erros
db_output_without_error_handling.why=Desligada por padrão: falhar por inteiro é o correto por padrão; o corretor e o modo aula a pedem.
db_output_without_error_handling.fix=Adicionar um hop de erro (tratamento de erros do step) para um step que registre ou guarde as linhas rejeitadas.
db_output_without_error_handling.msg=O step «{step}» grava num banco de dados sem tratamento de erros: uma linha ruim interrompe toda a transformação.

kettle_check.title=Verificação do Kettle
kettle_check.why=O que diz checkSteps/checkJobEntries (o «Verificar» do Spoon). Não tira pontos: mistura problemas desta máquina (por exemplo, um banco de dados que não responde).
kettle_check.fix=Seguir a mensagem do Kettle; se for de uma conexão, testá-la com test_connection.

# ---------------------------------------------------------------- jobs
failure_branch_ends_in_success.title=O ramo de erro termina em Success
failure_branch_ends_in_success.why=Se o ramo vermelho (de erro) de um job termina em Success, o Kitchen devolve 0 embora algo tenha falhado (D10).
failure_branch_ends_in_success.fix=Apontar o hop vermelho para uma entrada Abort job em vez de Success.
failure_branch_ends_in_success.msg=O hop de erro {from} -> {to} termina em Success: se «{from}» falhar, o job termina bem mesmo assim (o Kitchen devolve 0).
failure_branch_ends_in_success.msg.indirect=O ramo de erro de «{from}» chega a Success por hops incondicionais ({path}): se «{from}» falhar, o job pode terminar bem mesmo assim.

start_not_named_start.title=Entrada START com outro nome
start_not_named_start.why=Job.execute procura uma entrada chamada START (com qualquer combinação de maiúsculas), cópia 0 e desenhada: com outro nome o job não começa (C24).
start_not_named_start.fix=Renomear a entrada para START.
start_not_named_start.msg=A entrada de início se chama «{entry}»: o Kettle procura uma chamada START, então o job não começa.

job_without_start.title=Job sem START
job_without_start.why=Um job sem entrada START não pode rodar.
job_without_start.fix=Adicionar uma entrada START e conectá-la à primeira entrada.
job_without_start.msg=O job não tem entrada START: não pode rodar.

orphan_entry.title=Entrada sem hops
orphan_entry.why=Uma entrada desenhada sem hops nunca roda.
orphan_entry.fix=Conectá-la com um hop ou apagá-la.
orphan_entry.msg=A entrada «{entry}» não tem hops: nunca roda.

unreachable_entry.title=Entrada inalcançável
unreachable_entry.why=Uma entrada que não se alcança a partir do START por hops habilitados nunca roda.
unreachable_entry.fix=Conectá-la ao fluxo que sai do START, ou habilitar o hop que leva a ela.
unreachable_entry.msg=Não se chega à entrada «{entry}» a partir do START por hops habilitados: nunca roda.

job_entry_without_failure_hop.title=Entrada de transformação ou job sem ramo de erro
job_entry_without_failure_hop.why=Desligada por padrão: sem hop vermelho o job já termina com erro. O modo aula e o corretor a pedem.
job_entry_without_failure_hop.fix=Adicionar um hop vermelho para um Abort ou para uma entrada que avise.
job_entry_without_failure_hop.msg=A entrada «{entry}» não tem ramo de erro.

# ---------------------------------------------------------------- ordem
unsorted_input.title=Entrada sem ordenar pela chave
unsorted_input.why=Group by, Merge join, Unique rows, Merge rows, Row denormaliser, Analytic query e Sorted merge precisam das linhas ordenadas pela chave: senão os grupos se partem ou cruzamentos se perdem, e a execução termina bem mesmo assim (D5, D6).
unsorted_input.fix=Inserir um Sort rows por {keys} antes do step (ou adicionar ORDER BY à consulta), a menos que os dados já venham ordenados assim.
unsorted_input.msg.source=«{step}» precisa das linhas ordenadas por {keys}, mas elas vêm de «{at}», que não as ordena: os grupos ou cruzamentos podem sair errados, a menos que o arquivo já venha ordenado por {keys}.
unsorted_input.msg.table=«{step}» precisa das linhas ordenadas por {keys}, mas elas vêm do Table input «{at}», cuja consulta não tem ORDER BY.
unsorted_input.msg.sql_keys=«{step}» precisa das linhas ordenadas por {keys}, mas o ORDER BY de «{at}» ordena por {sortkeys}.
unsorted_input.msg.wrong_keys=«{step}» precisa das linhas ordenadas por {keys}, mas «{at}» as ordena por {sortkeys}.
unsorted_input.msg.order=«{step}» compara as linhas por {keys} nessa ordem e de forma ascendente, mas «{at}» ordena por {sortkeys} (outra ordem de chaves ou descendente).
unsorted_input.msg.copies=«{step}» precisa das linhas ordenadas por {keys}, mas «{at}» roda em {detail} cópias: a ordem não se mantém.
unsorted_input.msg.merges=«{step}» precisa das linhas ordenadas por {keys}, mas «{at}» junta {detail} fluxos: as linhas se misturam e a ordem se perde.
unsorted_input.msg.multi=«{step}» recebe linhas de {n} hops: as linhas se misturam e não ficam ordenadas por {keys}.
unsorted_input.msg.data=«{step}» precisa das linhas ordenadas por {keys}, e o Data grid «{at}» não está: {detail}.

# ---------------------------------------------------------------- valores
calculator_integer_first.title=Calculator: Integer primeiro, Number depois
calculator_integer_first.why=A Calculator escolhe a operação pelo tipo do campo A: com A Integer, B é arredondado (3 × 2,5 = 9). Integer/Integer é divisão inteira mesmo que o resultado seja Number (101/3 = 33) (D4).
calculator_integer_first.fix=Colocar o campo Number como A, ou passar A para Number antes (Select values -> Metadados).
calculator_integer_first.fix.swap=Trocar A e B ({b} primeiro, {a} depois): o resultado é o mesmo, mas com decimais.
calculator_integer_first.fix.convert=Passar {a} para Number antes da Calculator (Select values -> Metadados), ou calculá-lo com Formula.
calculator_integer_first.msg=Em «{step}», {result} = {a} {op} {b}: {a} é Integer e {b} é {typeb}, então {b} é arredondado para inteiro antes do cálculo.
calculator_integer_first.msg.division=Em «{step}», {result} = {a} / {b} com os dois Integer: é uma divisão inteira (os decimais se perdem) embora o resultado seja {type}.

empty_decimal_symbol.title=Símbolo decimal vazio
empty_decimal_symbol.why=Um número lido de texto com o símbolo decimal vazio usa o separador do idioma da máquina: em espanhol 2.50 é lido como 250, ou falha (D3).
empty_decimal_symbol.fix=Definir o símbolo decimal do campo de forma explícita («.» ou «,», como vier no arquivo).
empty_decimal_symbol.msg=O campo {field} ({type}, formato {format}) de «{step}» tem o símbolo decimal vazio: como é lido depende do idioma da máquina (2.50 pode virar 250).
empty_decimal_symbol.msg.literal=O campo {field} ({type}) de «{step}» tem valores com separador ({example}) e o símbolo decimal vazio: como são lidos depende do idioma da máquina.

variable_in_constant.title=Variável numa constante
variable_in_constant.why=Add constants e Generate rows não resolvem variáveis: ${X} sai literal (D9).
variable_in_constant.fix=Usar um step Get variables para ler a variável num campo.
variable_in_constant.msg=O campo {field} de «{step}» tem o valor {value}: Add constants e Generate rows não substituem variáveis, sai literal.

text_output_without_fields.title=Text file output sem campos
text_output_without_fields.why=Sem campos declarados, os String que têm comprimento são preenchidos com espaços até esse tamanho (D8), e os comprimentos do SQLite podem esgotar a memória (C23).
text_output_without_fields.fix=Declarar os campos de saída (String com comprimento -1, números e datas com seu formato).
text_output_without_fields.msg=«{step}» não tem campos declarados e recebe String com comprimento ({fields}): são gravados preenchidos com espaços.
text_output_without_fields.msg.no_padding=«{step}» não tem campos declarados: hoje não preenche nada, mas o formato do arquivo depende do que chegar.
text_output_without_fields.msg.unknown=«{step}» não tem campos declarados e não foi possível calcular os que chegam: os String com comprimento seriam preenchidos com espaços.

# ---------------------------------------------------------------- caminhos
absolute_path.title=Caminho absoluto
absolute_path.why=Um caminho fixo (C:\\..., \\\\servidor\\..., /home/...) só funciona nesta máquina.
absolute_path.fix=Usar ${Internal.Entry.Current.Directory} e um caminho relativo ao arquivo.
absolute_path.fix.parameter=Usar um parâmetro {parameter} com padrão {default} e ${{parameter}} no caminho.
absolute_path.msg=Caminho absoluto em «{where}»: {value}. Só funciona nesta máquina.

relative_path.title=Caminho relativo sem variável
relative_path.why=Um caminho relativo é resolvido contra a pasta de onde o PDI roda, não contra a do .ktr/.kjb (C15).
relative_path.fix=Colocar ${Internal.Entry.Current.Directory}/ antes do caminho.
relative_path.msg=Caminho relativo em «{where}»: {value}. É resolvido contra a pasta do PDI, não a do arquivo.

job_variable_in_transformation.title=Variável de job numa transformação
job_variable_in_transformation.why=${Internal.Job.*} dentro de um .ktr pega o valor do job pai: com o Pan vale outra coisa (D11).
job_variable_in_transformation.fix=Usar ${Internal.Entry.Current.Directory} (atenção: muda o significado se o job que a chama estiver em outra pasta).
job_variable_in_transformation.msg=«{where}» usa uma variável de job numa transformação: {value}.

missing_input_file.title=Arquivo de entrada que não existe
missing_input_file.why=Um arquivo de entrada que não existe (depois de resolver as variáveis) faz a transformação falhar ou não ler nada. Depende desta máquina.
missing_input_file.fix=Corrigir o caminho ou colocar o arquivo lá.
missing_input_file.msg=«{step}» lê {file}, que não existe nesta máquina.

# ---------------------------------------------------------------- segurança
password_in_file.title=Senha guardada no arquivo
password_in_file.why=Uma senha em texto puro, ou «Encrypted ...» (ofuscação reversível), viaja dentro do .ktr/.kjb para quem receber o arquivo.
password_in_file.fix=Usar uma variável como ${DB_PASSWORD} e defini-la no kettle.properties (nunca no arquivo).
password_in_file.msg.plain=Senha em texto puro {where}: qualquer um com o arquivo pode lê-la.
password_in_file.msg.encrypted=Senha guardada {where}, «Encrypted» (uma ofuscação reversível, não uma criptografia).
# word.* em pt já levam a preposição contraída («na conexão», não «em a conexão»)
word.connection=na conexão «{name}»
word.slaveserver=no slave server «{name}»
word.step=no step «{name}»
word.entry=na entrada «{name}»
word.document=no documento

# ---------------------------------------------------------------- estilo
default_step_name.title=Nome de step padrão
default_step_name.why=Um nome padrão («Text file output 2») não diz o que o step faz: o diagrama não documenta nada.
default_step_name.fix=Dar a ele um nome que diga o que faz («Ler vendas», «Ordenar por produto»).
default_step_name.msg=O step «{step}» tem o nome padrão.

default_entry_name.title=Nome de entrada padrão
default_entry_name.why=Um nome padrão não diz o que a entrada faz.
default_entry_name.fix=Dar a ela um nome que diga o que faz.
default_entry_name.msg=A entrada «{entry}» tem o nome padrão.

no_description.title=Sem descrição
no_description.why=Sem descrição nem notas ninguém sabe para que serve o arquivo.
no_description.fix=Escrever uma descrição (ou uma nota na tela) com o que faz e do que precisa.
no_description.msg=O documento não tem descrição nem notas.

select_star.title=SELECT *
select_star.why=Com SELECT * os campos mudam quando a tabela muda, e os steps seguintes quebram.
select_star.fix=Nomear as colunas na consulta.
select_star.msg=O Table input «{step}» usa SELECT *.

undeclared_variable.title=Variável não declarada
undeclared_variable.why=Uma variável que não é parâmetro nem está no kettle.properties fica literal se ninguém a definir (C14). Depende desta máquina.
undeclared_variable.fix=Declará-la como parâmetro com um padrão, ou defini-la no kettle.properties.
undeclared_variable.msg=Usa-se ${{variable}} ({steps}), mas não é um parâmetro nem está definida aqui: se ninguém a definir, fica literal.

parameter_without_default.title=Parâmetro sem padrão
parameter_without_default.why=Um parâmetro sem valor padrão fica vazio quando o arquivo roda com Pan/Kitchen e ninguém o passa.
parameter_without_default.fix=Dar a ele um valor padrão.
parameter_without_default.msg=O parâmetro {parameter} não tem valor padrão.

# ---------------------------------------------------------------- não avaliados
ne.cycle=não avaliada: a transformação tem um ciclo (não é possível calcular os campos)
ne.cancelled=não avaliada: a análise foi cancelada ou ficou sem tempo
ne.fields=campos desconhecidos: {detail}
ne.fields_timeout=campos desconhecidos: calculá-los demorou demais ({detail}); não se calcularam mais campos
ne.fields_db_missing=campos desconhecidos: a conexão {connection} aponta para um arquivo de banco que não existe ({file}), e calcular os campos o criaria vazio
ne.check_db_missing=o Kettle não o verificou: a conexão {connection} aponta para um arquivo de banco que não existe ({file}), e a verificação do Spoon o criaria vazio
ne.no_file=não avaliada: o documento não tem arquivo (nunca foi salvo)
ne.unsaved=não avaliada: o documento tem alterações não salvas (o arquivo do disco não é o que se vê)
ne.read_failed=não avaliada: não foi possível ler o arquivo ({detail})
ne.error=a regra falhou: {detail}
ne.order_unknown=a ordem não é julgada estaticamente: {detail}
ne.order_key_later=a chave {key} é criada depois de «{at}»
ne.order_step=«{at}» ({type}) está no caminho: não se sabe em que ordem saem suas linhas
ne.order_depth=o fluxo é longo demais para segui-lo

# ---------------------------------------------------------------- modo profundo (LintSondas, WP3)
# Vai no fim da mensagem do achado, depois de "deep.prefix"; {value}, {example}, {read} vêm dos dados lidos.
deep.not_run=o modo profundo não está disponível aqui: só rodaram as regras estáticas
deep.not_run.job=o modo profundo só revisa transformações
deep.not_run.cycle=o modo profundo não rodou: a transformação tem um ciclo
deep.nothing=nada para revisar: não há achados de entrada sem ordenar nem de símbolo decimal vazio
deep.failed=o modo profundo falhou: {detail}
deep.prefix=Revisão profunda:
deep.ne.not_read_only=revisão profunda não feita: seria preciso rodar «{at}» ({type}) e não se sabe se só lê
deep.ne.budget=revisão profunda não feita: o modo profundo ficou sem tempo ({s} s; dá para aumentar deep_timeout_s)
deep.ne.cancelled=revisão profunda não feita: a análise foi cancelada
deep.ne.failed=a revisão profunda falhou: {detail}
deep.ne.no_step=revisão profunda não feita: não há um step «{at}»
deep.ne.no_key=revisão profunda não feita: a chave {key} não está entre os campos que «{at}» dá
deep.ne.no_field=revisão profunda não feita: o campo {field} não está em «{at}»
deep.ne.no_rows=revisão profunda: nenhuma linha veio de «{at}» (não há nada para julgar)
deep.ne.no_values=revisão profunda: «{at}» não deu valores em {field} (não há nada para julgar)
deep.why.failed=o Kettle falhou: {detail}
deep.why.row_limit=parou em {n} linhas
deep.why.timeout=parou depois de {s} s
deep.why.cancelled=foi cancelada
deep.why.as_is=como está, {why}
deep.why.sorted=com o Sort rows, {why}
deep.why.random=«{at}» ({type}) dá valores diferentes a cada execução
deep.why.no_sort=não é possível inserir o Sort rows ({detail})
deep.disorder.group=o grupo {value} aparece de novo na linha {row}
deep.disorder.order=a linha {row} {value} vem depois de {prev}
deep.order.disorder=as linhas que vêm de «{input}» não estão ordenadas ({detail})
deep.order.diff.rows=com um Sort rows antes, «{step}» dá {sorted_rows} linhas em vez de {rows}
deep.order.diff.values=com um Sort rows antes, «{step}» dá as mesmas {rows} linhas, mas com outros valores
deep.order.same=com um Sort rows antes, «{step}» dá as mesmas {rows} linhas: funciona por acaso
deep.order.same.nondet=com um Sort rows antes, «{step}» deu desta vez as mesmas {rows} linhas, mas a ordem das linhas pode mudar de uma execução para outra
deep.order.incomplete=não foi possível completar a comparação com um Sort rows ({why})
deep.order.sorted=as {n} linhas que vêm de «{input}» estão ordenadas por {keys} e a entrada foi lida inteira: com estes dados funciona, mas nada garante a ordem.
deep.order.sorted_cut=as primeiras {n} linhas que vêm de «{input}» estão ordenadas por {keys}, mas nem todas foram lidas ({why}).
deep.order.sorted_nondet=as {n} linhas lidas de «{input}» vieram ordenadas por {keys}, mas com várias cópias ou fluxos a ordem pode mudar de uma execução para outra.
deep.decimal.separators={with} dos {values} valores lidos têm separador (por exemplo {example})
deep.decimal.read_as=neste computador ({locale}) {example} é lido como {read}
deep.decimal.read_fails=neste computador ({locale}) a leitura falha: {error}
deep.decimal.suggest=Os dados usam «{symbol}» como símbolo decimal.
deep.decimal.integers=os {values} valores de {field} são inteiros e a entrada foi lida inteira: hoje o símbolo decimal não muda nada.
deep.decimal.integers_cut=os {values} valores lidos de {field} são inteiros, mas nem todos foram lidos ({why}).

