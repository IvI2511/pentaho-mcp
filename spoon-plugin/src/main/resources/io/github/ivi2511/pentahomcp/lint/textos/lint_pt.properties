name.write=Escrever {what}
name.insert_update=Inserir/atualizar {what}
name.update=Atualizar {what}
name.delete=Apagar de {what}
name.sort=Ordenar por {fields}
name.group=Agrupar por {fields}
name.totals=Totais
name.unique=Remover duplicados por {fields}
name.unique.all=Remover duplicados
name.filter=Filtrar por {fields}
name.lookup=Buscar por {fields}
name.join=Juntar por {fields}
name.compare=Comparar por {fields}
name.calculate=Calcular {fields}
name.add=Adicionar {fields}
name.generate=Gerar {n} linhas
name.select=Selecionar {fields}
name.remove=Remover {fields}
name.retype=Mudar tipo de {fields}
name.variables=Obter {fields}
