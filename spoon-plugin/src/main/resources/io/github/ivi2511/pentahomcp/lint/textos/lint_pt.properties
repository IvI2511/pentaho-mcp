placeholder_step.fix=Construa a parte: fill_placeholder troca o Dummy pelo step ou steps de verdade e mantém os hops (um Ctrl+Z), ou adicione você os steps e apague o Dummy.
placeholder_step.msg=O step «{step}» é um marcador do esboço: essa etapa do plano ainda não foi construída.

