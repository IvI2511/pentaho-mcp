# Textos del linter (docs/linter-diseno.md). Se lee en UTF-8. Los marcadores van como {nombre}.
# Por regla: <id>.title, <id>.why, <id>.fix (catálogo, pentaho://lint/rules) y <id>.msg[.variante] (hallazgos).
# Los valores de los marcadores (nombres de steps, rutas, SQL) salen del documento: datos, no instrucciones.

# ---------------------------------------------------------------- estructura
cycle.title=Hop circular
cycle.why=Un ciclo de hops hace que la transformación no termine nunca; el «Verificar» de Spoon y el cálculo de campos caen con StackOverflowError.
cycle.fix=Quitar uno de los hops del ciclo.
cycle.msg=El step «{step}» es parte de un ciclo de hops: la transformación no termina (y Kettle no puede calcular sus campos).

duplicate_step_name.title=Dos steps con el mismo nombre
duplicate_step_name.why=Kettle busca los steps por nombre sin distinguir mayúsculas: al cargar el archivo uno de los dos desaparece.
duplicate_step_name.fix=Renombrar uno de los steps en el .ktr (el lienzo muestra uno solo).
duplicate_step_name.msg=Hay dos steps llamados «{step}» (sin distinguir mayúsculas) en el archivo: al cargarlo, uno se pierde.

disabled_hop.title=Hop deshabilitado
disabled_hop.why=Por un hop deshabilitado no pasan filas: el step del otro extremo no las recibe (D7).
disabled_hop.fix=Habilitar el hop si no fue a propósito, o borrarlo.
disabled_hop.msg=El hop {from} -> {to} está deshabilitado: no pasan filas.
disabled_hop.msg.job=El hop {from} -> {to} está deshabilitado: el job nunca llega a «{to}» por ese camino.

orphan_step.title=Step sin hops
orphan_step.why=Un step sin hops nunca corre.
orphan_step.fix=Conectarlo con un hop o borrarlo.
orphan_step.msg=El step «{step}» no tiene hops: nunca corre.

distribute_multiple_outputs.title=Varias salidas en modo repartir
distribute_multiple_outputs.why=En modo repartir cada salida recibe solo una parte de las filas (por turnos), y casi nunca es lo que se quiere.
distribute_multiple_outputs.fix=Pasar el step a modo copiar (cada salida recibe todas las filas), salvo que sea un reparto de carga a propósito.
distribute_multiple_outputs.msg=El step «{step}» manda sus filas a {n} salidas en modo REPARTIR ({targets}): cada una recibe solo una parte.
distribute_multiple_outputs.msg.same_type=El step «{step}» reparte sus filas entre {n} salidas del mismo tipo ({targets}): bien si es un reparto de carga a propósito.

missing_plugin.title=Falta un plugin
missing_plugin.why=Un step o una entrada cuyo plugin no está instalado no puede correr.
missing_plugin.fix=Instalar el plugin (el tipo está en el mensaje) o reemplazar el step o la entrada.
missing_plugin.msg=«{name}» necesita un plugin que no está instalado (tipo {type}): no puede correr.

broken_hop.title=Hop roto
broken_hop.why=Un hop con un extremo que no existe rompe el flujo.
broken_hop.fix=Borrar el hop y dibujarlo de nuevo entre steps que existan.
broken_hop.msg=El hop {from} -> {to} tiene un extremo que no existe.

db_output_without_error_handling.title=Salida a base de datos sin manejo de errores
db_output_without_error_handling.why=Apagada por defecto: fallar entero es lo correcto por defecto; la piden el corrector y el modo clase.
db_output_without_error_handling.fix=Agregar un hop de error (manejo de errores del step) hacia un step que registre o guarde las filas rechazadas.
db_output_without_error_handling.msg=El step «{step}» escribe en una base de datos sin manejo de errores: una fila mala corta toda la transformación.

kettle_check.title=Verificación de Kettle
kettle_check.why=Lo que dice checkSteps/checkJobEntries (el «Verificar» de Spoon). No resta puntos: mezcla problemas de esta máquina (por ejemplo, una base de datos que no responde).
kettle_check.fix=Seguir el mensaje de Kettle; si es de una conexión, probarla con test_connection.

# ---------------------------------------------------------------- jobs
failure_branch_ends_in_success.title=La rama de error termina en Success
failure_branch_ends_in_success.why=Si la rama roja (de error) de un job termina en Success, Kitchen devuelve 0 aunque algo falló (D10).
failure_branch_ends_in_success.fix=Apuntar el hop rojo a una entrada Abort job en lugar de Success.
failure_branch_ends_in_success.msg=El hop de error {from} -> {to} termina en Success: si «{from}» falla, el job igual termina bien (Kitchen devuelve 0).
failure_branch_ends_in_success.msg.indirect=La rama de error de «{from}» llega a Success por hops incondicionales ({path}): si «{from}» falla, el job puede terminar bien igual.

start_not_named_start.title=Entrada START con otro nombre
start_not_named_start.why=Job.execute busca una entrada llamada START (con cualquier combinación de mayúsculas), copia 0 y dibujada: con otro nombre el job no arranca (C24).
start_not_named_start.fix=Renombrar la entrada a START.
start_not_named_start.msg=La entrada de inicio se llama «{entry}»: Kettle busca una llamada START, así que el job no arranca.

job_without_start.title=Job sin START
job_without_start.why=Un job sin entrada START no puede correr.
job_without_start.fix=Agregar una entrada START y conectarla con la primera entrada.
job_without_start.msg=El job no tiene entrada START: no puede correr.

orphan_entry.title=Entrada sin hops
orphan_entry.why=Una entrada dibujada sin hops nunca corre.
orphan_entry.fix=Conectarla con un hop o borrarla.
orphan_entry.msg=La entrada «{entry}» no tiene hops: nunca corre.

unreachable_entry.title=Entrada inalcanzable
unreachable_entry.why=Una entrada a la que no se llega desde START por hops habilitados nunca corre.
unreachable_entry.fix=Conectarla al flujo que sale de START, o habilitar el hop que lleva a ella.
unreachable_entry.msg=No se llega a la entrada «{entry}» desde START por hops habilitados: nunca corre.

job_entry_without_failure_hop.title=Entrada de transformación o job sin rama de error
job_entry_without_failure_hop.why=Apagada por defecto: sin hop rojo el job ya termina con error. La piden el modo clase y el corrector.
job_entry_without_failure_hop.fix=Agregar un hop rojo hacia un Abort o una entrada que avise.
job_entry_without_failure_hop.msg=La entrada «{entry}» no tiene rama de error.

# ---------------------------------------------------------------- orden
unsorted_input.title=Entrada sin ordenar por la clave
unsorted_input.why=Group by, Merge join, Unique rows, Merge rows, Row denormaliser, Analytic query y Sorted merge necesitan las filas ordenadas por su clave: si no, los grupos se parten o se pierden cruces, y la corrida igual termina bien (D5, D6).
unsorted_input.fix=Insertar un Sort rows por {keys} antes del step (o agregar ORDER BY a la consulta), salvo que los datos ya vengan ordenados así.
unsorted_input.msg.source=«{step}» necesita las filas ordenadas por {keys}, pero vienen de «{at}», que no las ordena: los grupos o los cruces pueden salir mal, salvo que el archivo ya venga ordenado por {keys}.
unsorted_input.msg.table=«{step}» necesita las filas ordenadas por {keys}, pero vienen del Table input «{at}», cuya consulta no tiene ORDER BY.
unsorted_input.msg.sql_keys=«{step}» necesita las filas ordenadas por {keys}, pero el ORDER BY de «{at}» ordena por {sortkeys}.
unsorted_input.msg.wrong_keys=«{step}» necesita las filas ordenadas por {keys}, pero «{at}» las ordena por {sortkeys}.
unsorted_input.msg.order=«{step}» compara las filas por {keys} en ese orden y ascendente, pero «{at}» ordena por {sortkeys} (otro orden de claves o descendente).
unsorted_input.msg.copies=«{step}» necesita las filas ordenadas por {keys}, pero «{at}» corre en {detail} copias: no se conserva el orden.
unsorted_input.msg.merges=«{step}» necesita las filas ordenadas por {keys}, pero «{at}» junta {detail} flujos: las filas se mezclan y se pierde el orden.
unsorted_input.msg.multi=«{step}» recibe filas de {n} hops: las filas se mezclan y no quedan ordenadas por {keys}.
unsorted_input.msg.data=«{step}» necesita las filas ordenadas por {keys}, y el Data grid «{at}» no lo está: {detail}.

# ---------------------------------------------------------------- valores
calculator_integer_first.title=Calculator: Integer primero, Number después
calculator_integer_first.why=Calculator elige la operación por el tipo del campo A: con A Integer, B se redondea (3 × 2,5 = 9). Integer/Integer es división entera aunque el resultado sea Number (101/3 = 33) (D4).
calculator_integer_first.fix=Poner el campo Number como A, o pasar A a Number antes (Select values -> Metadatos).
calculator_integer_first.fix.swap=Intercambiar A y B ({b} primero, {a} después): el resultado es el mismo pero con decimales.
calculator_integer_first.fix.convert=Pasar {a} a Number antes de la Calculator (Select values -> Metadatos), o calcularlo con Formula.
calculator_integer_first.msg=En «{step}», {result} = {a} {op} {b}: {a} es Integer y {b} es {typeb}, así que {b} se redondea a entero antes de calcular.
calculator_integer_first.msg.division=En «{step}», {result} = {a} / {b} con los dos Integer: es una división entera (se pierden los decimales) aunque el resultado sea {type}.

empty_decimal_symbol.title=Símbolo decimal vacío
empty_decimal_symbol.why=Un número leído de texto con el símbolo decimal vacío usa el separador del idioma de la máquina: en español 2.50 se lee 250, o falla (D3).
empty_decimal_symbol.fix=Poner el símbolo decimal del campo explícito («.» o «,», como venga en el archivo).
empty_decimal_symbol.msg=El campo {field} ({type}, formato {format}) de «{step}» tiene el símbolo decimal vacío: cómo se lee depende del idioma de la máquina (2.50 puede quedar 250).
empty_decimal_symbol.msg.literal=El campo {field} ({type}) de «{step}» tiene valores con separador ({example}) y el símbolo decimal vacío: cómo se leen depende del idioma de la máquina.

variable_in_constant.title=Variable en una constante
variable_in_constant.why=Add constants y Generate rows no resuelven variables: ${X} sale literal (D9).
variable_in_constant.fix=Usar un step Get variables para leer la variable en un campo.
variable_in_constant.msg=El campo {field} de «{step}» tiene el valor {value}: Add constants y Generate rows no reemplazan variables, sale literal.

text_output_without_fields.title=Text file output sin campos
text_output_without_fields.why=Sin campos declarados, los String que tienen longitud se rellenan con espacios hasta ese largo (D8), y las longitudes de SQLite pueden agotar la memoria (C23).
text_output_without_fields.fix=Declarar los campos de salida (String con longitud -1, números y fechas con su formato).
text_output_without_fields.msg=«{step}» no tiene campos declarados y recibe String con longitud ({fields}): se escriben rellenados con espacios.
text_output_without_fields.msg.no_padding=«{step}» no tiene campos declarados: hoy no rellena nada, pero el formato del archivo depende de lo que llegue.
text_output_without_fields.msg.unknown=«{step}» no tiene campos declarados y no se pudieron calcular los que llegan: los String con longitud se rellenarían con espacios.

# ---------------------------------------------------------------- rutas
absolute_path.title=Ruta absoluta
absolute_path.why=Una ruta fija (C:\\..., \\\\servidor\\..., /home/...) solo anda en esta máquina.
absolute_path.fix=Usar ${Internal.Entry.Current.Directory} y una ruta relativa al archivo.
absolute_path.fix.parameter=Usar un parámetro {parameter} con default {default} y ${{parameter}} en la ruta.
absolute_path.msg=Ruta absoluta en «{where}»: {value}. Solo anda en esta máquina.

relative_path.title=Ruta relativa sin variable
relative_path.why=Una ruta relativa se resuelve contra la carpeta desde la que corre PDI, no contra la del .ktr/.kjb (C15).
relative_path.fix=Anteponer ${Internal.Entry.Current.Directory}/ a la ruta.
relative_path.msg=Ruta relativa en «{where}»: {value}. Se resuelve contra la carpeta de PDI, no la del archivo.

job_variable_in_transformation.title=Variable de job en una transformación
job_variable_in_transformation.why=${Internal.Job.*} dentro de un .ktr toma el valor del job padre: con Pan vale otra cosa (D11).
job_variable_in_transformation.fix=Usar ${Internal.Entry.Current.Directory} (ojo: cambia el significado si el job que la llama está en otra carpeta).
job_variable_in_transformation.msg=«{where}» usa una variable de job en una transformación: {value}.

missing_input_file.title=Archivo de entrada que no existe
missing_input_file.why=Un archivo de entrada que no existe (tras resolver las variables) hace fallar la transformación o que no lea nada. Depende de esta máquina.
missing_input_file.fix=Corregir la ruta o poner el archivo ahí.
missing_input_file.msg=«{step}» lee {file}, que no existe en esta máquina.

# ---------------------------------------------------------------- seguridad
password_in_file.title=Contraseña guardada en el archivo
password_in_file.why=Una contraseña en claro, o «Encrypted ...» (ofuscación reversible), viaja dentro del .ktr/.kjb a quien reciba el archivo.
password_in_file.fix=Usar una variable como ${DB_PASSWORD} y definirla en kettle.properties (nunca en el archivo).
password_in_file.msg.plain=Contraseña en claro en {where}: cualquiera con el archivo la puede leer.
password_in_file.msg.encrypted=Contraseña guardada en {where}, «Encrypted» (una ofuscación reversible, no un cifrado).
word.connection=la conexión «{name}»
word.slaveserver=el slave server «{name}»
word.step=el step «{name}»
word.entry=la entrada «{name}»
word.document=el documento

# ---------------------------------------------------------------- estilo
default_step_name.title=Nombre de step por defecto
default_step_name.why=Un nombre por defecto («Text file output 2») no dice qué hace el step: el diagrama no documenta nada.
default_step_name.fix=Ponerle un nombre que diga qué hace («Leer ventas», «Ordenar por producto»).
default_step_name.msg=El step «{step}» tiene el nombre por defecto.

default_entry_name.title=Nombre de entrada por defecto
default_entry_name.why=Un nombre por defecto no dice qué hace la entrada.
default_entry_name.fix=Ponerle un nombre que diga qué hace.
default_entry_name.msg=La entrada «{entry}» tiene el nombre por defecto.

no_description.title=Sin descripción
no_description.why=Sin descripción ni notas nadie sabe para qué es el archivo.
no_description.fix=Escribir una descripción (o una nota en el lienzo) con qué hace y qué necesita.
no_description.msg=El documento no tiene descripción ni notas.

select_star.title=SELECT *
select_star.why=Con SELECT * los campos cambian cuando cambia la tabla, y se rompen los steps que siguen.
select_star.fix=Nombrar las columnas en la consulta.
select_star.msg=El Table input «{step}» usa SELECT *.

undeclared_variable.title=Variable sin declarar
undeclared_variable.why=Una variable que no es parámetro ni está en kettle.properties queda literal si nadie la define (C14). Depende de esta máquina.
undeclared_variable.fix=Declararla como parámetro con un default, o definirla en kettle.properties.
undeclared_variable.msg=Se usa ${{variable}} ({steps}) pero no es un parámetro ni está definida acá: si nadie la define, queda literal.

parameter_without_default.title=Parámetro sin default
parameter_without_default.why=Un parámetro sin default queda vacío cuando el archivo corre con Pan/Kitchen y nadie lo pasa.
parameter_without_default.fix=Darle un valor por defecto.
parameter_without_default.msg=El parámetro {parameter} no tiene valor por defecto.

# ---------------------------------------------------------------- no evaluados
ne.cycle=no evaluada: la transformación tiene un ciclo (no se pueden calcular los campos)
ne.cancelled=no evaluada: el análisis se canceló o se quedó sin tiempo
ne.fields=campos desconocidos: {detail}
ne.fields_timeout=campos desconocidos: calcularlos tardó demasiado ({detail}); no se calcularon más campos
ne.fields_db_missing=campos desconocidos: la conexión {connection} apunta a un archivo de base que no existe ({file}), y calcular los campos lo crearía vacío
ne.check_db_missing=Kettle no lo verificó: la conexión {connection} apunta a un archivo de base que no existe ({file}), y la verificación de Spoon lo crearía vacío
ne.no_file=no evaluada: el documento no tiene archivo (nunca se guardó)
ne.unsaved=no evaluada: el documento tiene cambios sin guardar (el archivo del disco no es lo que se ve)
ne.read_failed=no evaluada: no se pudo leer el archivo ({detail})
ne.error=la regla falló: {detail}
ne.order_unknown=el orden no se juzga estáticamente: {detail}
ne.order_key_later=la clave {key} se crea después de «{at}»
ne.order_step=«{at}» ({type}) está en el camino: no se sabe en qué orden salen sus filas
ne.order_depth=el flujo es demasiado largo para seguirlo

# ---------------------------------------------------------------- modo profundo (LintSondas, WP3)
# Va al final del mensaje del hallazgo, después de "deep.prefix"; {value}, {example}, {read} salen de los datos leídos.
deep.not_run=el modo profundo no está disponible aquí: solo corrieron las reglas estáticas
deep.not_run.job=el modo profundo solo revisa transformaciones
deep.not_run.cycle=el modo profundo no corrió: la transformación tiene un ciclo
deep.nothing=nada que revisar: no hay hallazgos de entrada sin ordenar ni de símbolo decimal vacío
deep.failed=el modo profundo falló: {detail}
deep.prefix=Revisión profunda:
deep.ne.not_read_only=revisión profunda no hecha: habría que correr «{at}» ({type}) y no se sabe si solo lee
deep.ne.budget=revisión profunda no hecha: el modo profundo se quedó sin tiempo ({s} s; se puede subir deep_timeout_s)
deep.ne.cancelled=revisión profunda no hecha: el análisis se canceló
deep.ne.failed=la revisión profunda falló: {detail}
deep.ne.no_step=revisión profunda no hecha: no hay un step «{at}»
deep.ne.no_key=revisión profunda no hecha: la clave {key} no está entre los campos que da «{at}»
deep.ne.no_field=revisión profunda no hecha: el campo {field} no está en «{at}»
deep.ne.no_rows=revisión profunda: no llegó ninguna fila desde «{at}» (no hay nada que juzgar)
deep.ne.no_values=revisión profunda: «{at}» no dio valores en {field} (no hay nada que juzgar)
deep.why.failed=Kettle falló: {detail}
deep.why.row_limit=se cortó en {n} filas
deep.why.timeout=se cortó a los {s} s
deep.why.cancelled=se canceló
deep.why.as_is=tal cual, {why}
deep.why.sorted=con el Sort rows, {why}
deep.why.random=«{at}» ({type}) da valores distintos en cada corrida
deep.why.no_sort=no se puede insertar el Sort rows ({detail})
deep.disorder.group=el grupo {value} vuelve a aparecer en la fila {row}
deep.disorder.order=la fila {row} {value} viene después de {prev}
deep.order.disorder=las filas que vienen de «{input}» no están ordenadas ({detail})
deep.order.diff.rows=con un Sort rows delante, «{step}» da {sorted_rows} filas en lugar de {rows}
deep.order.diff.values=con un Sort rows delante, «{step}» da las mismas {rows} filas, pero con otros valores
deep.order.same=con un Sort rows delante, «{step}» da las mismas {rows} filas: funciona por casualidad
deep.order.same.nondet=con un Sort rows delante, «{step}» dio esta vez las mismas {rows} filas, pero el orden de las filas puede cambiar de una corrida a otra
deep.order.incomplete=no se pudo completar la comparación con un Sort rows ({why})
deep.order.sorted=las {n} filas que vienen de «{input}» están ordenadas por {keys} y se leyó la entrada entera: con estos datos funciona, pero nada garantiza el orden.
deep.order.sorted_cut=las primeras {n} filas que vienen de «{input}» están ordenadas por {keys}, pero no se leyeron todas ({why}).
deep.order.sorted_nondet=las {n} filas leídas de «{input}» vinieron ordenadas por {keys}, pero con varias copias o flujos el orden puede cambiar de una corrida a otra.
deep.decimal.separators={with} de los {values} valores leídos tienen separador (por ejemplo {example})
deep.decimal.read_as=en esta máquina ({locale}) {example} se lee como {read}
deep.decimal.read_fails=en esta máquina ({locale}) leerlo falla: {error}
deep.decimal.suggest=Los datos usan «{symbol}» como símbolo decimal.
deep.decimal.integers=los {values} valores de {field} son enteros y se leyó la entrada entera: hoy el símbolo decimal no cambia nada.
deep.decimal.integers_cut=los {values} valores leídos de {field} son enteros, pero no se leyeron todos ({why}).

