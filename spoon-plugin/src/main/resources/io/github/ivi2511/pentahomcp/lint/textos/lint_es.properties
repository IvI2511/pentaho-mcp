placeholder_step.title=Marcador del boceto sin construir
placeholder_step.why=plan_build deja un step Dummy con una nota PENDIENTE por cada etapa del plano: pasa las filas sin tocarlas, así que esa pieza del ETL todavía no está hecha y no puede llegar a producción.
placeholder_step.fix=Construir la pieza: fill_placeholder cambia el Dummy por el step o los steps de verdad y conserva sus hops (un Ctrl+Z), o agrega tú los steps y borra el Dummy.
placeholder_step.msg=El step «{step}» es un marcador del boceto: esa etapa del plano está sin construir.

