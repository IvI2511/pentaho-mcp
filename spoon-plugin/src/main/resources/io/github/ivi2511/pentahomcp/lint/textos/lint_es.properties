# ---------------------------------------------------------------- robustez (apagadas por defecto; robustness=true)
# docs/robustez-diseno.md §3. Puntaje propio; evidence.recipe = la receta de harden_etl que arregla el hallazgo.

no_rejects_on_load.title=Carga a base de datos sin rechazos
no_rejects_on_load.why=Un texto más largo que la columna, un valor fuera de rango o una restricción incumplida paran toda la carga: las filas buenas que vienen después tampoco se cargan.
no_rejects_on_load.fix=harden_etl recipes=[{recipe}] steps=[{step}]: manejo de errores hacia un archivo de rechazos con motivo y campos_error (a mano: 09-robustez.md, R01).
no_rejects_on_load.msg=El step «{step}» carga la tabla {table} sin manejo de errores: una fila mala para toda la carga.
no_rejects_on_load.msg.sqlite=El step «{step}» carga la tabla {table} con Table output sobre SQLite, que no tiene manejo de errores: una fila mala para la carga. Usa Insert / update (ese sí lo tiene).
no_rejects_on_conversion.title=Conversión de tipos sin rechazos
no_rejects_on_conversion.why=Una fecha o un número mal escritos («31/02/2021», «mil») hacen fallar la conversión y la transformación se para, en vez de mandar esa fila a un archivo de rechazos con el mensaje de Kettle.
no_rejects_on_conversion.fix=harden_etl recipes=[{recipe}] steps=[{step}]: convertir sin modo permisivo y con un hop de error hacia los rechazos (a mano: 09-robustez.md, R01 y R04).
no_rejects_on_conversion.msg=El step «{step}» convierte {fields} sin manejo de errores: un valor mal escrito para la transformación.
no_rejects_on_conversion.msg.input=El step «{step}» lee {fields} con un tipo y no tiene manejo de errores: un valor mal escrito para la transformación. Léelos como String y conviértelos en un Select values con hop de error.
rejects_without_reason.title=Rechazos sin motivo
rejects_without_reason.why=Un archivo de rechazos que no dice por qué se rechazó cada fila no se puede corregir ni volver a cargar: nadie sabe qué arreglar.
rejects_without_reason.fix=harden_etl recipes=[reject_reason] steps=[{step}]: la descripción del error va a «motivo» y los campos a «campos_error»; en la rama falsa de un filtro, un User Defined Java Expression arma el motivo.
rejects_without_reason.msg=El manejo de errores de «{step}» manda sus filas a «{target}» sin la descripción del error: los rechazos no dicen por qué.
rejects_without_reason.msg.filter=Las filas que no pasan «{step}» las escribe «{target}» sin ninguna columna de motivo (motivo, reason, error…).
rejects_dead_end.title=Rechazos que no van a ninguna parte
rejects_dead_end.why=Las filas que van a un hop de error o a la rama falsa de un filtro que termina en un Dummy (o en un step que no escribe nada) se pierden sin rastro, justo lo que los rechazos tenían que evitar.
rejects_dead_end.fix=Termina la rama en un archivo de rechazos (Text file output con motivo), o declara el descarte a propósito con suppress_lint (09-robustez.md, archivos de rechazos).
rejects_dead_end.msg=Las filas que rechaza «{step}» terminan en «{target}», que no escribe nada: se pierden sin rastro.
silent_filter_drop.title=Filtro que descarta filas en silencio
silent_filter_drop.why=Un Filter rows sin rama falsa (o un Switch / case sin destino por defecto) tira las filas que no cumplen y nada las cuenta: la carga parece completa.
silent_filter_drop.fix=Manda la rama falsa a los rechazos con un motivo (harden_etl recipes=[reject_reason]) o, si descartarlas es lo que quieres, silencia esta regla en el step con el motivo: eso declara el descarte.
silent_filter_drop.msg=El filtro «{step}» no tiene rama falsa: las filas que no cumplen desaparecen sin rastro antes de la carga.
silent_filter_drop.msg.switch=El Switch / case «{step}» no tiene destino por defecto: las filas con un valor inesperado desaparecen sin rastro.
lookup_drops_rows.title=Búsqueda que descarta filas
lookup_drops_rows.why=Un Database lookup con «No pasar la fila si falla la búsqueda», o un Merge join INNER antes de una carga, quitan los huérfanos (una venta de un cliente desconocido) sin dejar rastro.
lookup_drops_rows.fix=harden_etl recipes=[orphans_to_rejects] steps=[{step}]: deja pasar la fila, comprueba la clave con un filtro y rechaza los huérfanos con su motivo (o usa el miembro Desconocido).
lookup_drops_rows.msg=El Database lookup «{step}» descarta la fila cuando no encuentra la clave: los huérfanos desaparecen sin rastro.
lookup_drops_rows.msg.merge_join=El Merge join «{step}» es INNER y alimenta una carga: las filas sin pareja desaparecen sin rastro.
unchecked_lookup.title=Resultado de búsqueda sin comprobar
unchecked_lookup.why=Una búsqueda sin valor por defecto devuelve nulo cuando no encuentra la clave, y el nulo sigue hasta la carga: una fila con la clave vacía, o un error de base de datos que lo para todo.
unchecked_lookup.fix=harden_etl recipes=[orphans_to_rejects] steps=[{step}]: un Filter rows «{field} IS NOT NULL» después de las búsquedas, con la rama falsa a los rechazos con el motivo (o un valor por defecto para el miembro Desconocido).
unchecked_lookup.msg=«{step}» devuelve {field} sin valor por defecto y llega a «{load}» sin ningún control de nulos: una clave que no se encuentra pasa a ser una clave vacía.
inner_join_in_source.title=INNER JOIN en la consulta de origen
inner_join_in_source.why=Un JOIN interno en el Table input quita las filas sin pareja antes de que el ETL las vea: esos huérfanos ni se cargan ni se rechazan, simplemente no aparecen.
inner_join_in_source.fix=Escribe la consulta con LEFT JOIN y rechaza, con su motivo, las filas cuya clave unida sea nula (09-robustez.md, R08).
inner_join_in_source.msg=La consulta de «{step}» usa un JOIN interno y alimenta una carga: las filas sin pareja se pierden antes de que el ETL las vea.
no_required_check.title=Sin control de campos obligatorios
no_required_check.why=Una línea cortada o una clave vacía en el archivo llegan a una carga o a una búsqueda por clave: se cargan con la clave nula, no encuentran nada o paran la carga.
no_required_check.fix=harden_etl recipes=[required_fields] steps=[{step}]: un Filter rows «IS NOT NULL» sobre los obligatorios justo después de la entrada, con la rama falsa a los rechazos con «Faltan campos obligatorios: …».
no_required_check.msg=Las filas de «{step}» llegan a «{target}» (claves: {keys}) sin ningún control de que los campos obligatorios estén.
lenient_conversion.title=Conversión permisiva
lenient_conversion.why=En modo permisivo, «31/02/2021» pasa a ser el 3 de marzo y «12abc» puede leerse como 12: la fila se carga mal y nada falla.
lenient_conversion.fix=harden_etl recipes=[strict_conversion] steps=[{step}]: sin modo permisivo y con hop de error, para que los valores mal escritos vayan a los rechazos con el mensaje de Kettle.
lenient_conversion.msg=El Select values «{step}» convierte {fields} en modo permisivo: los valores mal escritos se cargan mal sin ningún error.
fragile_split.title=Field splitter sobre datos de archivo
fragile_split.why=Un valor con menos o más partes de las declaradas (una dirección sin código postal) deja campos vacíos o corridos sin ningún error.
fragile_split.fix=Usa un Regex evaluation con un grupo de captura por campo y un campo de resultado, y rechaza con su motivo las filas que no encajan (09-robustez.md, R05).
fragile_split.msg=El Field splitter «{step}» divide {field}, que viene de un archivo, sin ningún control: un valor inesperado deja campos vacíos o corridos.
no_dedupe_before_load.title=Sin deduplicar antes de la carga
no_dedupe_before_load.why=La misma clave dos veces en el archivo (o en dos fuentes) se carga dos veces, o la segunda pisa a la primera en un Insert / update.
no_dedupe_before_load.fix=harden_etl recipes=[dedupe_before_load] steps=[{step}]: un Unique rows (HashSet) por la clave natural antes de la carga, declarado como descarte (o con los repetidos a los rechazos).
no_dedupe_before_load.msg=«{step}» carga filas que vienen de un archivo o de varias fuentes sin quitar antes los repetidos de {keys}.
no_dedupe_before_load.msg.nokeys=«{step}» carga filas que vienen de un archivo o de varias fuentes sin quitar antes los repetidos.
counter_as_surrogate_key.title=Contador como clave subrogada
counter_as_surrogate_key.why=Un Add sequence con contador vuelve a empezar en 1 en cada corrida: si cambia el orden o aparece una fila nueva, las claves cambian y los hechos ya cargados apuntan a otro miembro.
counter_as_surrogate_key.fix=harden_etl recipes=[stable_surrogate_keys] steps=[{step}]: busca la clave que ya existe y numera las nuevas desde max(clave) + n (o usa Dimension lookup / update).
counter_as_surrogate_key.msg=«{step}» numera {field} con un contador y lo carga «{load}»: las claves cambian de una corrida a otra.
insert_only_load.title=Carga que solo inserta
insert_only_load.why=Un Table output que no vacía la tabla vuelve a insertar las mismas filas en cada corrida: duplicados, o un error de clave primaria que para la carga.
insert_only_load.fix=harden_etl recipes=[idempotent_load] steps=[{step}]: Insert / update por la clave natural (o vaciar la tabla, si es de staging).
insert_only_load.msg=El Table output «{step}» inserta en {table} sin vaciarla: volver a correrlo duplica las filas.
fact_not_grouped.title=Carga de hechos sin agrupar por sus claves
fact_not_grouped.why=Dos filas con las mismas claves (dos líneas de la misma venta) se pisan en un Insert / update o chocan con la clave primaria: se pierden importes.
fact_not_grouped.fix=harden_etl recipes=[aggregate_to_grain] steps=[{step}]: un Memory group by {keys} con SUM de las medidas antes de la carga.
fact_not_grouped.msg=«{step}» carga por {keys} sin agrupar antes por esas claves: las filas con las mismas claves se pisan.
lookup_before_load_finishes.title=Búsqueda antes de que termine la carga
lookup_before_load_finishes.why=Todos los steps de una transformación arrancan a la vez: una búsqueda en una tabla que carga la misma transformación puede correr antes de que las filas estén, y entonces no encuentra las claves.
lookup_before_load_finishes.fix=harden_etl recipes=[wait_for_loads] steps=[{step}]: un Block until steps finish («{writer}») antes de la búsqueda; o carga la tabla en una transformación anterior del job.
lookup_before_load_finishes.msg=«{step}» lee {table}, que carga «{writer}» en esta misma transformación, sin esperar a que termine.
fixed_input_file.title=Archivo de entrada sin parámetro
fixed_input_file.why=Con el nombre del archivo escrito dentro del step no puedes correr el ETL con otro archivo (uno roto, para probarlo) sin editarlo.
fixed_input_file.fix=harden_etl recipes=[input_file_parameter] steps=[{step}]: un parámetro con el nombre del archivo (por defecto, el actual) usado en la ruta.
fixed_input_file.msg=La entrada «{step}» lee siempre {file}: no hay un parámetro para probarla con otro archivo.
