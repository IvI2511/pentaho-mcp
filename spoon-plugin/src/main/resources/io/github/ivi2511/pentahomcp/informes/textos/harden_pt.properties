# harden_etl: por quê, como fazer, avisos, motivos do que foi descartado e do que não foi aplicado e notas (argumento language).
# RobustecerAnalisis.java, RobustecerAplicar.java. Títulos das receitas do diálogo «Robustecer…» do menu IDC. UTF-8.
reason_no_error_handling_table=Um Table output não consegue mandar linhas para um hop de erro neste banco de dados (SQLite, por exemplo): use um Insert/Update (idempotent_load), que consegue
reason_no_error_handling=o step não aceita tratamento de erros
fields_unknown=campos desconhecidos: %s
fields_unknown_none=campos desconhecidos: nenhum campo chega ao step
why_rejects_load=Um erro do banco de dados em uma linha (texto longo demais, valor fora do intervalo, uma restrição) para a carga inteira.
why_rejects_convert=Uma linha que não pode ser convertida para a execução inteira.
warn_batch=Table output com atualizações em lote: com tratamento de erros o Kettle pode rejeitar o lote inteiro; defina use_batch=N se for preciso rejeitar linhas isoladas.
warn_transactional=A transformação é transacional (conexões únicas): em alguns bancos de dados uma linha que falha aborta a transação.
why_reject_reason=As suas linhas rejeitadas não levam motivo: ninguém consegue saber por que foram rejeitadas.
warn_add_fields=Acrescente %s aos campos de «%s» à mão.
why_required=Uma linha com %s vazio (ou cortada) chega à carga: é carregada com uma chave nula ou a interrompe. Em vez disso ela vai para o arquivo de rejeitos com a lista dos campos que faltam.
warn_required_detected=Campos obrigatórios deduzidos das chaves usadas mais adiante: corrija com required_fields={"%s": [...]} se for preciso.
not_a_field=%s (não é um campo da entrada)
howto_required_identifiers=O motivo é montado com uma User Defined Java Expression, que precisa de nomes de campo que sejam identificadores Java; estes não são: %s. Renomeie-os na entrada (ou use um Filter rows com IS NOT NULL e um Modified Java Script Value para o motivo).
howto_required_by_name=Insira o Filter rows à mão: «%s» manda as linhas por nome.
why_input_parameter=O arquivo de entrada é fixo: para testar a carga com um arquivo quebrado (ou com o de amanhã) é preciso editar a transformação. Com um parâmetro ela roda com outro arquivo sem ser alterada.
warn_parameter_undo=Os parâmetros ficam fora do desfazer do Spoon: Ctrl+Z restaura o nome do arquivo, mas o parâmetro fica.
why_strict=As conversões tolerantes deixam passar valores mal escritos sem erro (31/02 vira 3 de março, «12abc» pode ser lido como 12): a linha é carregada errada. No modo estrito ela é rejeitada com a mensagem do Kettle.
warn_strict_no_errors=Sem tratamento de erros, uma conversão estrita para a execução: %s
skip_dedupe_counter=a chave %s vem do contador «%s»: cada linha recebe uma nova, então remover repetidos por ela não remove nada. Passe keys={"%s": ["<chave de negócio>"]} para remover repetidos pela chave de negócio, e torne a chave estável (stable_surrogate_keys)
why_dedupe=Duas linhas com o mesmo %s chegam à carga: a segunda sobrescreve a primeira (ou quebra a chave). A primeira vence e as repetidas são descartadas (declarado).
howto_dedupe=Insira um Unique rows (HashSet) por %s logo antes de «%s» (ele recebe linhas de vários hops ou por nome).
skip_wait_deadlock=travaria: «%s» recebe as suas linhas através de «%s» (tudo bem quando a busca encontra as chaves existentes das linhas que estão sendo carregadas, como em stable_surrogate_keys)
why_wait=«%s» lê %s enquanto %s ainda a está gravando (no Kettle todos os steps começam ao mesmo tempo): algumas linhas podem ficar sem chaves que estão sendo carregadas.
howto_wait=Insira um Block until steps finish (esperando %s) logo antes de «%s».
warn_wait_shared=«%s» e a carga que ele espera recebem linhas da mesma fonte: antes da espera vai um Blocking step (todas as linhas, gravando em disco) para que a fonte nunca fique parada.
warn_eat_row=Defina eat_row_on_failure=N em «%s» à mão.
warn_inner_join=Se o SQL de origem une com um INNER JOIN, as órfãs somem antes deste filtro: troque por um LEFT JOIN (à mão).
why_split=Um valor com menos ou mais partes do que o esperado deixa nulos ou desloca as colunas.
howto_split=Troque o Field splitter por um Regex evaluation com um grupo de captura por campo (allowcapturegroups=Y) e um campo de resultado (<campo>_ok); um Filter rows sobre ele manda para os rejeitos as linhas que não batem com «formato inesperado de <campo>».
why_stable_keys=«%s» é um contador que começa em 1 a cada execução: rodar de novo (ou uma linha nova no meio) muda as chaves, e os fatos já carregados apontam para outro membro.
howto_stable_keys=Database lookup da chave existente pela chave natural -> Join rows com um Table input 'SELECT COALESCE(MAX(pk),0) AS max_pk FROM <dim>' -> Sequence 1..n -> Calculator pk_new = max_pk + n, pk = NVL(existente, pk_new) (remova os campos temporários) -> a carga (Insert/Update pela chave natural). Ou use Dimension lookup/update com uma chave técnica (padrão 04).
why_orphans_eat=Uma linha cuja chave não é encontrada some sem deixar rastro (eat_row_on_failure=Y).
why_orphans_null=Uma linha cuja chave não é encontrada chega a «%s» com uma chave nula.
howto_orphans=Depois da última busca: Filter rows «<fato> completo?» (IS NOT NULL nas chaves buscadas) -> falso: uma User Defined Java Expression com motivo = "a <chave natural> X não está em <tabela>" -> a fila de rejeitos. Defina eat_row_on_failure=N. Se o SQL de origem tem um INNER JOIN, troque por um LEFT JOIN para que as órfãs cheguem ao filtro. Ou um padrão 0 = um membro «desconhecido» que exista na dimensão.
why_idempotent=Rodar a carga de novo insere todas as linhas outra vez (duplicados, ou um erro de chave primária).
howto_idempotent=Troque por um Insert/Update com o mesmo nome, posição e hops: chaves = a chave natural (campos da entrada, não de uma sequência nem de uma busca); atualize todas as outras colunas menos a chave substituta (update=N). Para uma tabela de staging, use truncate=Y.
why_aggregate=Duas linhas com o mesmo %s se sobrescrevem no Insert/Update (a última vence).
howto_aggregate=Memory group by por %s logo antes, SUM das medidas (pergunte à pessoa: talvez MAX ou AVG), declarado com o atributo pentaho-live-robust/drops=aggregate.
skip_step_exists=não se aplica mais: já existe um step «%s» (chame harden_etl de novo)
skip_no_step=não se aplica mais: não existe o step «%s»
skip_no_hop=não se aplica mais: não existe o hop «%s» -> «%s»
skip_conflict=conflita com %s (as duas movem o hop «%s» -> «%s»): chame harden_etl de novo depois desta
skip_hop_exists=não se aplica mais: já existe um hop «%s» -> «%s»
skip_param_exists=não se aplica mais: o parâmetro %s já existe
apply_failed=falhou: %s (as mudanças feitas até aqui se desfazem com um Ctrl+Z)
note_parameter=O parâmetro %s não é desfeito com Ctrl+Z (o Spoon não desfaz parâmetros): remova-o nas configurações da transformação se for preciso.
recipe_rejects_on_error=Linhas ruins para um arquivo de rejeitos
recipe_reject_reason=Motivo em cada rejeito
recipe_required_fields=Campos obrigatórios
recipe_strict_conversion=Conversões estritas
recipe_safe_split=Divisão de campos segura
recipe_dedupe_before_load=Remover repetidos antes de carregar
recipe_stable_surrogate_keys=Chaves substitutas estáveis
recipe_orphans_to_rejects=Linhas órfãs para rejeitos
recipe_idempotent_load=Carga que pode ser repetida
recipe_aggregate_to_grain=Agregar ao grão do fato
recipe_wait_for_loads=Esperar as tabelas que estão sendo carregadas
recipe_input_file_parameter=Arquivo de entrada como parâmetro
recipe_default_optional=Padrões para os campos opcionais
recipe_job_guard=Proteções do job
