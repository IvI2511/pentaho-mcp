deep.not_run=the deep mode is not available here: only the static rules ran
deep.not_run.job=the deep mode only checks transformations
deep.not_run.cycle=the deep mode did not run: the transformation has a cycle
deep.nothing=nothing to check: there are no findings of unsorted input or of an empty decimal symbol
deep.failed=the deep mode failed: {detail}
deep.prefix=Deep check:
deep.ne.not_read_only=deep check not done: '{at}' ({type}) would have to run and it is not known to be read-only
deep.ne.budget=deep check not done: the deep mode ran out of time ({s} s; deep_timeout_s can be raised)
deep.ne.cancelled=deep check not done: the analysis was cancelled
deep.ne.failed=deep check failed: {detail}
deep.ne.no_step=deep check not done: there is no step '{at}'
deep.ne.no_key=deep check not done: key {key} is not among the fields that '{at}' gives
deep.ne.no_field=deep check not done: field {field} is not in '{at}'
deep.ne.no_rows=deep check: no rows came from '{at}' (nothing to judge)
deep.ne.no_values=deep check: '{at}' gave no values in {field} (nothing to judge)
deep.why.failed=Kettle failed: {detail}
deep.why.row_limit=it stopped at {n} rows
deep.why.timeout=it stopped after {s} s
deep.why.cancelled=it was cancelled
deep.why.as_is=as it is, {why}
deep.why.sorted=with the Sort rows, {why}
deep.why.random='{at}' ({type}) gives different values on every run
deep.why.no_sort=the Sort rows cannot be inserted ({detail})
deep.disorder.group=group {value} appears again at row {row}
deep.disorder.order=row {row} {value} comes after {prev}
deep.order.disorder=the rows from '{input}' are not sorted ({detail})
deep.order.diff.rows=with a Sort rows before it, '{step}' gives {sorted_rows} rows instead of {rows}
deep.order.diff.values=with a Sort rows before it, '{step}' gives the same number of rows ({rows}) but different values
deep.order.same=with a Sort rows before it, '{step}' gives the same {rows} rows: it works by chance
deep.order.same.nondet=with a Sort rows before it, '{step}' gave the same {rows} rows this time, but the order of the rows can change from one run to another
deep.order.incomplete=the comparison with a Sort rows could not be completed ({why})
deep.order.sorted=the {n} rows from '{input}' come sorted by {keys} and the whole input was read: with these data it works, but nothing guarantees the order.
deep.order.sorted_cut=the first {n} rows from '{input}' come sorted by {keys}, but not all of them were read ({why}).
deep.order.sorted_nondet=the {n} rows read from '{input}' came sorted by {keys}, but with several copies or streams the order can change from one run to another.
deep.decimal.separators={with} of the {values} values read have a separator (for example {example})
deep.decimal.read_as=on this computer ({locale}) {example} is read as {read}
deep.decimal.read_fails=on this computer ({locale}) reading it fails: {error}
deep.decimal.suggest=The data uses '{symbol}' as the decimal symbol.
deep.decimal.integers=the {values} values of {field} are integers and the whole input was read: today the decimal symbol changes nothing.
deep.decimal.integers_cut=the {values} values of {field} that were read are integers, but not all of them were read ({why}).

