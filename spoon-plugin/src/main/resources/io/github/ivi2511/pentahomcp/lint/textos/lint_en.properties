# ---------------------------------------------------------------- sketch mode (plan_build)
placeholder_step.title=Sketch placeholder still on the canvas
placeholder_step.why=plan_build left a Dummy step with a TO DO note for each stage of the plan: it passes the rows through unchanged, so this piece of the ETL is not built yet and must not reach production.
placeholder_step.fix=Build the piece: fill_placeholder replaces the Dummy with the real step(s) and keeps its hops (one Ctrl+Z), or add the steps yourself and delete the Dummy.
placeholder_step.msg=Step '{step}' is a placeholder of the sketch: this stage of the plan is not built yet.
