ne.cancelled=not evaluated: the analysis was cancelled or ran out of time
ne.fields=fields unknown: {detail}
ne.fields_timeout=fields unknown: computing them took too long ({detail}); no more fields were computed
ne.fields_db_missing=fields unknown: connection {connection} points to a database file that does not exist ({file}), and computing the fields would create it empty
ne.check_db_missing=not checked by Kettle: connection {connection} points to a database file that does not exist ({file}), and Spoon's Verify would create it empty
ne.no_file=not evaluated: the document has no file (it was never saved)
ne.unsaved=not evaluated: the document has unsaved changes (the file on disk is not what is shown)
ne.read_failed=not evaluated: the file could not be read ({detail})
ne.error=the rule failed: {detail}
ne.order_unknown=order not judged statically: {detail}
ne.order_key_later=key {key} is created after '{at}'
ne.order_step='{at}' ({type}) is in the way: its output order is not known
ne.order_depth=the flow is too long to follow

