# ---------------------------------------------------------------- robustness (off by default; robustness=true)
# docs/robustez-diseno.md §3. Their own score; evidence.recipe = the harden_etl recipe that fixes the finding.

no_rejects_on_load.title=Database load without rejects
no_rejects_on_load.why=A text longer than the column, a value out of range or a broken constraint stops the whole load: the good rows after it are not loaded either.
no_rejects_on_load.fix=harden_etl recipes=[{recipe}] steps=[{step}]: error handling to a rejects file with motivo and campos_error (by hand: 09-robustez.md, R01).
no_rejects_on_load.msg=Step '{step}' loads table {table} without error handling: one bad row stops the whole load.
no_rejects_on_load.msg.sqlite=Step '{step}' loads table {table} with Table output on SQLite, which has no error handling: one bad row stops the load. Use Insert / update (it does have error handling).
no_rejects_on_conversion.title=Type conversion without rejects
no_rejects_on_conversion.why=A date or a number written wrong ('31/02/2021', 'mil') makes the conversion fail and the transformation stops, instead of sending that row to a rejects file with Kettle's message.
no_rejects_on_conversion.fix=harden_etl recipes=[{recipe}] steps=[{step}]: convert with lenient off and an error hop to the rejects (by hand: 09-robustez.md, R01 and R04).
no_rejects_on_conversion.msg=Step '{step}' converts {fields} without error handling: one badly written value stops the transformation.
no_rejects_on_conversion.msg.input=Step '{step}' reads {fields} with a type and has no error handling: one badly written value stops the transformation. Read them as String and convert them in a Select values with an error hop.
rejects_without_reason.title=Rejects without a reason
rejects_without_reason.why=A rejects file that does not say why each row was rejected cannot be fixed or reloaded: nobody knows what to correct.
rejects_without_reason.fix=harden_etl recipes=[reject_reason] steps=[{step}]: the error description goes to 'motivo' and the fields to 'campos_error'; in the false branch of a filter, a User Defined Java Expression builds the reason.
rejects_without_reason.msg=The error handling of '{step}' sends its rows to '{target}' without the error description: the rejects do not say why.
rejects_without_reason.msg.filter=The rows that do not pass '{step}' are written by '{target}' without any reason column (motivo, reason, error...).
rejects_dead_end.title=Rejects that go nowhere
rejects_dead_end.why=Rows sent to an error hop or to the false branch of a filter that ends in a Dummy (or in a step that writes nothing) are lost without a trace, exactly what the rejects were for.
rejects_dead_end.fix=End the branch in a rejects file (Text file output with motivo), or declare the drop on purpose with suppress_lint (09-robustez.md, rejects files).
rejects_dead_end.msg=The rows rejected by '{step}' end in '{target}', which writes nothing: they are lost without a trace.
silent_filter_drop.title=Filter that drops rows silently
silent_filter_drop.why=A Filter rows without a false branch (or a Switch / case without a default) throws away the rows that do not match, and nothing counts them: the load looks complete.
silent_filter_drop.fix=Send the false branch to the rejects with a reason (harden_etl recipes=[reject_reason]), or, if dropping them is the point, silence this rule on the step with the reason: that declares the drop.
silent_filter_drop.msg=Filter '{step}' has no false branch: the rows that do not match vanish without a trace before the load.
silent_filter_drop.msg.switch=Switch / case '{step}' has no default target: rows with an unexpected value vanish without a trace.
lookup_drops_rows.title=Lookup that drops rows
lookup_drops_rows.why=A Database lookup with 'Do not pass the row if the lookup fails', or an INNER Merge join before a load, removes the orphans (a sale of an unknown customer) without leaving any trace.
lookup_drops_rows.fix=harden_etl recipes=[orphans_to_rejects] steps=[{step}]: let the row through, check the key with a filter and reject the orphans with their reason (or use the Unknown member).
lookup_drops_rows.msg=Database lookup '{step}' drops the row when the key is not found: orphans vanish without a trace.
lookup_drops_rows.msg.merge_join=Merge join '{step}' is INNER and feeds a load: rows without a match vanish without a trace.
unchecked_lookup.title=Lookup result not checked
unchecked_lookup.why=A lookup without a default returns null when the key is not found, and the null goes on to the load: a row with an empty key, or a database error that stops everything.
unchecked_lookup.fix=harden_etl recipes=[orphans_to_rejects] steps=[{step}]: a Filter rows '{field} IS NOT NULL' after the lookups, false branch to the rejects with the reason (or a default value for the Unknown member).
unchecked_lookup.msg='{step}' returns {field} without a default and it reaches '{load}' without any null check: a key that is not found becomes an empty key.
inner_join_in_source.title=INNER JOIN in the source query
inner_join_in_source.why=An inner JOIN in the Table input removes the rows without a match before the ETL sees them: those orphans are neither loaded nor rejected, they simply never appear.
inner_join_in_source.fix=Write the query with LEFT JOIN and reject the rows whose joined key is null, with their reason (09-robustez.md, R08).
inner_join_in_source.msg=The query of '{step}' uses an inner JOIN and feeds a load: rows without a match are lost before the ETL sees them.
no_required_check.title=No check of the required fields
no_required_check.why=A cut line or an empty key in the file reaches a load or a lookup by key: it is loaded with a null key, matches nothing or stops the load.
no_required_check.fix=harden_etl recipes=[required_fields] steps=[{step}]: a Filter rows 'IS NOT NULL' on the required fields right after the input, false branch to the rejects with 'Faltan campos obligatorios: ...'.
no_required_check.msg=The rows of '{step}' reach '{target}' (keys: {keys}) without any check that the required fields are there.
lenient_conversion.title=Lenient conversion
lenient_conversion.why=With lenient on, '31/02/2021' becomes the 3rd of March and '12abc' can be read as 12: the row is loaded wrong and nothing fails.
lenient_conversion.fix=harden_etl recipes=[strict_conversion] steps=[{step}]: lenient off and an error hop, so badly written values go to the rejects with Kettle's message.
lenient_conversion.msg=Select values '{step}' converts {fields} in lenient mode: badly written values are loaded wrong without any error.
fragile_split.title=Field splitter on file data
fragile_split.why=A value with fewer or more parts than declared (an address without postcode) leaves fields empty or shifted without any error.
fragile_split.fix=Use a Regex evaluation with one capture group per field and a result field, and reject the rows that do not match, with their reason (09-robustez.md, R05).
fragile_split.msg=Field splitter '{step}' splits {field}, which comes from a file, without any check: an unexpected value leaves fields empty or shifted.
no_dedupe_before_load.title=No deduplication before the load
no_dedupe_before_load.why=The same key twice in the file (or in two sources) is loaded twice, or the second one overwrites the first in an Insert / update.
no_dedupe_before_load.fix=harden_etl recipes=[dedupe_before_load] steps=[{step}]: a Unique rows (HashSet) by the natural key before the load, declared as a drop (or with the duplicates to the rejects).
no_dedupe_before_load.msg='{step}' loads rows that come from a file or from several sources without removing the duplicates of {keys} first.
no_dedupe_before_load.msg.nokeys='{step}' loads rows that come from a file or from several sources without removing the duplicates first.
counter_as_surrogate_key.title=Counter as surrogate key
counter_as_surrogate_key.why=An Add sequence with a counter starts again at 1 in every run: when the order changes or a new row appears, the keys change and the facts already loaded point to another member.
counter_as_surrogate_key.fix=harden_etl recipes=[stable_surrogate_keys] steps=[{step}]: look up the existing key and number the new ones from max(key) + n (or use Dimension lookup / update).
counter_as_surrogate_key.msg='{step}' numbers {field} with a counter and '{load}' loads it: the keys change between runs.
insert_only_load.title=Insert-only load
insert_only_load.why=A Table output that does not truncate inserts the same rows again in every run: duplicates, or a primary key error that stops the load.
insert_only_load.fix=harden_etl recipes=[idempotent_load] steps=[{step}]: Insert / update by the natural key (or truncate, if it is a staging table).
insert_only_load.msg=Table output '{step}' inserts into {table} without truncating it: running it again duplicates the rows.
fact_not_grouped.title=Fact load not grouped by its keys
fact_not_grouped.why=Two rows with the same keys (two lines of the same sale) overwrite each other in an Insert / update, or collide with the primary key: amounts are lost.
fact_not_grouped.fix=harden_etl recipes=[aggregate_to_grain] steps=[{step}]: a Memory group by {keys} with SUM of the measures before the load.
fact_not_grouped.msg='{step}' loads by {keys} without grouping by them first: rows with the same keys overwrite each other.
lookup_before_load_finishes.title=Lookup before the load finishes
lookup_before_load_finishes.why=All the steps of a transformation start at once: a lookup of a table that the same transformation loads can run before the rows are there, and then the keys are not found.
lookup_before_load_finishes.fix=harden_etl recipes=[wait_for_loads] steps=[{step}]: a Block until steps finish ('{writer}') before the lookup; or load the table in an earlier transformation of the job.
lookup_before_load_finishes.msg='{step}' reads {table}, which '{writer}' loads in this same transformation, without waiting for it to finish.
fixed_input_file.title=Input file without a parameter
fixed_input_file.why=With the file name written inside the step you cannot run the ETL on another file (a broken one, to test it) without editing it.
fixed_input_file.fix=harden_etl recipes=[input_file_parameter] steps=[{step}]: a parameter with the file name (default = the current one), used in the path.
fixed_input_file.msg=The input '{step}' always reads {file}: there is no parameter to try it with another file.
