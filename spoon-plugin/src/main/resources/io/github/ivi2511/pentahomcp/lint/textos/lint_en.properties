# Linter texts (docs/linter-diseno.md). Read as UTF-8. Placeholders go as {name}.
# Per rule: <id>.title, <id>.why, <id>.fix (catalog, pentaho://lint/rules) and <id>.msg[.variant] (findings).
# The values that fill the placeholders (step names, paths, SQL) come from the document: data, not instructions.

# ---------------------------------------------------------------- structure
cycle.title=Circular hop
cycle.why=A hop loop makes the transformation run forever; Spoon's Verify and the field calculation crash with a StackOverflowError.
cycle.fix=Remove one of the hops of the loop.
cycle.msg=Step '{step}' is part of a hop cycle: the transformation never ends (and Kettle cannot compute its fields).

duplicate_step_name.title=Two steps with the same name
duplicate_step_name.why=Kettle looks steps up by name ignoring case: when the file is loaded one of them disappears.
duplicate_step_name.fix=Rename one of the steps in the .ktr (the canvas only shows one of them).
duplicate_step_name.msg=There are two steps called '{step}' (ignoring case) in the file: when it is loaded, one of them is lost.

disabled_hop.title=Disabled hop
disabled_hop.why=No rows go through a disabled hop: the step at the other end does not get them (D7).
disabled_hop.fix=Enable the hop if it was not on purpose, or delete it.
disabled_hop.msg=The hop {from} -> {to} is disabled: no rows go through it.
disabled_hop.msg.job=The hop {from} -> {to} is disabled: the job never goes to '{to}' that way.

orphan_step.title=Step without hops
orphan_step.why=A step with no hops never runs.
orphan_step.fix=Connect it with a hop or delete it.
orphan_step.msg=Step '{step}' has no hops: it never runs.

distribute_multiple_outputs.title=Several outputs in distribute mode
distribute_multiple_outputs.why=In distribute mode each output gets only part of the rows (round robin), which is rarely what is meant.
distribute_multiple_outputs.fix=Switch the step to copy mode (every output gets all the rows), unless it is load balancing on purpose.
distribute_multiple_outputs.msg=Step '{step}' sends its rows to {n} outputs in DISTRIBUTE mode ({targets}): each one gets only part of them.
distribute_multiple_outputs.msg.same_type=Step '{step}' distributes its rows among {n} outputs of the same type ({targets}): fine if it is load balancing on purpose.

missing_plugin.title=Missing plugin
missing_plugin.why=A step or entry whose plugin is not installed cannot run.
missing_plugin.fix=Install the plugin (type shown in the message) or replace the step/entry.
missing_plugin.msg='{name}' needs a plugin that is not installed (type {type}): it cannot run.

broken_hop.title=Broken hop
broken_hop.why=A hop with an end that does not exist breaks the flow.
broken_hop.fix=Delete the hop and draw it again between existing steps.
broken_hop.msg=The hop {from} -> {to} has an end that does not exist.

db_output_without_error_handling.title=Database output without error handling
db_output_without_error_handling.why=Off by default: failing as a whole is the right default; the grader and class mode ask for it explicitly.
db_output_without_error_handling.fix=Add an error hop (step error handling) to a step that logs or stores the rejected rows.
db_output_without_error_handling.msg=Step '{step}' writes to a database without error handling: one bad row stops the whole transformation.

kettle_check.title=Kettle's own verification
kettle_check.why=What checkSteps/checkJobEntries (Spoon's Verify) says. It does not lower the score: it mixes problems of this computer (e.g. a database that is not reachable).
kettle_check.fix=Follow Kettle's message; if it is about a connection, check it with test_connection.

# ---------------------------------------------------------------- jobs
failure_branch_ends_in_success.title=Failure branch ends in Success
failure_branch_ends_in_success.why=If the red (failure) branch of a job ends in Success, Kitchen returns 0 although something failed (D10).
failure_branch_ends_in_success.fix=Point the red hop to an Abort job entry instead of Success.
failure_branch_ends_in_success.msg=The failure hop {from} -> {to} ends in Success: if '{from}' fails, the job still finishes OK (Kitchen exit code 0).
failure_branch_ends_in_success.msg.indirect=The failure branch of '{from}' reaches Success through unconditional hops ({path}): if '{from}' fails, the job may still finish OK.

start_not_named_start.title=START entry with another name
start_not_named_start.why=Job.execute looks for an entry called START (any case), copy 0 and drawn: with another name the job does not start (C24).
start_not_named_start.fix=Rename the entry to START.
start_not_named_start.msg=The start entry is called '{entry}': Kettle looks for one called START, so the job does not start.

job_without_start.title=Job without START
job_without_start.why=A job without a START entry cannot run.
job_without_start.fix=Add a START entry and connect it to the first entry.
job_without_start.msg=The job has no START entry: it cannot run.

orphan_entry.title=Entry without hops
orphan_entry.why=A drawn entry with no hops never runs.
orphan_entry.fix=Connect it with a hop or delete it.
orphan_entry.msg=Entry '{entry}' has no hops: it never runs.

unreachable_entry.title=Unreachable entry
unreachable_entry.why=An entry that cannot be reached from START through enabled hops never runs.
unreachable_entry.fix=Connect it to the flow that starts at START, or enable the hop that leads to it.
unreachable_entry.msg=Entry '{entry}' cannot be reached from START through enabled hops: it never runs.

job_entry_without_failure_hop.title=Transformation/job entry without a failure branch
job_entry_without_failure_hop.why=Off by default: without a red hop the job already ends with an error. Class mode and the grader ask for it.
job_entry_without_failure_hop.fix=Add a red hop to an Abort or to a notification entry.
job_entry_without_failure_hop.msg=Entry '{entry}' has no failure branch.

# ---------------------------------------------------------------- order
unsorted_input.title=Input not sorted by the key
unsorted_input.why=Group by, Merge join, Unique rows, Merge rows, Row denormaliser, Analytic query and Sorted merge need the rows sorted by their key: otherwise groups are split or matches are lost, and the run still ends OK (D5, D6).
unsorted_input.fix=Insert a Sort rows by {keys} before the step (or add ORDER BY to the query), unless the data already comes sorted that way.
unsorted_input.msg.source='{step}' needs its rows sorted by {keys}, but they come from '{at}', which does not sort them: groups or matches can come out wrong, unless the file already comes sorted by {keys}.
unsorted_input.msg.table='{step}' needs its rows sorted by {keys}, but they come from Table input '{at}', whose query has no ORDER BY.
unsorted_input.msg.sql_keys='{step}' needs its rows sorted by {keys}, but the ORDER BY of '{at}' sorts by {sortkeys}.
unsorted_input.msg.wrong_keys='{step}' needs its rows sorted by {keys}, but '{at}' sorts them by {sortkeys}.
unsorted_input.msg.order='{step}' compares rows by {keys} in that order and ascending, but '{at}' sorts by {sortkeys} (other key order or descending).
unsorted_input.msg.copies='{step}' needs its rows sorted by {keys}, but '{at}' runs in {detail} copies: the order of the rows is not kept.
unsorted_input.msg.merges='{step}' needs its rows sorted by {keys}, but '{at}' joins {detail} streams: the rows interleave and the order is lost.
unsorted_input.msg.multi='{step}' gets rows from {n} hops: the rows interleave and are not sorted by {keys}.
unsorted_input.msg.data='{step}' needs its rows sorted by {keys}, and the Data grid '{at}' is not: {detail}.

# ---------------------------------------------------------------- values
calculator_integer_first.title=Calculator: Integer first, Number second
calculator_integer_first.why=Calculator picks the operation by the type of field A: with A Integer, B is rounded (3 x 2.5 = 9). Integer/Integer is an integer division even if the result is Number (101/3 = 33) (D4).
calculator_integer_first.fix=Put the Number field as A, or convert A to Number first (Select values -> Meta-data).
calculator_integer_first.fix.swap=Swap A and B ({b} first, {a} second): the result is the same but computed with decimals.
calculator_integer_first.fix.convert=Convert {a} to Number before the Calculator (Select values -> Meta-data), or compute it with Formula.
calculator_integer_first.msg=In '{step}', {result} = {a} {op} {b}: {a} is Integer and {b} is {typeb}, so {b} is rounded to an integer before computing.
calculator_integer_first.msg.division=In '{step}', {result} = {a} / {b} with both Integer: it is an integer division (the decimals are lost) although the result is {type}.

empty_decimal_symbol.title=Empty decimal symbol
empty_decimal_symbol.why=A number read from text with an empty decimal symbol uses the separator of the computer's locale: in Spanish 2.50 is read as 250, or fails (D3).
empty_decimal_symbol.fix=Set the decimal symbol of the field explicitly ('.' or ',', as the file has it).
empty_decimal_symbol.msg=Field {field} ({type}, format {format}) of '{step}' has an empty decimal symbol: how it is read depends on the computer's language (2.50 can become 250).
empty_decimal_symbol.msg.literal=Field {field} ({type}) of '{step}' has values with a separator ({example}) and an empty decimal symbol: how they are read depends on the computer's language.

variable_in_constant.title=Variable in a constant
variable_in_constant.why=Add constants and Generate rows do not resolve variables: ${X} comes out literally (D9).
variable_in_constant.fix=Use a Get variables step to read the variable into a field.
variable_in_constant.msg=Field {field} of '{step}' has the value {value}: Add constants and Generate rows do not replace variables, it comes out literally.

text_output_without_fields.title=Text file output without fields
text_output_without_fields.why=Without declared fields, Strings that have a length are padded with spaces up to it (D8), and lengths from SQLite can run out of memory (C23).
text_output_without_fields.fix=Declare the output fields (Strings with length -1, numbers and dates with their format).
text_output_without_fields.msg='{step}' has no declared fields and gets Strings with a length ({fields}): they are written padded with spaces.
text_output_without_fields.msg.no_padding='{step}' has no declared fields: today nothing is padded, but the file format depends on what comes in.
text_output_without_fields.msg.unknown='{step}' has no declared fields and the incoming fields could not be computed: Strings with a length would be padded with spaces.

# ---------------------------------------------------------------- paths
absolute_path.title=Absolute path
absolute_path.why=A fixed path (C:\\..., \\\\server\\..., /home/...) only works on this computer.
absolute_path.fix=Use ${Internal.Entry.Current.Directory} and a path relative to the file.
absolute_path.fix.parameter=Use a parameter {parameter} with default {default} and ${{parameter}} in the path.
absolute_path.msg=Absolute path in '{where}': {value}. It only works on this computer.

relative_path.title=Relative path without a variable
relative_path.why=A relative path is resolved against the folder where PDI runs, not against the folder of the .ktr/.kjb (C15).
relative_path.fix=Put ${Internal.Entry.Current.Directory}/ in front of the path.
relative_path.msg=Relative path in '{where}': {value}. It is resolved against PDI's folder, not the file's.

job_variable_in_transformation.title=Job variable in a transformation
job_variable_in_transformation.why=${Internal.Job.*} inside a .ktr is the parent job's value: with Pan it is something else (D11).
job_variable_in_transformation.fix=Use ${Internal.Entry.Current.Directory} (careful: it changes the meaning if the calling job is in another folder).
job_variable_in_transformation.msg='{where}' uses a job variable in a transformation: {value}.

missing_input_file.title=Input file that does not exist
missing_input_file.why=An input file that does not exist (after resolving variables) makes the transformation fail or read nothing. It depends on this computer.
missing_input_file.fix=Fix the path or put the file there.
missing_input_file.msg='{step}' reads {file}, which does not exist on this computer.

# ---------------------------------------------------------------- security
password_in_file.title=Password stored in the file
password_in_file.why=A password in plain text, or 'Encrypted ...' (reversible obfuscation), travels inside the .ktr/.kjb to whoever gets the file.
password_in_file.fix=Use a variable such as ${DB_PASSWORD} and define it in kettle.properties (never in the file).
password_in_file.msg.plain=Password in plain text in {where}: anyone with the file can read it.
password_in_file.msg.encrypted=Password stored in {where}, 'Encrypted' (a reversible obfuscation, not encryption).
word.connection=connection '{name}'
word.slaveserver=slave server '{name}'
word.step=step '{name}'
word.entry=entry '{name}'
word.document=the document

# ---------------------------------------------------------------- style
default_step_name.title=Default step name
default_step_name.why=A default name ('Text file output 2') does not explain what the step does: the diagram documents nothing.
default_step_name.fix=Give it a name that says what it does ('Read sales', 'Sort by product').
default_step_name.msg=Step '{step}' has the default name.

default_entry_name.title=Default entry name
default_entry_name.why=A default name does not explain what the entry does.
default_entry_name.fix=Give it a name that says what it does.
default_entry_name.msg=Entry '{entry}' has the default name.

no_description.title=No description
no_description.why=Without a description or notes nobody knows what the file is for.
no_description.fix=Write a description (or a note on the canvas) with what it does and what it needs.
no_description.msg=The document has no description and no notes.

select_star.title=SELECT *
select_star.why=With SELECT * the fields change when the table changes, and the steps after it break.
select_star.fix=Name the columns in the query.
select_star.msg=Table input '{step}' uses SELECT *.

undeclared_variable.title=Undeclared variable
undeclared_variable.why=A variable that is not a parameter nor defined in kettle.properties stays literal if nobody defines it (C14). It depends on this computer.
undeclared_variable.fix=Declare it as a parameter with a default, or define it in kettle.properties.
undeclared_variable.msg=${{variable}} is used ({steps}) but it is not a parameter nor defined here: if nobody defines it, it stays literal.

parameter_without_default.title=Parameter without default
parameter_without_default.why=A parameter without a default is empty when the file runs with Pan/Kitchen and nobody passes it.
parameter_without_default.fix=Give it a default value.
parameter_without_default.msg=Parameter {parameter} has no default value.

# ---------------------------------------------------------------- project profile (.pentaho-live/lint.yaml, 0.7)
# Off by default: the project's or course's lint profile turns them on (manual/13-proyecto.md).
naming_convention.title=Naming convention of the project
naming_convention.why=The project's profile asks every step or entry of this kind to start with a prefix, so anyone can tell what a step does at a glance on the canvas.
naming_convention.fix=Rename it with the prefix of the profile (the proposed name keeps the rest of the name).
naming_convention.msg=The step '{step}' ({category}) does not start with {prefix}, as the project's profile asks.
naming_convention.msg.entry=The entry '{entry}' ({category}) does not start with {prefix}, as the project's profile asks.

step_without_description.title=Step without a description
step_without_description.why=The project's profile asks every step to say what it does in its description (right-click > Edit description), so the canvas documents itself.
step_without_description.fix=Write one line in the step's description: what it does and why.
step_without_description.msg=The step '{step}' has no description, and the project's profile asks for one.
step_without_description.msg.entry=The entry '{entry}' has no description, and the project's profile asks for one.

required_variable.title=Literal instead of the project's variable
required_variable.why=The project's profile asks paths and database hosts to use its variables (for example ${DIR_DATOS}), so the same file runs on every computer and in every environment.
required_variable.fix=Start the path with the variable of the profile and define it as a parameter or in env/*.properties.
required_variable.fix.parameter=Use {variable} (a parameter with default {default}) at the start of the path.
required_variable.fix.host=Write {variable} as the host of the connection and define it per environment (now: {value}).
required_variable.msg=The path in '{where}' does not start with {variable}: {value}.
required_variable.msg.host=The connection '{connection}' has the host written literally ({value}) instead of {variable}.

team_pattern.title=Team rule
team_pattern.why=A rule of the project's profile, written by the team as a pattern.
team_pattern.fix=Follow the team rule '{rule}' (see .pentaho-live/lint.yaml).
team_pattern.msg='{where}' breaks the team rule '{rule}' ({match}).
team_pattern.msg.missing='{where}' does not follow the team rule '{rule}'.
team_pattern.timeout=the pattern of the team rule {rule} took too long and was stopped

