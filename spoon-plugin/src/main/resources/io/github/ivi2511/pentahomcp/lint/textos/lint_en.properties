name.group=Group by {fields}
name.totals=Totals
name.unique=Remove duplicates by {fields}
name.unique.all=Remove duplicates
name.filter=Filter by {fields}
name.lookup=Look up by {fields}
name.join=Join by {fields}
name.compare=Compare by {fields}
name.calculate=Calculate {fields}
name.add=Add {fields}
name.generate=Generate {n} rows
name.select=Select {fields}
name.remove=Remove {fields}
name.retype=Change type of {fields}
name.variables=Get {fields}
name.split=Split {fields}
name.map=Map {fields}
name.switch=Switch on {fields}
