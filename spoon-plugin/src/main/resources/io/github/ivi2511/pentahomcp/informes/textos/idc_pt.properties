howto_cycle=1. Encontre o hop que fecha o círculo (o apontado começa em «%s»).%n2. Clique com o botão direito nele > Apagar hop (ou desabilite-o).%n3. Se precisar mesmo devolver linhas, use um step que faça isso direito (um Append ou um mapping), não um hop circular.
howto_duplicate_step_name=1. Feche a transformação sem salvar se o Spoon a abriu com um step a menos.%n2. Abra o .ktr num editor de texto e procure os dois <step> com <name>%s</name>.%n3. Renomeie um deles (e seus <from>/<to> em <order>), salve e abra de novo no Spoon.
howto_missing_plugin=1. Veja o tipo do step «%s» na mensagem.%n2. Instale esse plugin na pasta plugins do PDI (ou pelo Marketplace) e reinicie o Spoon.%n3. Se não for usá-lo, substitua-o por um step equivalente que você tenha.
howto_broken_hop=1. O hop «%s» aponta para um step que não existe.%n2. Clique com o botão direito nele e apague-o.%n3. Desenhe o hop de novo entre steps que existam.
howto_kettle_check=1. Leia a mensagem do Kettle (é a verificação do Spoon: Ação > Verificar).%n2. Se for de uma conexão, teste-a (botão direito na conexão > Testar).%n3. Corrija o step «%s» como ela diz.
howto_job_without_start=1. Arraste uma entrada START de General para o canvas do job.%n2. Desenhe um hop do START até a primeira entrada que deve rodar.%n3. Salve e valide o job.
howto_unreachable_entry=1. A entrada «%s» não é alcançada a partir do START.%n2. Conecte-a com um hop a partir da entrada anterior, ou habilite o hop desabilitado que leva a ela.%n3. Se sobrar, apague-a.
howto_job_entry_without_failure_hop=1. A partir da entrada «%s», desenhe um hop até uma entrada Abort job (ou uma que avise, como Mail).%n2. Clique no hop até ele ficar vermelho (é seguido quando a entrada falha).%n3. Salve o job.
howto_variable_in_constant=1. Um step Add constants não substitui variáveis: o campo de «%s» leva o texto ${...} tal como está.%n2. Tire esse campo do Add constants.%n3. Adicione logo depois um step Get variables, com um campo do mesmo nome e tipo cuja variável seja a ${...}.%n4. Rode uma prévia para conferir o valor.
howto_missing_input_file=1. O step «%s» lê um arquivo que não existe nesse caminho.%n2. Copie o arquivo para lá, ou abra o step e corrija o caminho (melhor com ${Internal.Entry.Current.Directory}/...).%n3. Clique em «Mostrar nomes de arquivo» no step para conferir.
howto_select_star=1. Abra o Table input «%s».%n2. Troque SELECT * pela lista de colunas que você usa (pode clicar em «Obter instrução SQL» e escolher as colunas).%n3. Prévia para conferir que saem as mesmas colunas.
howto_fragile_split=1. Troque o Field splitter de «%s» por um Regex evaluation com um grupo de captura por campo (Criar campos para grupos de captura = Sim) e um campo de resultado.%n2. Ponha um Filter rows sobre o campo de resultado: as linhas que não encaixam vão para as rejeições com «formato inesperado».%n3. Teste com dados sujos para conferir.
howto_counter_as_surrogate_key=1. Antes de «%s», busque a chave que já existe (Database lookup pela chave natural).%n2. Para as novas: Join rows com um Table input «SELECT COALESCE(MAX(pk),0) AS max_pk FROM <dimensão>», uma sequência 1..n e um Calculator pk = max_pk + n.%n3. Ou use Dimension lookup/update, que faz isso sozinho.
howto_insert_only_load=1. Troque «%s» por um Insert / update com o mesmo nome e hops.%n2. Chaves: a chave natural (campos da entrada); atualize as demais colunas menos a chave substituta.%n3. Para uma tabela de staging, basta marcar Truncar tabela.
howto_fact_not_grouped=1. Logo antes de «%s», insira um Memory group by pelas chaves do fato.%n2. Some as medidas (ou MAX/AVG, conforme o que significam).%n3. Execute e confira que as linhas não se sobrescrevem mais na carga.
howto_inner_join_in_source=1. Abra a consulta de «%s» e troque o INNER JOIN (JOIN) por LEFT JOIN.%n2. Depois da consulta, um Filter rows com a chave unida IS NOT NULL.%n3. O ramo falso vai para as rejeições com um motivo («a chave X não está na tabela Y»).
howto_rejects_dead_end=1. O ramo de rejeição de «%s» termina sem escrever nada.%n2. Adicione no fim um Text file output de rejeições com o campo motivo.%n3. Ou, se descartar essas linhas é o que você quer, silencie esta regra no step com o motivo.
d_score_after_unsaved=Pontuação: %d → %d (aproximada: com mudanças não salvas, as senhas e os nomes repetidos são julgados na memória até você salvar)
