d_prompt_lint=Tenho a transformação «%1$s» aberta no Spoon. A revisão de qualidade do Pentaho Live (lint_etl) dá este achado, que não se corrige sozinho:%n%n- Regra: %2$s (%3$s)%n- Onde: %4$s%n- O que acontece: %5$s%n- Como corrigir segundo a regra: %6$s%n- Key: %7$s%n%nCorrija com as ferramentas do Pentaho Live (lint_etl, apply_lint_fixes, harden_etl, as de edição de steps): primeiro me diga o que vai mudar e espere a minha confirmação; depois aplique, valide e revise de novo com lint_etl.
d_prompt_harden=Tenho a transformação «%1$s» aberta no Spoon. Robustecer (harden_etl) propõe esta receita, que não se aplica sozinha:%n%n- Receita: %2$s (%3$s)%n- Step: %4$s%n- Por quê: %5$s%n- Como fazer: %6$s%n- Key: %7$s%n%nFaça com as ferramentas do Pentaho Live: primeiro me diga o que vai mudar e espere a minha confirmação; depois aplique, valide e revise de novo com lint_etl robustness=true.
