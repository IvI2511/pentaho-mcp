r_stress_tip=Gera variantes quebradas dos arquivos de entrada (campos vazios, datas e números ruins, duplicados, arquivo vazio…) e roda uma CÓPIA da transformação em uma JVM separada: verifica que não aborta, que nenhuma linha se perde e que cada rejeito tem o seu motivo. Os arquivos originais não são tocados.
