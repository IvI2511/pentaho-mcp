q_deep_tip=Lê até 5000 linhas das fontes para confirmar a ordem e os decimais. Só executa os steps que se sabe serem somente leitura (um Table input só com um SELECT ou WITH simples e sem SQL ao conectar); senão o achado fica como não avaliado. Não grava tabelas de log. Leva no máximo 60 s.
