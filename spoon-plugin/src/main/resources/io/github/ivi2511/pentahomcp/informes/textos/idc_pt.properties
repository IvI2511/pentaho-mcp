lesson_none=Esta transformação não tem nenhuma lição carregada.%n%nPara começar uma, peça ao Claude com o Spoon aberto, por exemplo: «Me dê uma aula de 5 passos sobre como filtrar clientes». O Claude envia o roteiro (lesson_start) e a aba «Lição» aparece no painel de resultados da transformação.
