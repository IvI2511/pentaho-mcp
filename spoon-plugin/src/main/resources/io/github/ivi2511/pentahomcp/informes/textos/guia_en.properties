nivel.beginner=beginner
nivel.intermediate=intermediate
n.paso.1=%d step
n.paso.n=%d steps
n.vista.1=%d preview captured in class
n.vista.n=%d previews captured in class
resumen=Lesson "%s" (%s, %s): %s.

aviso.desde_notas=Spoon was restarted after the class or the document was opened from a file: the handout comes from the notes and the lesson registry, without the preview rows or the final exercise.
aviso.a_medias=The lesson is at step %d of %d: the remaining steps come from the script, without rows.
aviso.ocultas=The lesson notes are hidden (lesson_notes hide): the canvas image does not show them.

