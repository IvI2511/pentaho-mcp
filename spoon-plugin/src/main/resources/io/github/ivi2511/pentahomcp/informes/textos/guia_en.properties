# Section "Lesson handout" (lesson, SecLeccion): the class mode handout. Owner: clase. Read as UTF-8. Patterns use
# String.format with the report locale: %s text, %d integer. Plurals: <key>.1 for one, <key>.n for the rest. The
# labels What, Why, Watch out!, Tip and Question? are the ones of the notes.

motivo.job=The lesson handout is only for transformations.
motivo.sin_leccion=This document has no class mode lesson (lesson_start).

