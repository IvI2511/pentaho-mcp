ui.as_izq_ayuda=Puedes volver a un paso ya hecho haciendo clic en él. No se guarda nada hasta que pulses «Guardar pack».
ui.as_intro1=Un pack es lo que usa el corrector para puntuar las entregas: tu solución, los datos con los que se ejecuta y qué se compara. Casi todo viene ya relleno: revisa y pulsa «Siguiente».
ui.as_intro2=Con qué datos se ejecutan tu solución y la de cada alumno. Al pulsar «Siguiente» se ejecuta tu solución en un proceso aparte para ver qué produce (tarda unos segundos).
ui.as_intro3=Esto es lo que produjo tu solución con los datos del caso visible. El corrector compara el resultado de cada alumno con esto: marca qué columnas identifican cada fila y cuáles no hay que comparar.
ui.as_intro4=La nota es la suma de los puntos de cada criterio, llevada a la escala. Las reglas de diseño comprueban cómo está hecha la transformación y son opcionales.
ui.as_intro5=Revisa el resumen y pulsa «Guardar pack».
ui.as_solucion=Solución
ui.as_solucion_info=%s · %s pasos · %s
ui.as_solucion_info_bd=%s · %s pasos · %s\nUsa base de datos: %s
ui.as_titulo_ayuda=Lo ven tus alumnos en su informe. Ejemplo: «Ejercicio 2 · Carga del data warehouse».
ui.as_captura_ayuda=El corrector ejecuta la entrega de cada alumno y compara este resultado con el de tu solución. Si tu solución carga tablas en una base de datos, lo normal es comparar esas tablas.
ui.as_destino_ayuda=Una carpeta nueva (o vacía) o un archivo .zip. Ejemplo: C:\\Clases\\pack-ejercicio-2
ui.as_destino_lleno=Esa carpeta ya tiene archivos y no es un pack: elige una carpeta nueva o vacía, o un .zip.
ui.as_destino_pack=Ya hay un pack ahí: al guardar se reemplazará.
ui.as_idioma_ayuda=El idioma de las devoluciones a los alumnos y del enunciado.
ui.as_copia_ayuda=Un .zip con el enunciado y los datos del caso visible, sin tu solución ni el caso oculto, para que lo repartas.
ui.as_visible_archivos=Caso visible: los archivos que lee tu solución se copian al pack al ejecutarla. El alumno ve sus valores en la devolución.
ui.as_oculto_ayuda=Opcional. Otra carpeta con archivos de entrada con los mismos nombres pero otros datos: se corrige igual, pero el alumno no ve sus valores (así no puede ajustar su solución a los datos). Ejemplo: C:\\Clases\\ejercicio-2\\oculto
ui.as_base_por_que=Tu solución lee y escribe en una base de datos. Para corregir sin tocar tus bases, cada entrega se ejecuta en una copia desechable (la base de prueba) que se borra y se vuelve a crear con tus scripts antes de cada ejecución.
ui.as_base_clave_ayuda=La de ese usuario en ese servidor. Se queda en memoria hasta que cierres Spoon: nunca se guarda en el pack ni en ningún archivo. Déjala vacía si no tiene.
ui.as_base_nombre_ayuda=Se borra y se vuelve a crear en cada ejecución: nunca una con datos que quieras conservar. Tiene que terminar en _correccion o _test. Ejemplo: gym_dw_correccion
ui.as_base_probar=Probar conexión
ui.as_base_probando=Probando: creo y borro la base de prueba…
ui.as_base_probado_ok=✓ Conexión correcta: se pudo crear y borrar «%s».
ui.as_base_probado_mal=No se pudo: %s
ui.as_base_scripts_ayuda=Archivos .sql que crean las tablas y cargan los datos de partida, separados por «;»; corren en este orden en la base de prueba vacía. Ejemplo: crear_gym.sql; datos_gym.sql
ui.as_base_detectados=Encontrados junto a tu solución y ya puestos: %s
ui.as_base_sin_detectados=No encontré scripts .sql junto a tu solución. Elige los tuyos con «…» o genera uno desde tu base.
ui.as_base_sin_scripts=Sin scripts la base de prueba queda vacía: tu solución no encontrará sus tablas.
ui.as_base_generar=Generar el script desde la base actual…
ui.as_base_generar_ayuda=Lee tu base «%s» sin modificarla (solo consultas) y escribe un script con sus tablas y sus datos para que lo revises. Las tablas que carga tu solución van vacías. Usa la contraseña de arriba.
ui.as_base_generando=Leyendo «%s» (solo lectura)…
ui.as_base_generado=Script generado: %s (%s tablas, %s filas). Ya está en «Scripts»: ábrelo y revísalo antes de guardar.
