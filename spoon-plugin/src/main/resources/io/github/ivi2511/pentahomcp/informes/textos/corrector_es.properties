ui.as_base_generar_mal=No se pudo generar el script: %s
ui.as_guardar_script=Dónde guardar el script generado
ui.as_base_oculto_ayuda=Opcional: scripts con otros datos para un caso que el alumno no ve; corren después de los de arriba. Ejemplo: datos_oculto.sql
ui.as_dos_veces_ayuda=Detecta una carga que duplica filas al repetirla: entre las dos ejecuciones la base de prueba no se vuelve a crear, así que un Insert/Update deja las mismas tablas y un Table output las duplica.
