pista.values=Revisa cómo calculas «%s»: no coincide en algunas filas.
pista.comma_decimal=Tus números salen con coma decimal: esta vez se aceptan, pero declara el «.» como símbolo decimal en el step de salida.
pista.comma_decimal.strict=Tus números salen con coma decimal y este ejercicio pide punto: declara el «.» como símbolo decimal en el step de salida.
