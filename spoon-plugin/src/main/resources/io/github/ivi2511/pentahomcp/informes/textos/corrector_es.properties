ui.as_claves_ayuda=«Identifica la fila»: las columnas que distinguen una fila de otra (como id_cliente); el corrector empareja las filas del alumno con las tuyas por ellas (sin ninguna, se comparan en orden). «No comparar»: las que cambian en cada ejecución, como ids autonuméricos o fechas de carga.
