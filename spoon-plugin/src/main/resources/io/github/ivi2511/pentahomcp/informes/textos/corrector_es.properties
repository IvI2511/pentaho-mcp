# Corrector de ejercicios (docs/corrector-diseno.md): area «corrector» de Rotulos. Se lee en UTF-8.
# Los patrones usan String.format con el locale del idioma: %s texto, %d entero, %,d entero con miles, %.2f
# decimal, %% un porciento. Cada paquete de trabajo agrega su bloque con sus claves; no tocar las de otro.

