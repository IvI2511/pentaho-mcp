ui.as_salida_ayuda=El paso cuyo resultado se compara. «(el detectado)» es el último paso de tu solución. Si lo cambias, pulsa «Volver a ejecutar».
ui.as_reanalizar_pendiente=Cambiaste el paso: pulsa «Volver a ejecutar» para ver su resultado.
ui.as_tabla_vista_ayuda=Elige una tabla para ver qué cargó tu solución y marcar sus columnas.
