# Corrector de ejercicios (docs/corrector-diseno.md): area «corrector» de Rotulos. Se lee en UTF-8.
# Los patrones usan String.format con el locale del idioma: %s texto, %d entero, %,d entero con miles, %.2f
# decimal, %% un porciento. Cada paquete de trabajo agrega su bloque con sus claves; no tocar las de otro.

# ---------------------------------------------------------------- C5 · CorrectorNota (nota, pistas, .md)

# renglones de la rubrica
check.runs=Corre sin errores
check.columns=Columnas correctas
check.row_count=Cantidad de filas
check.values=Valores correctos
check.lint=Sin problemas de «%s» (linter)

# detalle de un renglon
detalle.caso=%s %d%%
detalle.caso_no_corrio=%s: %s
detalle.no_corrio=No se ejecutó: %s
detalle.compuerta=no suma porque falla «%s»
detalle.no_evaluada=No evaluada: %s
detalle.regla_sin_resultado=la regla no se evaluó
detalle.regla_inexistente=el pack no tiene la regla «%s»
detalle.check_desconocido=check desconocido

# estado de la entrega (status)
estado.graded=corregida
estado.blocked=bloqueada
estado.timeout=tiempo agotado
estado.killed_timeout=cortada por tiempo
estado.load_failed=no se pudo abrir
estado.crashed=interrumpida
estado.running=en curso

# estado de un caso (run.state)
caso.finished=terminó
caso.finished_with_errors=terminó con errores
caso.timeout=no terminó a tiempo
caso.too_many_rows=demasiadas filas
caso.output_too_big=salida demasiado grande
caso.init_failed=no se pudo inicializar
caso.start_failed=no arrancó
caso.no_output_step=sin step de salida
caso.blocked=bloqueado
caso.not_run=no corrió

# motivo de un bloqueo (reason)
motivo.step_not_allowed=step no permitido
motivo.dangerous_step=step peligroso
motivo.unknown_step=step desconocido
motivo.foreign_connection=conexión ajena al ejercicio
motivo.unexpected_input=lee fuera del ejercicio
motivo.unexpected_output=escribe donde dice un campo
motivo.duplicate_step_name=dos steps con el mismo nombre
motivo.cycle=hop circular
motivo.forbidden_sql=SQL no permitido
motivo.rewrite_failed=no se pudo preparar la copia

# reglas del pack: etiqueta por tipo (si el pack no trae label) y detalle
regla.must_use=Usa %s
regla.must_not_use=No usa %s
regla.max_steps=Como mucho %d steps
regla.error_handling=Maneja los errores en %s
regla.lint=Sin problemas de «%s» (linter)
regla.encontrado=Encontrado: %s
regla.no_encontrado=Ningún step de tipo %s
regla.no_llega=%s no llega al step de salida %s
