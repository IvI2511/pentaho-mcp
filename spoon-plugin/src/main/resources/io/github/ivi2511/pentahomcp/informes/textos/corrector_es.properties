# pistas para el alumno (una frase cada una; sin valores de los casos ocultos)
pista.load_failed=No se pudo abrir tu archivo: guardalo de nuevo desde Spoon como .ktr (sin DOCTYPE ni cambios a mano en el XML).
pista.blocked_step=No está permitido en este ejercicio: %s. Resolvelo con otros steps.
pista.blocked_step.dangerous=No está permitido en este ejercicio: %s ejecuta comandos, código o conexiones del sistema.
pista.blocked_step.unknown=%s usa un tipo de step que no está instalado o no se conoce: usá los steps estándar de PDI.
pista.blocked_step.generico=Tu transformación usa un step que no está permitido en este ejercicio.
pista.read_outside_pack=Tu transformación lee archivos que no son los del enunciado (o toma la ruta de un campo o de una URL): leé solo los datos del ejercicio (%s).
pista.read_outside_pack.generico=Tu transformación lee archivos que no son los del enunciado (o toma la ruta de un campo o de una URL): leé solo los datos del ejercicio.
pista.unexpected_output=La salida toma el nombre del archivo de un campo: escribí a un archivo con nombre fijo.
pista.foreign_connection=Usás una conexión a otra base de datos: este ejercicio trabaja solo con la base que viene con él.
pista.forbidden_sql=Tu SQL usa ATTACH DATABASE, VACUUM INTO o load_extension, que no están permitidos: trabajá solo sobre la base del ejercicio.
pista.rewrite_failed=No se pudo preparar tu transformación para corregirla: avisale al docente.
pista.D1=Dos steps se llaman igual (sin distinguir mayúsculas): Kettle los junta en uno y la transformación se cuelga o pierde filas. Poneles nombres distintos.
pista.D2=Hay un hop circular: las filas darían vueltas para siempre. Quitá el hop que vuelve hacia atrás.
pista.timeout=No terminó en %d s: buscá un hop que vuelva hacia atrás o un Generate rows sin límite.
pista.crashed=La corrección se interrumpió: probá tu transformación en Spoon y revisá el log.
pista.output_too_big=Escribió más de %d MB: ¿un Generate rows sin límite o un hop que vuelve hacia atrás?
pista.too_many_rows=Sacó más de %,d filas: revisá que no estés multiplicando filas (un cruce sin clave, un Generate rows).
pista.init_failed=Algún step no pudo arrancar: corré la transformación en Spoon y mirá el primer error del log.
pista.finished_with_errors=Terminó con errores: corré la transformación en Spoon y mirá qué step marca el error.
pista.no_output_step.file=No hay un Text file output del que tomar tu resultado: el ejercicio espera la salida en un archivo de texto.
pista.no_output_step.step=No se encontró el step de salida «%s»: usá ese nombre para el step que deja el resultado.
pista.no_output_step.query=No se encontró dónde escribís el resultado: tiene que quedar en la base del ejercicio, con un Table output.
pista.missing_column=Falta la columna «%s»: revisá la lista de campos del step de salida.
pista.extra_column=Tu salida tiene la columna «%s», que el enunciado no pide.
pista.extra_column.penalize=Sobra la columna «%s»: el enunciado no la pide y en este ejercicio resta.
pista.rename=La columna «%s» no está, pero «%s» tiene los mismos valores: ¿la renombraste?
pista.column_order=Las columnas salen en otro orden que el pedido: ordenalas como en el enunciado.
pista.D5=Tu salida repite claves: el Group by agrupa solo filas consecutivas. Poné un Sort rows por las mismas claves antes del Group by (o usá Memory group by).
pista.duplicate_keys=Tu salida repite claves (%s): cada una tendría que salir una sola vez.
pista.missing_rows=Faltan filas que tendrían que estar: ¿un filtro de más o un cruce que las pierde?
pista.extra_rows=Sobran filas que no tendrían que estar: ¿falta un filtro?
pista.D3=Algunos números salen multiplicados por 100: declarale el símbolo decimal «.» al leer el archivo.
pista.D4=Los importes salen como si el precio estuviera redondeado: en el Calculator poné el campo con decimales en «Campo A».
pista.D6=Se pierden o sobran cruces del Merge join: ordená las dos entradas por la clave del join, en el mismo orden.
pista.values=Revisá cómo calculás «%s»: no coincide en algunas filas.
pista.comma_decimal=Tus números salen con coma decimal: esta vez se aceptan, pero declará el «.» como símbolo decimal en el step de salida.
pista.comma_decimal.strict=Tus números salen con coma decimal y este ejercicio pide punto: declará el «.» como símbolo decimal en el step de salida.
pista.encoding=Hay letras con acento que salen rotas (Ã©, �): declará el encoding UTF-8 en el step de salida.

