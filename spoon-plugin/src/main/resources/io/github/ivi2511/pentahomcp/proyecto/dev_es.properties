# Entorno de desarrollo (ejemplo compartido; sin secretos).
# Pásalo a Pan/Kitchen o defínelo en Spoon (Editar > Configurar entorno). Tus valores reales y
# las contraseñas van en env/local.properties, que .gitignore deja fuera del repositorio.
# Ruta absoluta de la carpeta datasets/ de tu copia del proyecto (una relativa se resolvería contra la carpeta de PDI)
DIR_DATOS=/ruta/a/tu/copia/datasets
DIR_SALIDA=/ruta/a/tu/copia/salida
DB_HOST=localhost
DB_PORT=5432
DB_NAME=dev
DB_USER=etl
# DB_PASSWORD va en env/local.properties, nunca aquí
